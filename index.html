/* ============================= ROADMAP ============================= */
function renderRoadmap(){
  // A Foundation failure is the only case that still routes to the full-page
  // error/retry (state.errorMsg) — it's the "core" section per the roadmap
  // architecture fix, and there's nothing meaningful to show without it.
  // Action Plan / Direction failures never set state.errorMsg, specifically
  // so a paying user keeps seeing whatever already succeeded instead of
  // losing it behind a full-page error.
  if(state.errorMsg) return renderError();
  const r = state.roadmap;
  if(!r) return renderAnalyzing();
  const sections = state.roadmapSections;
  const sectionErrors = state.roadmapSectionError;

  const actionPlanBlock = sections.actionPlan === 'ready' ? `<div class="roadmap-section">
      <h3>Your action plan</h3>
      <div class="ladder-level"><div class="lvl-name">First 7 days</div><ul>${(r.plan.first7||[]).map(i=>`<li>${i}</li>`).join('')}</ul></div>
      <div class="ladder-level"><div class="lvl-name">Days 8–30</div><ul>${(r.plan.days8to30||[]).map(i=>`<li>${i}</li>`).join('')}</ul></div>
      <div class="ladder-level"><div class="lvl-name">Days 31–60</div><ul>${(r.plan.days31to60||[]).map(i=>`<li>${i}</li>`).join('')}</ul></div>
      <div class="ladder-level"><div class="lvl-name">Days 61–90</div><ul>${(r.plan.days61to90||[]).map(i=>`<li>${i}</li>`).join('')}</ul></div>
    </div>
    <div class="roadmap-section"><h3>Your next best step</h3><p style="color:var(--ink);font-weight:600;">${r.nextStep}</p></div>`
    : renderRoadmapSectionRetry('Your action plan', 'actionPlan', sections.actionPlan, sectionErrors.actionPlan);

  const directionBlock = sections.direction === 'ready' ? `
    <div class="eyebrow mt-32"><span class="dot"></span>Your Career Sequence</div>
    <div class="sequence-track">
      <div class="seq-stop"><div class="seq-lbl">Now</div><h4>${r.sequence.now.title}</h4><p>${r.sequence.now.desc}</p></div>
      <div class="seq-stop"><div class="seq-lbl">Next</div><h4>${r.sequence.next.title}</h4><p>${r.sequence.next.desc}</p></div>
      <div class="seq-stop"><div class="seq-lbl">Later</div><h4>${r.sequence.later.title}</h4><p>${r.sequence.later.desc}</p></div>
    </div>
    <div class="roadmap-section"><h3>Learning ladder</h3>
      ${(r.learn||[]).map(l=>`<div class="ladder-level"><div class="lvl-name">${l.level}</div><ul>${(l.items||[]).map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}
    </div>
    <div class="roadmap-section"><h3>How to position this experience</h3><p style="color:var(--ink);">${r.positioning}</p></div>
    <div class="roadmap-section"><h3>Search terms</h3><div class="path-tags">${(r.searchTerms||[]).map(t=>`<span class="mini-tag">${t}</span>`).join('')}</div></div>`
    : renderRoadmapSectionRetry('Your career sequence & learning strategy', 'direction', sections.direction, sectionErrors.direction);

  return `
  <div class="wrap"><div class="screen">
    <div class="eyebrow"><span class="dot"></span>Your roadmap</div>
    <h1 style="font-size:32px;">Your Roadmap to ${state.chosenPath.title}</h1>
    <div class="not-zero">You're not starting from zero.</div>

    ${state.roadmapStatus === 'partial' ? `<div class="change-summary mt-32">Your demo unlock is complete — no real payment was collected. Most of your roadmap is ready below — one section needs a retry.</div>` : ''}

    ${directionBlock}

    <div class="roadmap-section"><h3>Where you are now</h3><p style="color:var(--ink);">${r.whereYouAre}</p></div>
    <div class="roadmap-section"><h3>What already transfers</h3><ul>${(r.transfers||[]).map(t=>`<li>${t}</li>`).join('')}</ul></div>
    <div class="roadmap-section"><h3>What we need to understand better</h3><ul>${(r.understandBetter||[]).map(t=>`<li>${t}</li>`).join('')}</ul></div>
    <div class="roadmap-section"><h3>What you may need to strengthen</h3><ul>${(r.strengthen||[]).map(t=>`<li>${t}</li>`).join('')}</ul></div>

    ${actionPlanBlock}

    <div class="mt-40"><button class="btn btn-primary" id="toKit">Build My Resume & LinkedIn Language</button></div>
  </div></div>`;
}
function renderRoadmapSectionRetry(label, sectionKey, status, errorText){
  const busy = status === 'generating';
  return `<div class="roadmap-section">
    <h3>${label}</h3>
    <p style="font-size:14px;">${busy ? 'Generating…' : (errorText || "This section hasn't been generated yet.")}</p>
    ${!busy ? `<button class="btn btn-ghost btn-sm" data-retry-section="${sectionKey}">Retry ${label}</button>` : ''}
  </div>`;
}

    <div class="error-box"><strong>Something went wrong reaching iFindWorth's analysis.</strong><br/>${state.errorMsg}
      <br/><button class="btn btn-primary btn-sm" id="retryBtn">${state.errorRetryLabel || 'Try Again'}</button>
    </div>
  </div></div>`;
}

/* ============================= EVENT HANDLERS ============================= */
function attachHandlers(){
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.errorMsg=''; state.errorRetryLabel=null; state.screen = el.getAttribute('data-go'); render(); });
  });
  document.querySelectorAll('[data-scroll]').forEach(el=>{
    el.addEventListener('click', ()=>{ const t=document.getElementById(el.getAttribute('data-scroll')); if(t) t.scrollIntoView({behavior:'smooth'}); });
  });

  // intake
  const storyInput = document.getElementById('storyInput');
  if(storyInput){
    storyInput.addEventListener('input', (e)=>{
      state.story = e.target.value;
      const wc = state.story.trim() ? state.story.trim().split(/\s+/).length : 0;
      document.querySelector('.wordcount').textContent = wc + ' words';
      const btn = document.getElementById('submitStory'); if(btn) btn.disabled = wc < 8;
      saveProfileToStorage(state);
    });
  }
  document.querySelectorAll('.prompts .prompt-chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      const ta = document.getElementById('storyInput'); if(!ta) return;
      ta.focus();
      const q = el.textContent.trim();
      ta.value = (ta.value ? ta.value.trim() + '\n\n' : '') + q + ' ';
      state.story = ta.value;
      ta.setSelectionRange(ta.value.length, ta.value.length);
      const wc = state.story.trim() ? state.story.trim().split(/\s+/).length : 0;
      document.querySelector('.wordcount').textContent = wc + ' words';
      const btn = document.getElementById('submitStory'); if(btn) btn.disabled = wc < 8;
    });
  });
  const micBtn = document.getElementById('micBtn'); if(micBtn) micBtn.addEventListener('click', toggleVoice);
  const submitStory = document.getElementById('submitStory'); if(submitStory) submitStory.addEventListener('click', analyzeSkills);

  // skills
  document.querySelectorAll('[data-validate]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const name = decodeURIComponent(el.getAttribute('data-validate'));
      const val = el.getAttribute('data-val');
      state.skillValidation[name] = state.skillValidation[name]===val ? undefined : val;
      render();
    });
  });
  const toPaths = document.getElementById('toPaths'); if(toPaths) toPaths.addEventListener('click', ()=>{ discoverPaths(); });

  // paths
  document.querySelectorAll('[data-path]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const title = decodeURIComponent(el.getAttribute('data-path'));
      const p = state.paths.find(p=>p.title===title);
      state.chosenPath = (state.chosenPath && state.chosenPath.title===title) ? null : p;
      render();
    });
  });
  const toConvo = document.getElementById('toConvo');
  if(toConvo) toConvo.addEventListener('click', ()=>{
    if(!state.convo.length){
      state.convo.push({who:'ai', text: "I've laid out the paths I found strongest evidence for first, then a few worth exploring. What's your first reaction — does anything surprise you, or feel off?"});
    }
    state.screen = 'conversation'; render();
  });

  // conversation
  const convoSend = document.getElementById('convoSend'); if(convoSend) convoSend.addEventListener('click', sendConvo);
  const convoInput = document.getElementById('convoInput');
  if(convoInput) convoInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendConvo(); });
  document.querySelectorAll('.prompt-chip[data-fill]').forEach(el=>{
    el.addEventListener('click', ()=>{ const input=document.getElementById('convoInput'); if(input) input.value = decodeURIComponent(el.getAttribute('data-fill')); });
  });
  const toChoose = document.getElementById('toChoose'); if(toChoose) toChoose.addEventListener('click', ()=>{ state.screen='choose'; render(); });
  document.querySelectorAll('[data-rerank]').forEach(el=> el.addEventListener('click', refinePaths));
  document.querySelectorAll('[data-dismiss-learned]').forEach(el=> el.addEventListener('click', ()=>{
    const input = document.getElementById('convoInput'); if(input) input.focus();
  }));

  // choose
  document.querySelectorAll('[data-choose]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const title = decodeURIComponent(el.getAttribute('data-choose'));
      state.chosenPath = state.paths.find(p=>p.title===title);
      render();
    });
  });
  document.querySelectorAll('[data-priority]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const p = decodeURIComponent(el.getAttribute('data-priority'));
      if(state.priorities.includes(p)) state.priorities = state.priorities.filter(x=>x!==p);
      else state.priorities.push(p);
      render();
    });

  const toPaywall = document.getElementById('toPaywall'); if(toPaywall) toPaywall.addEventListener('click', ()=>{ state.screen='paywall'; render(); });

  // paywall
  const doCheckout = document.getElementById('doCheckout');
  if(doCheckout) doCheckout.addEventListener('click', handleCheckout);

  // roadmap
  const toKit = document.getElementById('toKit'); if(toKit) toKit.addEventListener('click', buildKit);
  document.querySelectorAll('[data-retry-section]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const section = el.getAttribute('data-retry-section');
      if(section === 'actionPlan') buildRoadmapActionPlan();
      else if(section === 'direction') buildRoadmapDirection();
    });
  });

  // kit
  const toDashboard = document.getElementById('toDashboard'); if(toDashboard) toDashboard.addEventListener('click', ()=>{ state.screen='dashboard'; render(); });
  document.querySelectorAll('[data-headline]').forEach(el=>{

  });
  document.querySelectorAll('[data-strengthen-open]').forEach(el=>{
    el.addEventListener('click', ()=>{

  const backToKit = document.getElementById('backToKit'); if(backToKit) backToKit.addEventListener('click', ()=>{ state.screen='kit'; render(); });
  const exploreAnother = document.getElementById('exploreAnother'); if(exploreAnother) exploreAnother.addEventListener('click', ()=>{ state.screen='choose'; render(); });
  const addExpBtn = document.getElementById('addExpBtn'); if(addExpBtn) addExpBtn.addEventListener('click', ()=>{ state.screen='addExperience'; render(); });
  const openStoryBank = document.getElementById('openStoryBank'); if(openStoryBank) openStoryBank.addEventListener('click', openStoryBankFn);

  // story bank
  document.querySelectorAll('[data-story-add]').forEach(el=>{

      const input = document.getElementById('storyDetail'+i);

  const jdInput = document.getElementById('jdInput');
  if(jdInput) jdInput.addEventListener('input', (e)=>{ state.jdText = e.target.value; saveProfileToStorage(state); });
  const submitJd = document.getElementById('submitJd'); if(submitJd) submitJd.addEventListener('click', analyzeJd);

  // error retry
  const retryBtn = document.getElementById('retryBtn');
  if(retryBtn) retryBtn.addEventListener('click', ()=>{ const retry = state.errorRetry; state.errorMsg=''; state.errorRetry=null; state.errorRetryLabel=null; if(retry) retry(); });
}

/* ============================= VOICE INPUT ============================= */
let recognition = null;
function toggleVoice(){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRec){
    document.getElementById('voiceWarning').innerHTML = `<p style="font-size:12.5px;color:var(--clay);margin-top:10px;">Voice input isn't available in this browser. Please type your story instead.</p>`;
    return;
  }
  if(state.recording){ if(recognition) recognition.stop(); state.recording = false; render(); return; }
  recognition = new SpeechRec();
  recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-US';
  let finalTranscript = state.story ? state.story + ' ' : '';
  recognition.onresult = (event)=>{
    let interim = '';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const t = event.results[i][0].transcript;
      if(event.results[i].isFinal) finalTranscript += t + ' '; else interim += t;
    }
    const ta = document.getElementById('storyInput');
    if(ta){
      ta.value = finalTranscript + interim; state.story = ta.value;
      const wc = state.story.trim() ? state.story.trim().split(/\s+/).length : 0;
      const wcEl = document.querySelector('.wordcount'); if(wcEl) wcEl.textContent = wc + ' words';
      const btn = document.getElementById('submitStory'); if(btn) btn.disabled = wc < 8;
    }
  };
  recognition.onerror = ()=>{
    state.recording = false; render();
    document.getElementById('voiceWarning').innerHTML = `<p style="font-size:12.5px;color:var(--clay);margin-top:10px;">We couldn't access your microphone. Please check permissions or type your story instead.</p>`;
  };
  recognition.onend = ()=>{ state.recording = false; render(); };
  recognition.start(); state.recording = true; render();
}

/* ============================= AI FLOW FUNCTIONS ============================= */
async function analyzeSkills(){
  if(state.busy) return;
  state.busy = true;
  state.screen = 'analyzing'; state.loadingMsg = 'Reading through what you shared…'; state.errorMsg=''; render();
  const system = `You are the Experience Translator inside iFindWorth. A user describes, in their own words, things they've done. Identify transferable professional skills genuinely supported by what they wrote.
${NO_INVENTION_RULE}
Rules: 1) Only include skills with real textual evidence. 2) evidence: a close paraphrase (max 16 words) of what they said, warm plain-language ("You described..."), staying literal — do not generalize it into a broader claim. 3) Calibrate strength honestly: "Strong" only for clear, repeated, or elaborated evidence; "Moderate" for a single plain mention without elaboration; "Developing" for something implied or mentioned only in passing; "Needs More Information" if the evidence is too thin to be confident but the activity is still plausibly relevant. Do not default to "Strong" just because an activity was mentioned once. 4) Return 4 to 7 skills, strongest first.`;
  try{
    const result = await callStructured('analyzeSkills', system, fullStoryText(), skillsTool, TOKEN_BUDGETS.skills, validateSkillsResult, normalizeSkillsResult, SKILLS_REPAIR_HINT);
    state.skills = result.skills;
    state.screen = 'skills';
  }catch(err){
    logDiag('analyzeSkills', 'final_failure', err.message || String(err));
    state.errorMsg = "We couldn't analyze your story just now. Nothing was lost — you can try again.";
    state.errorRetry = analyzeSkills; state.screen = 'skills';
  }finally{
    state.busy = false; render();
  }
}

async function discoverPaths(){
  if(state.busy) return;
  state.busy = true;
  state.screen = 'analyzing'; state.loadingMsg = 'Mapping your skills to possible directions…'; state.errorMsg=''; render();
  const retainedStorySkills = getRetainedStorySkills();
  const rejected = getRejectedSkillNames();
  const retainedSkillNames = retainedStorySkills.map(s=>s.name);
  const system = `You are the career path engine inside iFindWorth. Given a user's story and retained story skills, generate realistic career path options.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Rules:
1) Return 4 to 5 high-quality paths (quality over quantity) across categories (use exact strings): "Strong Evidence", "Worth Exploring", "Growth Path", "Independent Path". Aim to cover: the strongest employment path, one strong alternative, one growth direction, and one independent/freelance/entrepreneurship path when plausible. A 5th path is fine only if it adds real variety.
2) Never say someone is unqualified — note what's uncertain instead.
3) Career-level calibration: for each path give an entryPoint (realistic first title, max 5 words) and a progression (next-level title, max 5 words) rather than one senior title.
4) Do not use unverified market-hype claims (e.g. "rare", "in high demand") unless the user's own text supports it. Prefer neutral evidence-based language.
5) transfers must ONLY use skill names copied exactly from the "Retained story skills" list below — never a rejected skill, never a skill you infer independently from the story, never a paraphrase.
6) workEnvironment describes the day-to-day nature of the role (pace, team structure, desk-based vs. hands-on) — never state or imply remote/hybrid/on-site availability, since that varies by employer and is not something you can verify. Keep it to a few words.
7) title = the entryPoint; why max 18 words, evidence-based, no filler; transfers = 2-3 exact names from the retained story skills list; gaps = 1-2 short phrases (max 5 words); transition is REQUIRED on every single path and must be exactly one of "Strong" | "Moderate" | "Developing" | "Needs More Information" — never omit it, and never leave it blank. fitEvidence is optional and, if included, uses the same four values. Do NOT generate interest or lifestyle fit — the user hasn't given preference data yet, so those are filled in later (after the results conversation and reranking), not here. Keep every field concise.${rejectedSkillsClause()}`;
  const userPrompt = `User's story:\n${fullStoryText()}\n\nRetained story skills (supported by the user's story — the only names allowed in "transfers"):\n${skillsSummaryStr(retainedStorySkills)}`;
  try{
    const result = await callStructured('discoverPaths', system, userPrompt, pathsTool, TOKEN_BUDGETS.paths, validatePathsResult, normalizePathsResult, PATHS_REPAIR_HINT);
    let paths = result.paths;
    // Defense-in-depth (runs on a repaired result exactly the same as a first-try
    // one — no shortcut around these checks either way): strip any rejected
    // skill from transfers and scrub rejected-skill mentions out of freeform
    // reasoning text before this ever reaches the UI.
    paths = paths.map(p => ({
      ...p,
      transfers: filterToValidatedNames(p.transfers, retainedSkillNames),
      // Filled in client-side, not generated: no preference data exists yet
      // at this point in the flow, so there's nothing real to compute here —
      // rerankPaths() replaces these with real values once the user has told
      // us something. Setting them now (rather than asking the model to) is
      // both more honest and saves the exact output budget that was causing
      // the truncation this fix addresses.
      fitInterest: 'Needs More Information',
      fitLifestyle: 'Needs More Information',
    }));
    paths = purgeRejectedFromObject(paths, rejected);
    state.paths = paths;
    state.reranked = false; state.changeSummary='';
    state.screen = 'paths';
  }catch(err){
    logDiag('discoverPaths', 'final_failure', err.message || String(err));
    state.errorMsg = "We couldn't map career paths just now. Nothing was lost — you can try again.";
    state.errorRetry = discoverPaths; state.screen = 'paths';
  }finally{
    state.busy = false; render();
  }
}

async function sendConvo(){
  if(state.convoBusy) return;
  const input = document.getElementById('convoInput');
  if(!input || !input.value.trim()) return;
  const userText = input.value.trim();
  state.convo.push({who:'user', text: userText}); // item 7: original message preserved regardless of what happens next
  state.convoBusy = true;
  input.value=''; render();

  const rejected = getRejectedSkillNames();

  // Step 1: the conversational reply — plain text, not a forced tool call.
  // Preferred, not guaranteed to be "structured," because it was never
  // supposed to be data in the first place.
  const replySystem = `You are iFindWorth, discussing career discovery results with a user before they choose a direction. Be warm, specific, and evidence-based — never generic encouragement.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Reply in 2-4 sentences of plain text only — no markdown, no JSON, no preamble, no field labels.${rejectedSkillsClause()}`;
  const replyContext = `Original story: ${state.story}\n\nRetained story skills: ${getRetainedStorySkills().map(s=>s.name).join(', ')}\n\nCareer paths shown: ${state.paths.map(p=>p.title).join(', ')}\n\nAlready known interests: ${state.preferences.interests.join(', ')}\nAlready known dislikes: ${state.preferences.dislikes.join(', ')}\n\nUser's message: ${userText}`;

  let cleanReply;
  try{
    const replyText = await callTextWithRetry('sendConvo', replySystem, replyContext, TOKEN_BUDGETS.convo);
    cleanReply = purgeRejectedMentions(replyText, rejected);
    state.convo.push({who:'ai', text: cleanReply});
  }catch(err){
    // Only a genuinely unusable response (nothing came back at all, even
    // after one retry) shows the "couldn't process" message — a usable reply
    // never reaches this branch.
    logDiag('sendConvo', 'final_failure', err.message || String(err));
    state.convo.push({who:'ai', text: "I couldn't process that just now — want to try rephrasing, or continue to choosing a direction?"});
    state.convoBusy = false; render();
    const focusInput = document.getElementById('convoInput'); if(focusInput) focusInput.focus();
    return;
  }
  render(); // reply is shown now, independent of whatever happens with extraction below

  // Step 2: a small, separate, structured extraction of any preference
  // signal. Decoupled on purpose — this can fail (even after its own
  // repair attempts) without ever retracting or blocking the reply already
  // shown, and the conversation simply continues either way.
  try{
    const deltaSystem = `You extract structured preference signals for iFindWorth's Career Intelligence Profile from one turn of a career-discovery conversation. Only include a genuine new preference signal — something the user wants more or less of in their work — never invent one. If nothing new was signaled, return empty arrays and an empty summary. Never repeat a preference already known.${rejectedSkillsClause()}`;
    const deltaPrompt = `Already known interests: ${state.preferences.interests.join(', ')}\nAlready known dislikes: ${state.preferences.dislikes.join(', ')}\n\nUser's message: ${userText}\nAssistant's reply: ${cleanReply}`;
    const delta = await callStructured('sendConvoProfileDelta', deltaSystem, deltaPrompt, profileDeltaTool, TOKEN_BUDGETS.profileDelta, validateProfileDeltaResult, normalizeProfileDeltaResult);
    const cleanDelta = purgeRejectedFromObject(delta, rejected);
    const incomingInterests = [...cleanDelta.interests, ...cleanDelta.preferences]; // "preferences" folds into the same interests signal reranking already consumes
    const newInterests = incomingInterests.filter(x=>!state.preferences.interests.includes(x) && !rejected.some(r=>r.toLowerCase()===String(x).toLowerCase()));
    const newDislikes = cleanDelta.dislikes.filter(x=>!state.preferences.dislikes.includes(x) && !rejected.some(r=>r.toLowerCase()===String(x).toLowerCase()));
    if(newInterests.length || newDislikes.length){
      state.preferences.interests = [...state.preferences.interests, ...newInterests];
      state.preferences.dislikes = [...state.preferences.dislikes, ...newDislikes];
      state.convo.push({who:'learned', interests:newInterests, dislikes:newDislikes});
    }
  }catch(err){
    // Item 8: logged only — never shown to the user, never retracts the
    // reply, and the conversation proceeds normally either way.
    logDiag('sendConvoProfileDelta', 'final_failure', err.message || String(err));
    safeLog('warn', '[CareerLaunch][sendConvoProfileDelta] Profile mutation could not be completed this turn — conversation continues unaffected.');
  }finally{
    state.convoBusy = false; render();
    const focusInput = document.getElementById('convoInput'); if(focusInput) focusInput.focus();
  }
}

async function refinePaths(){
  if(state.busy) return;
  state.busy = true;
  const priorPaths = state.paths;
  state.screen = 'analyzing'; state.loadingMsg = 'Updating your recommendations…'; state.errorMsg=''; render();
  const retainedStorySkills = getRetainedStorySkills();
  const rejected = getRejectedSkillNames();
  const retainedSkillNames = retainedStorySkills.map(s=>s.name);
  const system = `You are the career path refinement engine inside iFindWorth. The user reviewed initial career paths and stated what they want more and less of. Regenerate a fresh set of 4-5 realistic career path options. You MAY introduce new paths and you do NOT need to keep every original path.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Keep these dimensions separate:
- transition (and fitEvidence if included): EVIDENCE FIT ONLY — how strongly the user's story-supported experience supports this path. Never rate Strong solely because the user wants this direction.
- fitInterest: INTEREST FIT — how well this path matches stated interests, dislikes, and priorities. May be Moderate/Developing even when interest is high if evidence is thin.
- fitLifestyle: LIFESTYLE FIT — rate only from known working-condition preferences; use "Needs More Information" when unknown.
- gaps: honest development areas still to strengthen (short phrases).

Refinement rules:
1) Return 4-5 paths. Each category MUST be exactly one of: "Best Paths to Explore First", "Strong Alternatives", "Growth Directions", "Longer-Term / Independent Paths", "Lower Interest Based on What You Told Us".
2) You MAY introduce NEW paths when retained story skills reasonably support them AND stated interests make them relevant.
3) You MAY omit original paths the user explicitly rejected. If kept, place rejected directions in "Lower Interest Based on What You Told Us" — never in "Best Paths to Explore First" or "Strong Alternatives".
4) transfers must ONLY use skill names copied exactly from the Retained story skills list below — never rejected skills, never names inferred only from preferences.
5) title = entryPoint; why max 18 words, evidence-based; transition required on every path.
6) fitInterest and fitLifestyle are required on every path.
7) changeSummary (max 25 words): explain what shifted based on preferences — specific, not generic.
8) User interest is NOT evidence.${rejectedSkillsClause()}`;
  const compactPrior = priorPaths.map(p => ({ title: p.title, category: p.category, why: p.why, transfers: p.transfers }));
  const convoPrefs = state.convo.filter(c => c.who === 'user').map(c => c.text).join('\n');
  const userPrompt = `User's story:\n${fullStoryText()}\n\nRetained story skills (supported by the user's story — the only names allowed in "transfers"):\n${skillsSummaryStr(retainedStorySkills)}\n\nPrevious paths shown (context — may replace, omit, or re-rank):\n${JSON.stringify(compactPrior)}\n\nStated interests: ${state.preferences.interests.join(', ') || 'none yet'}\nStated dislikes: ${state.preferences.dislikes.join(', ') || 'none yet'}\nPriorities: ${state.priorities.join(', ') || 'not specified yet'}\n\nPreference messages from conversation:\n${convoPrefs || 'none'}`;
  try{
    const result = await callStructured('refinePaths', system, userPrompt, refinePathsTool, TOKEN_BUDGETS.paths, validateRefinePathsResult, normalizeRefinePathsResult, REFINE_PATHS_REPAIR_HINT);
    let paths = result.paths.map(p => ({
      ...p,
      transfers: filterToValidatedNames(p.transfers, retainedSkillNames),
    }));
    paths = purgeRejectedFromObject(paths, rejected);
    state.paths = paths;
    state.changeSummary = purgeRejectedMentions(result.changeSummary, rejected);
    state.reranked = true;
    if (state.chosenPath && !paths.some(p => p.title === state.chosenPath.title)) {
      state.chosenPath = null;
    }
    state.screen = 'paths';
  }catch(err){
    logDiag('refinePaths', 'final_failure', err.message || String(err));
    state.paths = priorPaths;
    state.errorMsg = "We couldn't update your recommendations just now. Nothing was lost — you can try again.";
    state.errorRetry = refinePaths; state.screen = 'paths';
  }finally{
    state.busy = false; render();
  }
}

async function rerankPaths(){
  if(state.busy) return;
  state.busy = true;
  state.screen = 'analyzing'; state.loadingMsg = 'Updating your recommendations…'; state.errorMsg=''; render();
  const retainedStorySkills = getRetainedStorySkills();
  const rejected = getRejectedSkillNames();
  const retainedSkillNames = retainedStorySkills.map(s=>s.name);
  const knownTitles = state.paths.map(p=>p.title);
  const system = `You are the career reranking engine inside iFindWorth. The user's career paths already exist in full — you are NOT re-describing them, only reclassifying them.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Rules:
1) For EVERY path listed below, return one entry in rankedPaths with its title (copied EXACTLY as given) and its new category — one of exactly these five strings: "Best Paths to Explore First", "Strong Alternatives", "Growth Directions", "Longer-Term / Independent Paths", "Lower Interest Based on What You Told Us". These are NOT the same labels the paths originally had (e.g. "Strong Evidence", "Worth Exploring") — always translate to one of the five above, never reuse an original label verbatim, even for a path whose ranking conceptually stays similar.
2) Never omit a path — every existing path needs an entry, even if its relative ranking doesn't change much.
3) Never move a path out of consideration just because the user dislikes it — move it to "Lower Interest Based on What You Told Us" instead of dropping it.
4) Only include whyChanged (max 18 words) when the category actually changed meaningfully for that path — omit the field otherwise.
5) Only include fitInterest and/or fitLifestyle when a stated preference clearly changes that specific rating for that path — omit them otherwise. Do NOT re-send transfers, gaps, entryPoint, progression, workEnvironment, relevance, transition, fitEvidence, or why — those already exist and are not part of this response.
6) changeSummary (max 25 words) names the preferences that drove the reranking.${rejectedSkillsClause()}`;
  // The full path content still goes to the model as INPUT (for reasoning
  // context) — only the OUTPUT schema is compact. Input tokens aren't what
  // was truncating; the model's own generated output was.
  const compactPaths = state.paths.map(p => ({ title: p.title, category: p.category, why: p.why, transfers: p.transfers, fitInterest: p.fitInterest, fitLifestyle: p.fitLifestyle }));
  const userPrompt = `Existing paths (for context — reclassify only, do not re-describe):\n${JSON.stringify(compactPaths)}\n\nRetained story skills: ${skillsSummaryStr(retainedStorySkills)}\n\nInterests: ${state.preferences.interests.join(', ')}\nDislikes: ${state.preferences.dislikes.join(', ')}\nPriorities: ${state.priorities.join(', ')}`;

    let paths = mergeRerankIntoPaths(state.paths, result.rankedPaths);
    // Defense-in-depth: transfers are no longer regenerated by this call (they
    // were already filtered when the path was first created), but we still
    // re-verify them against the current retained story skills list, and scrub any
    // rejected-skill mention out of the newly-added whyChanged/changeSummary
    // text — the only new freeform text this call produces.
    paths = paths.map(p => ({ ...p, transfers: filterToValidatedNames(p.transfers, retainedSkillNames) }));
    paths = purgeRejectedFromObject(paths, rejected);
    state.paths = paths;
    state.changeSummary = purgeRejectedMentions(result.changeSummary, rejected);
    state.reranked = true;
    state.screen = 'paths';
  }catch(err){
    logDiag('rerankPaths', 'final_failure', err.message || String(err));
    state.errorMsg = "We couldn't update your recommendations just now. Nothing was lost — you can try again.";
    state.errorRetry = rerankPaths; state.screen = 'paths';
  }finally{
    state.busy = false; render();
  }
}

// Paid-flow reliability fix: entitlement is granted exactly once, here, and
// is never touched again by anything downstream. handleCheckout is itself
// idempotent — if it's somehow invoked again after the user is already paid
// (e.g. a stray extra click before the DOM updates), it does NOT re-run
// "checkout" or touch paymentStatus a second time; it just makes sure
// roadmap generation is (re)started, which is exactly what a legitimate
// retry should do anyway.
function handleCheckout(){
  if(state.paymentStatus !== 'paid'){
    state.paymentStatus = 'paid';
  }
  state.roadmapStatus = 'idle';
  state.roadmapSections = { foundation: 'idle', actionPlan: 'idle', direction: 'idle' };
  state.roadmapSectionError = { foundation: null, actionPlan: null, direction: null };
  buildRoadmap();
}

// Per-section timeout. Diagnosis: this was 20000ms, applied by runCancelable
// around the ENTIRE callStructured call for a section — which can internally
// run up to 3 sequential real API round-trips (primary attempt, reshape,
// full repair). 20s is enough for any ONE of those calls given how small
// these schemas are, but not reliably enough for two or three of them back
// to back — that's why a timeout could fire while a repair response "later
// still arrived and logged": the repair was a legitimate, still-in-flight
// network call, not a hang, and the outer race simply ran out before that
// real sequence could finish. Generation tokens in each build*Section
// function (myGen checks) already guarantee a late/abandoned response can
// never mutate state after that happens — this widened window just makes it
// far less likely to happen at all for a normal multi-tier repair.
const ROADMAP_SECTION_TIMEOUT_MS = 45000;

function finalizeRoadmapStatus(){
  if(state.roadmapSections.foundation !== 'ready'){
    state.roadmapStatus = 'failed';
  } else if(state.roadmapSections.actionPlan === 'ready' && state.roadmapSections.direction === 'ready'){
    state.roadmapStatus = 'ready';
  } else {
    state.roadmapStatus = 'partial';
  }
}

// already transfers, what's still uncertain, and initial gaps. Only a
// Foundation failure is treated as the whole roadmap being unusable; a
// failure here surfaces through the normal full-page error/retry, since

  const evidenceGate = gateRetainedEvidence(fullStoryText(), retainedStorySkills);
  const system = `You are the roadmap engine inside iFindWorth, building the Career Foundation section: where the user stands today, what already transfers, and what's still uncertain.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Rules: 1) whereYouAre: 2 sentences max, grounded in concrete past actions only — never call self-described abilities or traits "demonstrated strengths." 2) transfers: 2-3 skill names from the list below. 3) needsMoreInfo: 1-3 short phrases naming what's still unclear about fit. 4) gaps: 1-3 short phrases naming what may need strengthening. Use conditional language when only self-described abilities exist (e.g. organizing/coordinating) — do not imply the user already performs those tasks.${rejectedSkillsClause()}`;
  const userPrompt = `Chosen path: ${state.chosenPath.title} (entry point) — ${state.chosenPath.why}\nProgression: ${state.chosenPath.progression||''}\nGaps already noted: ${(state.chosenPath.gaps||[]).join(', ')}\n\n${formatEvidenceGateForPrompt(evidenceGate)}\n\nRetained story skills: ${skillsSummaryStr(retainedStorySkills)}`;
  try{

      (signal) => callStructured('buildRoadmapFoundation', system, userPrompt, roadmapFoundationTool, TOKEN_BUDGETS.roadmapFoundation, validateRoadmapFoundationResult, undefined, undefined, signal),
      ROADMAP_SECTION_TIMEOUT_MS
    );
    if(myGen !== state.roadmapSectionGeneration.foundation) return false; // stale — a newer attempt has since started
    const clean = purgeRejectedFromObject(result, rejected);
    state.roadmap = state.roadmap || {};
    Object.assign(state.roadmap, {
      whereYouAre: clean.whereYouAre,
      transfers: clean.transfers,
      understandBetter: clean.needsMoreInfo,
      strengthen: clean.gaps,
    });
    state.roadmapSections.foundation = 'ready';
    return true;
  }catch(err){
    if(myGen !== state.roadmapSectionGeneration.foundation) return false; // stale failure — ignore
    logDiag('buildRoadmapFoundation', 'final_failure', err.message || String(err));
    state.roadmapSections.foundation = 'failed';

// Orchestrates the three sections in sequence (Foundation first, since the
// other two lean on its output for context). Each section preserves whatever
// the previous ones already produced — a later failure never discards an
// earlier success. Only a Foundation failure routes to the full-page
// error/retry; Action Plan / Direction failures leave the user on the
// roadmap screen with whatever succeeded, plus an inline retry for the
// missing piece.
async function buildRoadmap(){
  if(state.roadmapOrchestratorBusy) return;
  state.roadmapOrchestratorBusy = true;
  state.screen = 'analyzing';
  try{
    const foundationOk = await buildRoadmapFoundation();
    if(!foundationOk){
      finalizeRoadmapStatus();
      state.errorMsg = state.roadmapSectionError.foundation;
      state.errorRetryLabel = 'Retry Building My Roadmap';
      state.errorRetry = buildRoadmap;
      state.screen = 'roadmap';
      render();
      return;
    }
    await buildRoadmapActionPlan();
    await buildRoadmapDirection();
    finalizeRoadmapStatus();
    state.screen = 'roadmap';
    render();
  }finally{
    state.roadmapOrchestratorBusy = false;
  }
}

async function submitAddExperience(){
  if(state.busy) return;
  const text = state.addExpText.trim();
  if(!text) return;
  state.busy = true;
  const beforeNames = new Set(state.skills.map(s=>s.name));
  state.additionalExperiences.push(text);
  state.addExpText = '';
  state.screen = 'analyzing'; state.loadingMsg = 'Updating your profile with this new experience…'; render();
  const system = `You are the Experience Translator inside iFindWorth, re-analyzing a user's full history (original story plus newly added experiences) to identify transferable professional skills.
${NO_INVENTION_RULE}
Rules: 1) Only include skills with real textual evidence. 2) evidence: a close paraphrase (max 16 words), "You described...", staying literal. 3) Calibrate strength honestly per the criteria above — don't default to "Strong" for a single brief mention. 4) Return 4 to 8 skills, strongest first.`;
  try{
    const result = await callStructured('submitAddExperience', system, fullStoryText(), skillsTool, TOKEN_BUDGETS.skills, validateSkillsResult, normalizeSkillsResult, SKILLS_REPAIR_HINT);
    const newSkills = result.skills;
    const addedNames = newSkills.filter(s=>!beforeNames.has(s.name)).map(s=>s.name);
    state.skills = newSkills;
    const currentNames = new Set(newSkills.map(s => s.name));
    Object.keys(state.skillValidation).forEach(name => {
      if (!currentNames.has(name)) delete state.skillValidation[name];
    });
    addedNames.forEach(name => {
      delete state.skillValidation[name];
    });
    state.changeSummary = addedNames.length ? `New experience added — we found: ${addedNames.join(', ')}.` : 'New experience added — it reinforced skills you already had.';
    state.reranked = false;
    state.screen = 'skills';
  }catch(err){
    logDiag('submitAddExperience', 'final_failure', err.message || String(err));
    // Last-known-good state preserved: state.skills/additionalExperiences from
    // before this call are untouched (we never assigned to them above), so a
    // retry starts from the same profile rather than a corrupted one — except
    // the newly-added story text itself, which we deliberately keep (the user
    // did tell us that; only the re-analysis of it failed).
    state.errorMsg = "We couldn't update your profile with that experience just now. Try again.";
    state.errorRetry = submitAddExperience; state.screen = 'skills';
  }finally{
    state.busy = false; render();
  }
}

    state.errorMsg = "We couldn't analyze that posting just now. Try again.";
    state.errorRetry = analyzeJd; state.screen = 'jdAnalyzer';
  }finally{
    state.busy = false; render();
  }
}

/* ============================= INIT ============================= */
try{
  const savedProfile = loadProfileFromStorage();
  if(savedProfile) applyHydratedState(hydrateProfile(savedProfile));
}catch(e){}
render();
</script>
