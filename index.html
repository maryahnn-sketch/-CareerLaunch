<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="iFindWorth helps you uncover professional skills hidden in your real-life experience, explore career possibilities, and build a practical path forward.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>iFindWorth</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --paper:#FAF9F6;
    --paper-dim:#F0EEE8;
    --card:#FFFFFF;
    --ink:#20292C;
    --ink-soft:#5B6669;
    --ink-faint:#6B7477;
    --highlight:#4F46E5;
    --highlight-soft:rgba(79,70,229,0.12);
    --highlight-line:rgba(79,70,229,0.32);
    --sage:#4F7561;
    --sage-soft:rgba(79,117,97,0.14);
    --clay:#EA580C;
    --clay-soft:rgba(234,88,12,0.12);
    --line:#E2DED5;
    --radius:16px;
    --shadow: 0 1px 2px rgba(32,41,44,0.04), 0 8px 24px rgba(32,41,44,0.06);
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5;}
  #app{max-width:100%;min-height:100vh;}
  .wrap{max-width:720px;margin:0 auto;padding:0 24px;}
  .wrap-wide{max-width:900px;margin:0 auto;padding:0 24px;}

  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-0.01em;margin:0;}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--highlight);}
  p{color:var(--ink-soft);}
  a{color:inherit;}

  button{font-family:var(--sans);cursor:pointer;border:none;background:none;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 26px;border-radius:999px;font-size:15px;font-weight:600;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;min-height:48px;}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .btn-primary{   background:var(--highlight);   color:#FFFFFF;   box-shadow:0 8px 22px rgba(79,70,229,0.18); }
  .btn-primary:hover{   transform:translateY(-1px);   box-shadow:0 10px 26px rgba(79,70,229,0.24); }
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-text{padding:8px 4px;font-weight:600;color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;}
  .btn-text:hover{color:var(--ink);text-decoration-color:var(--ink);}
  .btn-sm{padding:9px 16px;font-size:13px;min-height:36px;}

  .screen{padding:64px 0 96px;animation:rise .5s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){.screen{animation:none;}*{transition:none !important;animation:none !important;}}

  .progress-bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 0;}
  .progress-inner{max-width:720px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:10px;}
  .progress-steps{display:flex;gap:6px;flex:1;}
  .progress-steps span{height:4px;flex:1;background:var(--line);border-radius:2px;overflow:hidden;position:relative;}
  .progress-steps span.done{background:var(--highlight);}
  .progress-steps span.current{background:var(--line);}
  .progress-steps span.current::after{content:'';position:absolute;inset:0;background:var(--highlight);transform-origin:left;animation:fill 1.2s ease forwards;}
  @keyframes fill{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  .progress-label{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;}
  .brand-tiny{font-family:var(--serif);font-weight:700;font-size:15px;cursor:pointer;}

  .nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0;}
  .brand{font-family:var(--serif);font-weight:700;font-size:19px;}
  .brand em{font-style:normal;color:var(--clay);}

  .hero{padding:56px 0 40px;text-align:left;}
  .hero h1{font-size:clamp(38px,6vw,60px);line-height:1.04;max-width:780px;}
  .hero h1 mark{background:none;color:var(--ink);position:relative;display:inline;}
  .hero h1 mark::after{content:'';position:absolute;left:-2px;right:-2px;bottom:2px;height:0.34em;background:var(--highlight-soft);border-radius:2px;z-index:-1;}
  .hero p.lede{font-size:18px;max-width:600px;margin-top:20px;}
  .hero .micro{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);margin-top:18px;}
  .hero-ctas{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap;}

  .translate-demo{margin-top:64px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);}
  .translate-demo .before{font-family:var(--serif);font-size:19px;font-style:italic;color:var(--ink);margin-bottom:18px;}
  .translate-demo .before span{background:var(--highlight-soft);padding:1px 4px;border-radius:3px;}
  .translate-tags{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:999px;background:var(--sage-soft);color:var(--sage);border:1px solid rgba(79,117,97,0.25);}
  .translate-demo-preview{font-size:13.5px;color:var(--ink-soft);margin:22px 0 0;max-width:480px;line-height:1.45;}
  .translate-demo-cta{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;}

  .section{padding:64px 0;border-top:1px solid var(--line);}
  .section h2{font-size:28px;margin-bottom:8px;}
  .section .lede{max-width:540px;}
  .how-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px;margin-top:36px;}
  .how-step .num{font-family:var(--mono);font-size:12px;color:var(--highlight);margin-bottom:8px;}
  .how-step h3{font-size:17px;margin-bottom:6px;}
  .how-step p{font-size:14px;}
  .who-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;}
  .who-chip{font-size:13.5px;padding:9px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);}
  .diff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:32px;}
  .diff-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
  .diff-card .not{font-family:var(--mono);font-size:11px;color:var(--clay);text-decoration:line-through;margin-bottom:8px;}
  .diff-card h3{font-size:16px;}
  .pricing-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px;}
  @media (max-width:600px){.pricing-row{grid-template-columns:1fr;}}
  .price-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;}
  .price-card.featured{border-color:var(--highlight);position:relative;}
  .price-card .amt{font-family:var(--serif);font-size:34px;margin:10px 0;}
  .price-card ul{margin:14px 0 0;padding-left:18px;font-size:14px;color:var(--ink-soft);}
  .price-card li{margin-bottom:6px;}
  .final-cta{padding:80px 0;text-align:center;border-top:1px solid var(--line);}
  .final-cta h2{font-size:34px;max-width:560px;margin:0 auto 24px;}
  footer.site-footer{background:transparent;padding:28px 0 40px;font-size:12.5px;color:var(--ink-faint);border-top:1px solid var(--line);}
  .footer-top{display:flex;justify-content:space-between;align-items:flex-start;gap:28px;margin-bottom:18px;}
  .footer-wordmark{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--ink);line-height:1.2;}
  .footer-tagline{margin:6px 0 0;font-size:13px;font-style:italic;color:var(--ink-soft);line-height:1.45;max-width:280px;}
  .footer-beta{text-align:right;flex-shrink:0;}
  .footer-beta-label{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
  .footer-email{font-size:14px;font-weight:500;color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;word-break:break-word;}
  .footer-email:hover{color:var(--ink);text-decoration-color:var(--ink);}
  .footer-divider{height:1px;background:var(--line);margin-bottom:14px;}
  .footer-disclaimer{margin:0 auto;font-size:12px;line-height:1.55;color:var(--ink-faint);max-width:640px;text-align:center;}
  @media (max-width:640px){
    footer.site-footer{padding:24px 0 32px;}
    .footer-top{flex-direction:column;align-items:flex-start;gap:16px;margin-bottom:16px;}
    .footer-beta{text-align:left;width:100%;}
    .footer-tagline{max-width:none;}
  }

  .intake-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow);}
  textarea#storyInput, textarea.plain-textarea{width:100%;min-height:260px;border:none;outline:none;resize:vertical;font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--ink);padding:22px;background:transparent;}
  textarea#storyInput::placeholder, textarea.plain-textarea::placeholder{color:var(--ink-faint);font-style:italic;}
  .intake-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 14px;border-top:1px solid var(--line);}
  .mic-btn{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;background:var(--sage-soft);color:var(--sage);font-weight:600;font-size:13.5px;border:1px solid rgba(79,117,97,0.3);}
  .mic-btn.recording{background:var(--clay-soft);color:var(--clay);border-color:rgba(181,96,63,0.35);}
  .mic-dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
  .mic-btn.recording .mic-dot{animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
  .wordcount{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}
  .prompts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
  .prompt-chip{font-size:13px;padding:8px 13px;border-radius:10px;background:var(--card);border:1px dashed var(--line);color:var(--ink-soft);}
  .prompt-chip:hover{border-color:var(--ink-soft);color:var(--ink);}
  .privacy-note{font-size:12.5px;color:var(--ink-faint);margin-top:22px;max-width:500px;}

  .analyzing-wrap{text-align:center;padding:100px 0;}
  .analyzing-wrap .spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--highlight);margin:0 auto 26px;animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .analyzing-wrap .msg{font-family:var(--serif);font-size:20px;font-style:italic;}
  .analyzing-wrap .msg-sub{font-size:14px;color:var(--ink-faint);margin-top:12px;}

  .big-stat{font-family:var(--serif);font-size:clamp(32px,5vw,46px);line-height:1.1;margin-bottom:6px;}
  .big-stat mark{background:none;color:var(--clay);}

  .skill-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;}
  .skill-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
  .skill-name{font-family:var(--serif);font-size:19px;font-weight:600;}
  .strength-pill{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .strength-Strong{background:var(--sage-soft);color:var(--sage);}
  .strength-Moderate{background:var(--highlight-soft);color:#8a6417;}
  .strength-Developing{background:var(--clay-soft);color:var(--clay);}
  .strength-NeedsMoreInformation, .strength-Needs{background:var(--paper-dim);color:var(--ink-faint);}
  .skill-evidence{font-size:14px;color:var(--ink-soft);margin-top:10px;padding:10px 14px;background:var(--paper-dim);border-left:2px solid var(--highlight);border-radius:0 6px 6px 0;}
  .skill-evidence .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-faint);display:block;margin-bottom:4px;}
  .skill-actions{display:flex;gap:8px;margin-top:14px;}
  .validate-btn{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid var(--line);color:var(--ink-soft);}
  .validate-btn.active-yes{background:var(--sage-soft);border-color:transparent;color:var(--sage);}
  .validate-btn.active-no{background:var(--clay-soft);border-color:transparent;color:var(--clay);}
  .skill-card.rejected{opacity:0.5;}

  .path-category{margin-top:44px;}
  .path-category h3{font-size:15px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .path-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;cursor:pointer;transition:border-color .15s ease;}
  .path-card:hover{border-color:var(--ink-soft);}
  .path-card.selected{border-color:var(--highlight);box-shadow:0 0 0 1px var(--highlight);}
  .path-title{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px;}
  .path-why{font-size:14px;margin-bottom:12px;}
  .path-changed{font-size:12.5px;color:var(--highlight);font-style:italic;margin-bottom:10px;}
  .path-meta{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;margin-top:10px;}
  .path-meta .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:3px;}
  .path-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .mini-tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--paper-dim);color:var(--ink-soft);}
  .transition-Strong{color:var(--sage);}
  .transition-Moderate{color:#8a6417;}
  .transition-Developing, .transition-NeedsMoreInformation{color:var(--clay);}
  .fit-dims{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .fit-dim{font-size:12px;}
  .fit-dim .k{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--ink-faint);display:block;}
  .sequence-inline{font-size:12.5px;color:var(--ink-faint);margin-top:8px;}
  .change-summary{background:var(--highlight-soft);border-radius:10px;padding:14px 18px;font-size:14px;color:#6b4d10;margin-bottom:24px;}

  .convo-log{display:flex;flex-direction:column;gap:14px;margin:26px 0;}
  .convo-bubble{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;font-size:14.5px;}
  .convo-bubble.ai{border-left:2px solid var(--highlight);}
  .learned-card{background:var(--card);border:1px solid var(--ink);border-radius:var(--radius);padding:20px 22px;}
  .learned-card h4{font-family:var(--serif);font-size:17px;margin-bottom:12px;}
  .learned-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .learned-chip{font-size:12.5px;padding:6px 11px;border-radius:999px;background:var(--sage-soft);color:var(--sage);}
  .learned-chip.down{background:var(--clay-soft);color:var(--clay);}
  .convo-input-row{display:flex;gap:10px;margin-top:20px;}
  .convo-input-row input{flex:1;padding:14px 16px;border-radius:10px;border:1px solid var(--line);font-family:var(--sans);font-size:14.5px;outline:none;background:var(--card);}
  .convo-input-row input:focus{border-color:var(--ink);}
  .convo-prompts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}

  .priority-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:24px;}
  .priority-chip{padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;text-align:left;font-weight:500;}
  .priority-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .paywall-card{background:var(--card);border:1px solid var(--ink);border-radius:20px;padding:40px;box-shadow:var(--shadow);margin-top:20px;}
  .paywall-card .amt{font-family:var(--serif);font-size:52px;margin:6px 0 18px;}
  .unlock-list{text-align:left;max-width:420px;margin:22px auto;display:flex;flex-direction:column;gap:10px;font-size:14.5px;color:var(--ink-soft);}
  .unlock-list li{list-style:none;display:flex;gap:10px;align-items:flex-start;}
  .unlock-list li::before{content:'✓';color:var(--sage);font-weight:700;}
  .bring-card{background:var(--paper-dim);border-radius:12px;padding:20px;margin:20px 0;text-align:left;}
  .bring-card h4{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
  .gap-preview{background:var(--clay-soft);border-radius:12px;padding:16px 18px;text-align:left;margin-bottom:20px;font-size:14px;color:var(--clay);}

  .roadmap-section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;}
  .roadmap-section h3{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);margin-bottom:12px;}
  .roadmap-section ul{margin:0;padding-left:20px;font-size:14.5px;color:var(--ink-soft);}
  .roadmap-section li{margin-bottom:6px;}
  .ladder-level{margin-bottom:12px;}
  .ladder-level .lvl-name{font-weight:600;font-size:13.5px;margin-bottom:4px;}
  .not-zero{font-family:var(--serif);font-style:italic;font-size:19px;text-align:center;padding:26px 0;color:var(--ink);}

  .sequence-track{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 32px;}
  @media (max-width:640px){.sequence-track{grid-template-columns:1fr;}}
  .seq-stop{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;position:relative;}
  .seq-stop .seq-lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--highlight);letter-spacing:0.06em;margin-bottom:6px;}
  .seq-stop h4{font-family:var(--serif);font-size:17px;margin-bottom:6px;}
  .seq-stop p{font-size:13px;margin:0;}

  .phase-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 16px;}
  .phase-tab{padding:9px 15px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--card);}
  .phase-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .kit-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;}
  .kit-block h3{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);margin-bottom:12px;}
  .kit-block p, .kit-block li{font-family:var(--serif);font-size:16.5px;color:var(--ink);line-height:1.6;}
  .kit-block ul{padding-left:20px;margin:0;}
  .kit-block li{margin-bottom:6px;}
  .bullet-row{margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--line);}
  .bullet-row:last-child{border-bottom:none;}
  .strengthen-link{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--highlight);text-decoration:underline;cursor:pointer;margin-top:4px;display:inline-block;}
  .strengthen-box{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
  .strengthen-box input{flex:1;min-width:180px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-family:var(--sans);font-size:13.5px;}
  .headline-option{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .headline-option.selected{border-color:var(--ink);background:var(--paper-dim);}
  .headline-option .style-lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
  .headline-option .text{font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--ink);}

  .dash-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:24px;}
  @media (min-width:720px){.dash-grid.two-col{grid-template-columns:1fr 1fr;}}
  .dash-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;}
  .dash-card h3{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);margin-bottom:10px;}
