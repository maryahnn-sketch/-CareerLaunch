// Operation-specific output-token budgets (reliability fix, architecture-level).
// A prior pass moved most calls to a shared value near 1000 and assumed the
// artifact environment silently capped everyone at 1000 anyway — live testing
// disproved that: dropping discoverPaths to 900 (below the old flat 1000)
// measurably caused new truncation, which means the requested value DOES
// matter here. So budgets below are set from an actual per-schema audit
// (worst case: every optional item present, every string at its schema
// maxLength, full item-count), each with roughly 2-3x headroom on top of that
// worst case — not guessed, and not uniform.
//
// AUDIT (worst case, ~4 chars/token estimate, JSON key/punctuation overhead included):
//   sendConvo      ~190 tok  (reply 500 chars + 2 short arrays)
//   analyzeSkills  ~440 tok  (7 skills x name+evidence(160c)+strength)
//   discoverPaths  ~800 tok  (5 paths x 11 fields, no fit-interest/lifestyle —
//                             those are no longer generated at all, see pathFieldsSchema)
//   rerankPaths    ~310 tok  (5 paths x compact delta: title+category+whyChanged?+2 fit fields?)
//   buildRoadmap   ~600 tok  (sequence + gap arrays + 7/30/60/90 plan + positioning)
//   buildKit       ~530 tok  (4 bullets + 3 headlines + about)
//   buildStoryBank ~760 tok  (7 REQUIRED categories x up to 260-char story + 100-char prompt)
//   analyzeJd      ~120 tok  (4-6 short keyword arrays + one enum)
//   bulletRepair   ~45 tok   (single 180-char bullet)
//   singleStory    ~65 tok   (single 260-char story)
//   roadmapFoundation ~140 tok (whereYouAre 220c + 3 short arrays)
//   roadmapActionPlan ~355 tok (14 items x 80c max + nextBestStep 140c — was
//                               unbounded per-item length before this pass,
//                               which is what actually caused the live
//                               TRUNCATED_OUTPUT: the schema let the model
//                               write full sentences per action item)
//   roadmapDirection  ~405 tok (3-stop sequence + learning ladder + searchTerms
//                               + positioning — same fix: nested learningStrategy
//                               items and the sequence title/desc had no
//                               maxLength before, and searchTerms/level had none
//                               either)
const TOKEN_BUDGETS = {
  convo: 500,
  skills: 1000,
  paths: 2000,       // was the truncation site — largest schema, largest headroom
  rerank: 700,
  roadmapFoundation: 700,   // was one 2000-token "roadmap" call — split into 3 much smaller ones
  roadmapActionPlan: 900,   // was 800 — bumped alongside the new maxLength bounds for headroom
  roadmapDirection: 1200,   // was 1000 — bumped alongside the new maxLength bounds for headroom
  kit: 1800,
  storyBank: 2000,   // 7 required items is the other schema worth real headroom on
  jd: 1200,
  bulletRepair: 200,
  singleStory: 300,
  profileDelta: 400, // small, separate extraction call — see sendConvo
};

/* ============================= VALIDATORS (schema + relational integrity, reliability item G) ============================= */
function isNonEmptyStr(v){ return typeof v === 'string' && v.trim().length > 0; }

// Item-level resilience for skills (shared by analyzeSkills and
// submitAddExperience, since both use skillsTool/validateSkillsResult): one
// malformed skill object must never sink an otherwise-usable assessment. This
// checks a single skill against the minimum bar — non-empty name, non-empty
// evidence, valid strength — used to both filter (normalizeSkillsResult) and
// defensively re-check (validateSkillsResult) below.
const MIN_VALID_SKILLS = 2;
function isValidSkillItem(s){
  return !!s && typeof s === 'object'
    && isNonEmptyStr(s.name)
    && isNonEmptyStr(s.evidence)
    && STRENGTH_ENUM.includes(normalizeFitValue(s.strength));
}
// Normalizes strength casing/synonyms (same tolerance as paths/rerank), then
// DROPS any skill that still doesn't meet the minimum bar — never invents a
// replacement, only removes. This runs before validation, so a response with
// several good skills and one malformed one passes immediately with the good
// ones intact; only a response with too FEW usable skills after filtering
// escalates to the existing reshape/full-repair tiers in callStructured,
// which is the "attempt a narrow repair only if useful" behavior — repair is
// not worth an extra API call when we already have enough valid skills to
// show a useful assessment.
function normalizeSkillsResult(result){
  if(!result || !Array.isArray(result.skills)) return result;
  const total = result.skills.length;
  const valid = result.skills
    .map(s => (s && typeof s === 'object') ? { ...s, strength: normalizeFitValue(s.strength) } : s)
    .filter(isValidSkillItem);
  safeLog('log', `[CareerLaunch][skills][item_validation] returned=${total} valid=${valid.length} discarded=${total - valid.length}`);
  return { ...result, skills: valid };
}

function validateSkillsResult(result){
  if(!result || !Array.isArray(result.skills)) return { ok:false, reason:'skills array is missing' };
  // By this point normalizeSkillsResult has already filtered out anything
  // malformed — this loop is a defensive re-check, not the primary
  // enforcement point, in case validateSkillsResult is ever called without
  // the normalize step running first.
  for(const s of result.skills){
    if(!isValidSkillItem(s)) return { ok:false, reason:'a skill is missing a name, evidence, or a valid strength value' };
  }
  if(result.skills.length < MIN_VALID_SKILLS){
    return { ok:false, reason:`only ${result.skills.length} valid skill(s) found after filtering out malformed items — need at least ${MIN_VALID_SKILLS} for a useful assessment` };
  }
  return { ok:true };
}

// Reused by both analyzeSkills and submitAddExperience (same schema, same
// failure mode): reinforces the exact shape in plain language, for the case
// where the model fell back to unstructured text and skipped the API's own
// schema enforcement entirely — the improved repair instruction requested
// after the live "a skill is missing a name" failure.
const SKILLS_REPAIR_HINT = `The schema requires skills: [{name, evidence, strength}] — every single item in that array MUST have a non-empty "name". Never return a skill object without a name; if you're not confident enough in an item to name it, leave it out entirely rather than including it with a missing or empty name.`;

// Same pattern as SKILLS_REPAIR_HINT: the field most likely to get silently
// dropped by a model that fell back to unstructured text (bypassing the
// schema's own enum enforcement) is "transition" — reinforce it explicitly
// in plain language for the repair passes.
const PATHS_REPAIR_HINT = `Every path object MUST include transition — one of exactly "Strong" | "Moderate" | "Developing" | "Needs More Information", never omitted, never any other wording. Also required on every path: title, entryPoint, progression, category, why, and transfers (as an array). If you cannot supply all of those for a given path, leave that path out entirely rather than submitting it incomplete.`;
const RERANK_REPAIR_HINT = `The "category" field for every rankedPaths entry MUST be exactly one of these five strings: "Best Paths to Explore First", "Strong Alternatives", "Growth Directions", "Longer-Term / Independent Paths", "Lower Interest Based on What You Told Us". Do NOT reuse an original path's old category label (such as "Strong Evidence", "Worth Exploring", "Growth Path", or "Independent Path") — those are a different, earlier classification and are not valid values here, even for a path whose ranking stays similar.`;
const REFINE_PATHS_REPAIR_HINT = `${PATHS_REPAIR_HINT} ${RERANK_REPAIR_HINT} The top-level changeSummary field is REQUIRED (max 25 words) and must name the preferences that drove the refresh. Every path MUST include fitInterest and fitLifestyle (interest/lifestyle fit, separate from transition which is evidence fit only). transition must reflect story-supported evidence — never Strong solely because the user wants the path.`;
// Diagnosis: repair responses were dropping first7Days/learningStrategy
// specifically because the generic repair note only said "return a
// corrected, complete result" — it never named which fields a truncated or
// off-format response is most likely to have lost. These hints call out the
// exact required field names so a repair attempt can't "forget" one while
// fixing something else.
const ACTION_PLAN_REPAIR_HINT = `The schema requires ALL FOUR time-period arrays — first7Days, days8to30, days31to60, days61to90 — plus nextBestStep. Never omit any of the four arrays, even if you need to shorten individual items (each item max ~80 characters) to fit. A short but complete response covering all four periods is required, not a longer response missing one.`;
const DIRECTION_REPAIR_HINT = `The schema requires learningStrategy as an array (it may be empty if there's genuinely nothing to add, but the field itself must always be present) — never omit it. Also always required: careerSequence with now/next/later, searchTerms, and positioning. Keep every item short (learning items max ~70 characters, sequence descriptions max ~90) so the complete response fits.`;

function validatePathsResultWithStructure(result, storyText, retainedSkills, pathValidation, evidenceGate){
  if(!result || !Array.isArray(result.paths)) return { ok:false, reason:'paths array is missing' };
  for(const p of result.paths){
    if(!isValidPathItem(p)) return { ok:false, reason:`a path is missing a required field: ${firstInvalidPathField(p)}` };
  }
  return pathValidation.validatePathsResult(result, storyText, retainedSkills, evidenceGate);
}

function validateRefinePathsResultWithStructure(result, storyText, retainedSkills, pathValidation, evidenceGate){
  const pathCheck = validatePathsResultWithStructure(result, storyText, retainedSkills, pathValidation, evidenceGate);
  if(!pathCheck.ok) return pathCheck;
  if(!isNonEmptyStr(result.changeSummary)) return { ok:false, reason:'changeSummary is missing' };
  for(const p of result.paths){
    if(!RERANK_CATEGORY_ENUM.includes(p.category)){
      return { ok:false, reason:`refinement category invalid for path "${p.title}"` };
    }
  }
  return { ok:true };
}

// By this point normalizeRerankResult has already filtered every item down
// to ones that are structurally sound AND have canonical fit values (mapping
// synonyms like "Weak" first) — so this only needs to check there's at least
// one usable result left. Zero valid items is the only case actually worth
// a repair round-trip; one bad item among several good ones never reaches
// here as a failure at all, because normalize already dropped just that one.
function validateRerankResult(result){
  if(!result || !Array.isArray(result.rankedPaths) || result.rankedPaths.length === 0){
    return { ok:false, reason:'no valid rankedPaths entries remained after filtering out malformed items' };
  }
  if(!isNonEmptyStr(result.changeSummary)) return { ok:false, reason:'changeSummary is missing' };
  return { ok:true };
}

function normalizeRefinePathsResult(result){
  const normalized = normalizePathsResult(result);
  if(!normalized || !Array.isArray(normalized.paths)) return result;
  const paths = normalized.paths.map(p => ({
    ...p,
    category: normalizeRerankCategory(p.category),
    fitInterest: p.fitInterest !== undefined ? normalizeFitValue(p.fitInterest) : p.fitInterest,
    fitLifestyle: p.fitLifestyle !== undefined ? normalizeFitValue(p.fitLifestyle) : p.fitLifestyle,
    fitEvidence: p.fitEvidence !== undefined ? normalizeFitValue(p.fitEvidence) : p.fitEvidence,
  })).filter(p => isValidPathItem(p) && RERANK_CATEGORY_ENUM.includes(p.category));
  return {
    changeSummary: typeof result.changeSummary === 'string' ? result.changeSummary.trim() : '',
    paths,
  };
}

// Merges the compact rerank delta back into the already-valid path objects.
// Unchanged fields (transfers, gaps, entryPoint, progression, workEnvironment,
// relevance, transition, fitEvidence, why) are never touched — they simply
// stay whatever they already were. If the model omits a path entirely from
// rankedPaths, that path is kept exactly as-is rather than dropped, so no path
// data can ever disappear because of a rerank call.
function mergeRerankIntoPaths(existingPaths, rankedPaths){
  const deltaByTitle = {};
  rankedPaths.forEach(rp => { deltaByTitle[String(rp.title).toLowerCase()] = rp; });
  return existingPaths.map(p => {
    const delta = deltaByTitle[String(p.title).toLowerCase()];
    if(!delta) return p;
    return {
      ...p,
      category: delta.category || p.category,
      whyChanged: delta.whyChanged || undefined,
      fitInterest: delta.fitInterest || p.fitInterest,
      fitLifestyle: delta.fitLifestyle || p.fitLifestyle,
    };
  });
}

// Item-level resilience for the profile delta (mirrors skills/paths): a
// malformed entry in one array must never sink the others, and an empty
// result (nothing new signaled this turn) is a perfectly valid outcome, not
// a failure — this must stay lenient since most turns legitimately have no
// new preference to extract.
function isValidProfileItem(v){ return typeof v === 'string' && v.trim().length > 0; }
function normalizeProfileDeltaResult(result){
  if(!result || typeof result !== 'object') return result;
  const clean = (arr) => Array.isArray(arr) ? arr.filter(isValidProfileItem).map(s => s.trim()) : [];
  return {
    interests: clean(result.interests),
    dislikes: clean(result.dislikes),
    preferences: clean(result.preferences),
    summary: typeof result.summary === 'string' ? result.summary.trim() : '',
  };
}
function validateProfileDeltaResult(result){
  if(!result || typeof result !== 'object') return { ok:false, reason:'profile delta result is missing' };
  if(!Array.isArray(result.interests) || !Array.isArray(result.dislikes) || !Array.isArray(result.preferences)){
    return { ok:false, reason:'interests/dislikes/preferences must be arrays' };
  }
  return { ok:true };
}

function validateRoadmapFoundationResult(result){
  if(!result) return { ok:false, reason:'foundation result is empty' };
  if(!isNonEmptyStr(result.whereYouAre)) return { ok:false, reason:'whereYouAre is missing' };
  if(!Array.isArray(result.transfers)) return { ok:false, reason:'transfers is missing or not an array' };
  if(!Array.isArray(result.needsMoreInfo)) return { ok:false, reason:'needsMoreInfo is missing or not an array' };
  if(!Array.isArray(result.gaps)) return { ok:false, reason:'gaps is missing or not an array' };
  return { ok:true };
}

function validateRoadmapActionPlanResult(result){
  if(!result) return { ok:false, reason:'action plan result is empty' };
  for(const k of ['first7Days','days8to30','days31to60','days61to90']){
    if(!Array.isArray(result[k])) return { ok:false, reason:`${k} is missing or not an array` };
  }
  if(!isNonEmptyStr(result.nextBestStep)) return { ok:false, reason:'nextBestStep is missing' };
  return { ok:true };
}

function validateRoadmapDirectionResult(result){
  if(!result) return { ok:false, reason:'direction result is empty' };
  if(!result.careerSequence || !result.careerSequence.now || !result.careerSequence.next || !result.careerSequence.later){
    return { ok:false, reason:'careerSequence missing now/next/later' };
  }
  if(!Array.isArray(result.learningStrategy)) return { ok:false, reason:'learningStrategy is missing or not an array' };
  if(!Array.isArray(result.searchTerms)) return { ok:false, reason:'searchTerms is missing or not an array' };
  if(!isNonEmptyStr(result.positioning)) return { ok:false, reason:'positioning is missing' };
  return { ok:true };
}

function validateKitResult(result, sourceEvidenceText, gate){
  if(!result || !Array.isArray(result.resumeBullets)) return { ok:false, reason:'resumeBullets missing' };
  if(result.resumeBullets.length > 4) return { ok:false, reason:'resumeBullets exceeds maximum of 4' };
  if(!Array.isArray(result.linkedinHeadlines) || result.linkedinHeadlines.length !== 3) return { ok:false, reason:'linkedinHeadlines must have exactly 3 entries' };
  if(!isNonEmptyStr(result.linkedinAbout)) return { ok:false, reason:'linkedinAbout is missing' };
  const headlineTexts = result.linkedinHeadlines.map(h => String(h?.text || '').trim().toLowerCase()).filter(Boolean);
  if(new Set(headlineTexts).size < headlineTexts.length){
    return { ok:false, reason:'linkedinHeadlines must be meaningfully different from each other' };
  }
  for(const b of result.resumeBullets){
    if(!isNonEmptyStr(b.sourceQuote)) return { ok:false, reason:'each resume bullet must include sourceQuote (exact concrete_past_action quote)' };
    const bad = findUnsupportedNumerals(b.text, sourceEvidenceText);
    if(bad.length) return { ok:false, reason:`resume bullet contains a number not present in the user's evidence ("${bad.join(', ')}"): remove it, don't invent metrics` };
    if(/\bhelped manage\b/i.test(String(b.text || '')) && /\b(?:manage|managed|organiz|coordinat|schedul|lead|train)\b/i.test(String(b.sourceQuote || ''))){
      return { ok:false, reason:'resume bullet uses "helped manage" when evidence names the action directly' };
    }
  }
  const badAbout = findUnsupportedNumerals(result.linkedinAbout, sourceEvidenceText);
  if(badAbout.length) return { ok:false, reason:`linkedinAbout contains a number not present in the user's evidence ("${badAbout.join(', ')}")` };
  const concreteCount = gate?.concretePastActions?.length || 0;
  if(concreteCount >= 3){
    const required = Math.min(3, concreteCount);
    if(result.resumeBullets.length < required){
      return { ok:false, reason:`need at least ${required} resume bullets when ${concreteCount} concrete past-action sources exist` };
    }
    const distinct = new Set(result.resumeBullets.map(b => String(b.sourceQuote || '').trim().toLowerCase()).filter(Boolean));
    if(distinct.size < required){
      return { ok:false, reason:`need at least ${required} resume bullets grounded in different concrete past-action sources` };
    }
  }
  return { ok:true };
}

function validateStoryBankResult(result){
  if(!result || !Array.isArray(result.stories) || result.stories.length === 0) return { ok:false, reason:'stories array missing or empty' };
  for(const s of result.stories){
    if(!isNonEmptyStr(s.category)) return { ok:false, reason:'a story entry is missing a category' };
    if(!['ready','needs_more'].includes(s.status)) return { ok:false, reason:`a story entry has an invalid status: ${s.status}` };
    if(s.status === 'ready' && !isNonEmptyStr(s.story)) return { ok:false, reason:'a story marked ready has no story text' };
  }
  return { ok:true };
}

function validateJdResult(result){
  if(!result || !Array.isArray(result.marketAsks) || result.marketAsks.length === 0) return { ok:false, reason:'marketAsks missing or empty' };
  if(!Array.isArray(result.youAlreadyHave) || !Array.isArray(result.shouldStrengthen)) return { ok:false, reason:'youAlreadyHave/shouldStrengthen must be arrays' };
  if(!['Strong Match','Worth Considering','Stretch Opportunity','Needs More Information'].includes(result.overallFit)) return { ok:false, reason:`invalid overallFit value: ${result.overallFit}` };
  return { ok:true };
}

function validateTextResult(field){
  return function(result){
    if(!result || !isNonEmptyStr(result[field])) return { ok:false, reason:`${field} is missing or empty` };
    return { ok:true };
  };
}

/* ============================= PATHS ============================= */
const DISCOVERY_TIERS = ['Direct-fit paths','Adjacent opportunities','Longer-term possibilities'];
const TIER_DESCRIPTIONS = {
  'Direct-fit paths': 'Strongest evidence match. Paths where your experience and transferable skills align most directly, including familiar directions worth taking seriously.',
  'Adjacent opportunities': 'Realistic stretch directions that build on what you bring, with honest gaps noted. Often the most actionable next step.',
  'Longer-term possibilities': 'Evidence-supported options that may not match your first guess. Worth exploring when the story supports them, without forcing novelty.',
};
function pathObviousnessScore(category){
  const c = (category || '').toLowerCase();
  if(c.includes('strong evidence') || c.includes('best paths')) return 4;
  if(c.includes('worth exploring') || c.includes('strong alternatives')) return 3;
  if(c.includes('growth')) return 2;
  if(c.includes('independent') || c.includes('longer-term')) return 1;
  if(c.includes('lower interest')) return 2;
  return 2;
}
function classifyPathsIntoTiers(paths){
  const visible = paths.filter(p => state.pathFeedback[p.title] !== 'not_interested');
  const buckets = { 'Direct-fit paths': [], 'Adjacent opportunities': [], 'Longer-term possibilities': [] };
  if(!visible.length) return buckets;
  const scored = visible.map(path => {
    const evidence = pathStrengthScore(path.transition || path.fitEvidence);
    const transfers = Math.min((path.transfers || []).length, 3);
    const interest = pathStrengthScore(path.fitInterest);
    const obvious = pathObviousnessScore(path.category);
    const matchScore = evidence * 2.5 + transfers + interest * 0.75 + obvious;
    const surpriseScore = (5 - obvious) * 2 + Math.max(0, 4 - evidence) * 0.5 + ((path.category || '').toLowerCase().includes('independent') ? 2 : 0);
    return { path, matchScore, surpriseScore };
  });
  const maxMatch = Math.max(...scored.map(s => s.matchScore), 1);
  const maxSurprise = Math.max(...scored.map(s => s.surpriseScore), 1);
  for(const item of scored){
    const normMatch = item.matchScore / maxMatch;
    const normSurprise = item.surpriseScore / maxSurprise;
    if(normSurprise >= 0.68 && normMatch < 0.85){
      buckets['Longer-term possibilities'].push(item.path);
    } else if(normMatch >= 0.62){
      buckets['Direct-fit paths'].push(item.path);
    } else {
      buckets['Adjacent opportunities'].push(item.path);
    }
  }
  return buckets;
}

  const capHint = regenCapHintTitle === title
    ? `<p class="regen-cap-hint" role="status">We've already explored less obvious directions from your story. To surface more, add an experience or tell us more in conversation.</p>`

  return `<div class="novelty-feedback" role="group" aria-label="Feedback for ${title}">
    <button type="button" class="novelty-btn ${fb==='known'?'active-known':''}" data-path-feedback="known" data-path-title="${encodeURIComponent(title)}">I already knew this</button>
    <button type="button" class="novelty-btn ${fb==='new'?'active-new':''}" data-path-feedback="new" data-path-title="${encodeURIComponent(title)}">This is new to me</button>
    <button type="button" class="novelty-btn ${fb==='not_interested'?'active-not':''}" data-path-feedback="not_interested" data-path-title="${encodeURIComponent(title)}">Not interested</button>
    ${capHint}
  </div>`;
}
function renderPathCard(p){

  return `<div class="path-card ${sel?'selected':''}" data-path="${encodeURIComponent(p.title)}">

    ${(p.fitEvidence||p.fitInterest)?`<div class="fit-dims">
      <div class="fit-dim"><span class="k">Evidence</span>${p.fitEvidence||p.transition||'Not rated'}</div>

function renderPaths(){
  if(state.errorMsg) return renderError();

  let html = `<div class="wrap-wide"><div class="screen">

function isRespectfulGap(value){
  const text = String(value || '').toLowerCase();
  return text && !/(formal employer|formal title|formal operations|professional setting|traditional employer|independent setting|professional track record)/i.test(text);
}

function respectfulGaps(){
  return ((state.chosenPath && state.chosenPath.gaps) || []).filter(isRespectfulGap);
}

  </div></div>`;
}

function kitSectionText(section){
  if(!state.kit) return '';
  if(section === 'resume') return (state.kit.resumeBullets||[]).map(b=>`• ${typeof b === 'string' ? b : b.text}`).join('\n');
  if(section === 'headline') return ((state.kit.linkedinHeadlines||[])[state.selectedHeadline]||{}).text || '';
  if(section === 'about') return state.kit.linkedinAbout || '';
  return '';
}

async function copyKitSection(section){
  const text = kitSectionText(section);
  const status = document.getElementById('copyStatus');
  if(!text){ if(status) status.textContent = 'Nothing to copy yet.'; return; }
  try{
    await navigator.clipboard.writeText(text);
    if(status) status.textContent = 'Copied to clipboard.';
  }catch(e){
    if(status) status.textContent = 'Copy was blocked by the browser. Select the text and copy manually.';
  }
}

function editAboutSection(){
  const about = document.getElementById('linkedinAboutText');
  const button = document.getElementById('editLinkedinAbout');

  const editing = about.getAttribute('contenteditable') === 'true';

    state.kit.linkedinAbout = about.textContent.trim();
    about.setAttribute('contenteditable','false');
    button.textContent = 'Edit';

function downloadApplicationKit(){
  if(!state.kit) return;
  const headline = kitSectionText('headline');
  const allHeadlines = (state.kit.linkedinHeadlines||[]).map((h,i)=>`${i===state.selectedHeadline ? 'SELECTED: ' : ''}${h.style}\n${h.text}`).join('\n\n');
  const strengthen = (state.kit.resumeBullets||[]).filter(b=>b && typeof b==='object' && b.strengthen).map(b=>`• ${b.strengthen}`).join('\n');
  const gapQuestions = (state.kit.resumeBulletGaps||[]).map(g=>`• ${g.strengthen}`).join('\n');
  const searchTerms = kitSearchTermsForDisplay().map(t=>`• ${t}`).join('\n');
  const text = `iFindWorth Application Kit\n\nTARGET DIRECTION\n${state.chosenPath ? state.chosenPath.title : ''}\n\nRÉSUMÉ BULLETS\n${kitSectionText('resume') || '(None yet — add more concrete examples to your story)'}\n${strengthen ? `\n\nOPTIONAL DETAIL PROMPTS\n${strengthen}` : ''}${gapQuestions ? `\n\nADDITIONAL STRENGTHEN QUESTIONS\n${gapQuestions}` : ''}\n\nLINKEDIN HEADLINE OPTIONS\n${allHeadlines}\n\nSELECTED LINKEDIN HEADLINE\n${headline}\n\nLINKEDIN ABOUT\n${kitSectionText('about')}\n${searchTerms ? `\n\nSEARCH TERMS FOR THIS DIRECTION\n${searchTerms}` : ''}\n`;
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'iFindWorth-Application-Kit.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
