let recognition = null;
function toggleVoice(){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRec){
    document.getElementById('voiceWarning').innerHTML = `<p style="font-size:12.5px;color:var(--clay);margin-top:10px;">Voice input isn't available in this browser. Please type your story instead.</p>`;
    return;
  }
  if(state.recording){ if(recognition) recognition.stop(); state.recording = false; render(); return; }
  recognition = new SpeechRec();
  recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-US';
  let finalTranscript = state.story ? state.story + ' ' : '';
  recognition.onresult = (event)=>{
    let interim = '';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const t = event.results[i][0].transcript;
      if(event.results[i].isFinal) finalTranscript += t + ' '; else interim += t;
    }
    const ta = document.getElementById('storyInput');
    if(ta){
      ta.value = finalTranscript + interim; state.story = ta.value;
      const wc = state.story.trim() ? state.story.trim().split(/\s+/).length : 0;
      const wcEl = document.querySelector('.wordcount'); if(wcEl) wcEl.textContent = wc + ' words';
      const btn = document.getElementById('submitStory'); if(btn) btn.disabled = wc < 8;
      updateIntakePromptHelper();
    }
  };
  recognition.onerror = ()=>{
    state.recording = false; render();
    document.getElementById('voiceWarning').innerHTML = `<p style="font-size:12.5px;color:var(--clay);margin-top:10px;">We couldn't access your microphone. Please check permissions or type your story instead.</p>`;
  };
  recognition.onend = ()=>{ state.recording = false; render(); };
  recognition.start(); state.recording = true; render();
}

/* ============================= AI FLOW FUNCTIONS ============================= */
async function analyzeSkills(){
  if(state.busy) return;
  state.busy = true;
  state.screen = 'analyzing'; state.loadingMsg = 'Reading through what you shared…'; state.errorMsg=''; render();
  const system = `You are the Experience Translator inside iFindWorth. A user describes, in their own words, things they've done. Identify transferable professional skills genuinely supported by what they wrote.
${NO_INVENTION_RULE}
Rules: 1) Only include skills with real textual evidence. 2) evidence: a close paraphrase (max 16 words) of what they said, warm plain-language ("You described..."), staying literal — do not generalize it into a broader claim. 3) Calibrate strength honestly: "Strong" only for clear, repeated, or elaborated evidence; "Moderate" for a single plain mention without elaboration; "Developing" for something implied or mentioned only in passing; "Needs More Information" if the evidence is too thin to be confident but the activity is still plausibly relevant. Do not default to "Strong" just because an activity was mentioned once. 4) Return 4 to 7 skills, strongest first.`;
  try{
    const result = await callStructured('analyzeSkills', system, fullStoryText(), skillsTool, TOKEN_BUDGETS.skills, validateSkillsResult, normalizeSkillsResult, SKILLS_REPAIR_HINT);
    const { enrichSkillsWithSourceQuotes } = await loadEvidenceGate();
    state.skills = enrichSkillsWithSourceQuotes(result.skills, fullStoryText());
    state.screen = 'skills';
  }catch(err){
    logDiag('analyzeSkills', 'final_failure', err.message || String(err));
    state.errorMsg = "We couldn't analyze your story just now. Nothing was lost. You can try again.";
    state.errorRetry = analyzeSkills; state.screen = 'skills';
  }finally{
    state.busy = false; render();
  }
}

async function discoverPaths(){
  if(state.busy) return;

  const myGen = ++state.pathsDiscoveryGeneration;
  state.busy = true;
  state.screen = 'analyzing'; state.loadingMsg = 'Mapping your skills to possible directions…'; state.errorMsg=''; state.errorRetry=null; render();

  const isActive = () => myGen === state.pathsDiscoveryGeneration;
  let copyTimer = null;
  let timeoutTimer = null;
  let timedOut = false;

  function clearDiscoverPathsTimers(){
    if(copyTimer != null){ clearTimeout(copyTimer); copyTimer = null; }
    if(timeoutTimer != null){ clearTimeout(timeoutTimer); timeoutTimer = null; }
  }

  copyTimer = setTimeout(() => {
    if(!isActive() || timedOut) return;
    state.loadingMsg = DISCOVER_PATHS_COPY_MESSAGE;
    render();
  }, DISCOVER_PATHS_COPY_DELAY_MS);

  timeoutTimer = setTimeout(() => {
    if(!isActive() || timedOut) return;
    timedOut = true;
    invalidateDiscoverPathsGeneration(myGen, () => state.pathsDiscoveryGeneration, (g) => { state.pathsDiscoveryGeneration = g; });
    logDiag('discoverPaths', 'timeout', `exceeded ${DISCOVER_PATHS_TIMEOUT_MS}ms`);
    state.errorMsg = "We couldn't map career paths just now. Nothing was lost. You can try again.";
    state.errorRetry = discoverPaths;
    state.loadingMsg = '';
    state.screen = 'paths';
    if(shouldClearDiscoverPathsBusy(myGen, state.pathsDiscoveryGeneration)) state.busy = false;
    clearDiscoverPathsTimers();
    render();
  }, DISCOVER_PATHS_TIMEOUT_MS);

  // Macrotask yield: cached dynamic imports resolve in microtasks without
  // processing setTimeout callbacks; prep through prompt build can run in the
  // same turn and starve the 30s/90s watchdog until the API call yields.
  await yieldToMainThread();
  if(!isActive() || timedOut) return;

  const retainedStorySkills = getRetainedStorySkills();
  const rejected = getRejectedSkillNames();
  const retainedSkillNames = retainedStorySkills.map(s=>s.name);

  try{
    const { gateRetainedEvidence, formatDownstreamStoryForPaths } = await loadEvidenceGate();
    const pathValidation = await loadPathValidation();
    if(!isActive() || timedOut) throw new DiscoverPathsStaleError();
    await yieldToMainThread();
    if(!isActive() || timedOut) throw new DiscoverPathsStaleError();
    const evidenceGate = gateRetainedEvidence(fullStoryText(), retainedStorySkills, getRejectedSkills());
    const pathBounds = pathValidation.getEvidencePathBounds(fullStoryText(), retainedStorySkills, evidenceGate);
    const pathCountRule = pathValidation.formatEvidencePathCountInstruction(pathBounds);
    const filteredStoryContext = formatDownstreamStoryForPaths(evidenceGate);
    const system = `You are the career path engine inside iFindWorth. Given a user's story and retained story skills, generate realistic career path options.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Rules:
1) Path count rule: follow the EVIDENCE-SUPPORTED PATH COUNT block in the user message for the target range. Return only that many distinct paths — never pad beyond what evidence supports. Do not create filler paths or near-duplicate titles to satisfy a number. When evidence supports them, prefer direct-fit, adjacent, and longer-term directions. Categories (use exact strings): "Strong Evidence", "Worth Exploring", "Growth Path", "Independent Path".
2) Never say someone is unqualified — note what's uncertain instead.
3) Career-level calibration: for each path give an entryPoint (realistic first title, max 5 words) and a progression (next-level title, max 5 words) rather than one senior title.
4) Do not use unverified market-hype claims (e.g. "rare", "in high demand") unless the user's own text supports it. Prefer neutral evidence-based language.
5) transfers must ONLY use skill names copied exactly from the "Retained story skills" list below — never a rejected skill, never a skill you infer independently from the story, never a paraphrase.
6) workEnvironment describes the day-to-day nature of the role (pace, team structure, desk-based vs. hands-on) — never state or imply remote/hybrid/on-site availability, since that varies by employer and is not something you can verify. Keep it to a few words.
7) title = the entryPoint; why max 18 words, evidence-based, citing a specific story-supported skill or action (never generic filler); transfers = 2-3 exact names from the retained story skills list; gaps = 1-2 short phrases (max 5 words); transition is REQUIRED on every single path and must be exactly one of "Strong" | "Moderate" | "Developing" | "Needs More Information" — never omit it, and never leave it blank. fitEvidence is optional and, if included, uses the same four values. Do NOT generate interest or lifestyle fit — the user hasn't given preference data yet, so those are filled in later (after the results conversation and reranking), not here. Keep every field concise. Use ONLY the provenance-filtered story evidence below — never infer careers from excluded rejected-only evidence.
8) Discovery balance: include at least one Strong or Moderate direct-fit path even when familiar. Include adjacent or less-obvious paths only when retained skills support them. Do not return only paths the user already named when evidence supports other occupational families — but if evidence genuinely supports only the named direction, return the strongest evidence-based path(s) for that direction without inventing unrelated alternatives. Reject near-duplicate job titles (e.g. "Administrative Coordinator" vs "Senior Administrative Coordinator") unless entry points and evidence differ meaningfully. No random novelty, exaggerated titles, unsupported salary claims, or fabricated qualifications.${rejectedSkillsClause()}`;
    const userPrompt = pathValidation.appendEvidencePathCountBlock(
      `User's story:\n${filteredStoryContext}\n\nRetained story skills (supported by the user's story — the only names allowed in "transfers"):\n${skillsSummaryStr(retainedStorySkills)}`,
      pathCountRule
    );
    const tierProgressFn = (tier) => {
      if(!isActive() || timedOut) return;
      if(tier === 'reshape' || tier === 'repair'){
        state.loadingMsg = DISCOVER_PATHS_COPY_MESSAGE;
        render();
      }
    };
    const result = await callStructured('discoverPaths', system, userPrompt, pathsTool, TOKEN_BUDGETS.paths, (r)=>validatePathsResultWithStructure(r, fullStoryText(), retainedStorySkills, pathValidation, evidenceGate), normalizePathsResult, PATHS_REPAIR_HINT, undefined, tierProgressFn);
    if(!isActive()) throw new DiscoverPathsStaleError();
    let nextPaths = result.paths;
    nextPaths = pathValidation.enforcePathDiscoveryBalance(nextPaths, fullStoryText(), retainedStorySkills, evidenceGate);
    nextPaths = pathValidation.annotatePathsWithEvidenceNotes(nextPaths, fullStoryText(), retainedStorySkills);
    nextPaths = nextPaths.map(p => ({
      ...p,
      transfers: filterToValidatedNames(p.transfers, retainedSkillNames),
      fitInterest: 'Needs More Information',
      fitLifestyle: 'Needs More Information',
    }));
    const paths = purgeRejectedFromObject(nextPaths, rejected);
    if(!isActive() || timedOut) return;
    state.paths = paths;
    state.pathFeedback = {};
    state.pathRegenerationCount = 0;
    regenCapHintTitle = null;
    state.reranked = false; state.changeSummary='';
    state.loadingMsg = '';
    state.screen = 'paths';
  }catch(err){
    if(err instanceof DiscoverPathsStaleError) return;
    if(!isActive() || timedOut) return;
    invalidateDiscoverPathsGeneration(myGen, () => state.pathsDiscoveryGeneration, (g) => { state.pathsDiscoveryGeneration = g; });
    logDiag('discoverPaths', 'final_failure', err.message || String(err));
    state.errorMsg = "We couldn't map career paths just now. Nothing was lost. You can try again.";
    state.errorRetry = discoverPaths;
    state.loadingMsg = '';
    state.screen = 'paths';
  }finally{
    if(!timedOut) clearDiscoverPathsTimers();
    if(!timedOut && shouldClearDiscoverPathsBusy(myGen, state.pathsDiscoveryGeneration)) state.busy = false;
    if(!timedOut) render();
  }
}

async function sendConvo(){
  if(state.convoBusy) return;
  const input = document.getElementById('convoInput');
  if(!input || !input.value.trim()) return;
  const userText = input.value.trim();
  state.convo.push({who:'user', text: userText}); // item 7: original message preserved regardless of what happens next
  state.convoBusy = true;
  input.value=''; render();

  const rejected = getRejectedSkillNames();

  // Step 1: the conversational reply — plain text, not a forced tool call.
  // Preferred, not guaranteed to be "structured," because it was never
  // supposed to be data in the first place.
  const replySystem = `You are iFindWorth, discussing career discovery results with a user before they choose a direction. Be warm, specific, and evidence-based — never generic encouragement.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Reply in 2-4 sentences of plain text only — no markdown, no JSON, no preamble, no field labels.${rejectedSkillsClause()}`;
  const replyContext = `Original story: ${state.story}\n\nRetained story skills: ${getRetainedStorySkills().map(s=>s.name).join(', ')}\n\nCareer paths shown: ${state.paths.map(p=>p.title).join(', ')}\n\nAlready known interests: ${state.preferences.interests.join(', ')}\nAlready known dislikes: ${state.preferences.dislikes.join(', ')}\n\nUser's message: ${userText}`;

  let cleanReply;
  try{
    const replyText = await callTextWithRetry('sendConvo', replySystem, replyContext, TOKEN_BUDGETS.convo);
    cleanReply = purgeRejectedMentions(replyText, rejected);
    state.convo.push({who:'ai', text: cleanReply});
  }catch(err){
    // Only a genuinely unusable response (nothing came back at all, even
    // after one retry) shows the "couldn't process" message — a usable reply
    // never reaches this branch.
    logDiag('sendConvo', 'final_failure', err.message || String(err));
    state.convo.push({who:'ai', text: "I couldn't process that just now. Want to try rephrasing, or continue to choosing a direction?"});
    state.convoBusy = false; render();
    const focusInput = document.getElementById('convoInput'); if(focusInput) focusInput.focus();
    return;
  }
  render(); // reply is shown now, independent of whatever happens with extraction below

  // Step 2: a small, separate, structured extraction of any preference
  // signal. Decoupled on purpose — this can fail (even after its own
  // repair attempts) without ever retracting or blocking the reply already
  // shown, and the conversation simply continues either way.
  try{
    const deltaSystem = `You extract structured preference signals for iFindWorth's Career Intelligence Profile from one turn of a career-discovery conversation. Only include a genuine new preference signal — something the user wants more or less of in their work — never invent one. If nothing new was signaled, return empty arrays and an empty summary. Never repeat a preference already known.${rejectedSkillsClause()}`;
    const deltaPrompt = `Already known interests: ${state.preferences.interests.join(', ')}\nAlready known dislikes: ${state.preferences.dislikes.join(', ')}\n\nUser's message: ${userText}\nAssistant's reply: ${cleanReply}`;
    const delta = await callStructured('sendConvoProfileDelta', deltaSystem, deltaPrompt, profileDeltaTool, TOKEN_BUDGETS.profileDelta, validateProfileDeltaResult, normalizeProfileDeltaResult);
    const cleanDelta = purgeRejectedFromObject(delta, rejected);
    const incomingInterests = [...cleanDelta.interests, ...cleanDelta.preferences]; // "preferences" folds into the same interests signal reranking already consumes
    const newInterests = incomingInterests.filter(x=>!state.preferences.interests.includes(x) && !rejected.some(r=>r.toLowerCase()===String(x).toLowerCase()));
    const newDislikes = cleanDelta.dislikes.filter(x=>!state.preferences.dislikes.includes(x) && !rejected.some(r=>r.toLowerCase()===String(x).toLowerCase()));
    if(newInterests.length || newDislikes.length){
      state.preferences.interests = [...state.preferences.interests, ...newInterests];
      state.preferences.dislikes = [...state.preferences.dislikes, ...newDislikes];
      state.convo.push({who:'learned', interests:newInterests, dislikes:newDislikes});
    }
  }catch(err){
    // Item 8: logged only — never shown to the user, never retracts the
    // reply, and the conversation proceeds normally either way.
    logDiag('sendConvoProfileDelta', 'final_failure', err.message || String(err));
    safeLog('warn', '[CareerLaunch][sendConvoProfileDelta] Profile mutation could not be completed this turn — conversation continues unaffected.');
  }finally{
    state.convoBusy = false; render();
    const focusInput = document.getElementById('convoInput'); if(focusInput) focusInput.focus();
  }
}

function handlePathFeedback(title, feedback){
  if(!title || !feedback) return;
  const prev = state.pathFeedback[title];
  const togglingOff = prev === feedback;
  state.pathFeedback[title] = togglingOff ? undefined : feedback;
  if(feedback === 'not_interested'){
    const dislikeLabel = `Not interested in ${title}`;
    if(togglingOff){
      state.preferences.dislikes = state.preferences.dislikes.filter(d => d !== dislikeLabel);
    } else {
      if(!state.preferences.dislikes.includes(dislikeLabel)) state.preferences.dislikes.push(dislikeLabel);
      if(state.chosenPath && state.chosenPath.title === title) state.chosenPath = null;
    }
  }
  saveProfileToStorage(state);
  if(feedback === 'known' && state.pathFeedback[title] === 'known'){
    if(state.pathRegenerationCount < 2 && !state.busy){
      regenCapHintTitle = null;
      regenerateLessObviousPaths();
      return;
    }
    if(state.pathRegenerationCount >= 2){
      regenCapHintTitle = title;
    }
  } else if(regenCapHintTitle === title){
    regenCapHintTitle = null;
  }
  render();
}

async function regenerateLessObviousPaths(){
  if(state.busy) return;
  if(state.pathRegenerationCount >= 2) return;
  state.busy = true;
  const priorPaths = state.paths;
  const knownTitles = Object.entries(state.pathFeedback).filter(([,v]) => v === 'known').map(([t]) => t);
  const notInterested = Object.entries(state.pathFeedback).filter(([,v]) => v === 'not_interested').map(([t]) => t);
  state.pathRegenerationCount++;
  state.screen = 'analyzing'; state.loadingMsg = 'Finding less obvious directions…'; state.errorMsg=''; render();
  const retainedStorySkills = getRetainedStorySkills();
  const rejected = getRejectedSkillNames();
  const retainedSkillNames = retainedStorySkills.map(s=>s.name);
  const { gateRetainedEvidence, formatDownstreamStoryForPaths } = await loadEvidenceGate();
  const pathValidation = await loadPathValidation();
  const evidenceGate = gateRetainedEvidence(fullStoryText(), retainedStorySkills, getRejectedSkills());
  const pathBounds = pathValidation.getEvidencePathBounds(fullStoryText(), retainedStorySkills, evidenceGate);
  const pathCountRule = pathValidation.formatEvidencePathCountInstruction(pathBounds, { mode: 'lessObvious' });
  const filteredStoryContext = formatDownstreamStoryForPaths(evidenceGate);
  const system = `You are the career path refinement engine inside iFindWorth. The user reviewed career paths and marked some as "already knew" — meaning those directions felt too obvious. Regenerate DIFFERENT evidence-supported career path options that are less obvious but still honestly supported by retained story skills.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Critical rules for this regeneration:
1) Path count rule: follow the EVIDENCE-SUPPORTED PATH COUNT block in the user message for the target range. Return only that many distinct paths — never pad beyond what evidence supports.
2) Introduce DIFFERENT path titles — do NOT return the same titles the user already saw unless absolutely unavoidable. This is NOT a reorder — it is new candidate generation.
3) Prioritize paths with moderate/developing evidence fit that still have real story support — adjacent and unexpected directions over the most literal match.
4) Evidence still governs: never inflate fit because the user wants surprise. Preference never overrides evidence.
5) Omit paths the user marked as not interested: ${notInterested.join(', ') || 'none'}.
6) Avoid paths the user already knew (too obvious): ${knownTitles.join(', ') || 'none'} — replace with genuinely different directions.
7) Each category MUST be exactly one of: "Best Paths to Explore First", "Strong Alternatives", "Growth Directions", "Longer-Term / Independent Paths", "Lower Interest Based on What You Told Us".
8) transfers must ONLY use skill names from Retained story skills. transition required on every path. fitInterest and fitLifestyle required.
9) changeSummary (max 25 words): explain that less obvious, still evidence-supported directions were surfaced.${rejectedSkillsClause()}`;
  const compactPrior = priorPaths.map(p => ({ title: p.title, category: p.category, why: p.why, transfers: p.transfers }));
  const userPrompt = pathValidation.appendEvidencePathCountBlock(
    `User's story:\n${filteredStoryContext}\n\nRetained story skills:\n${skillsSummaryStr(retainedStorySkills)}\n\nPrevious paths shown (DO NOT repeat these titles — generate different ones):\n${JSON.stringify(compactPrior)}\n\nPaths user already knew (too obvious): ${knownTitles.join(', ') || 'none'}\nPaths user is not interested in: ${notInterested.join(', ') || 'none'}\n\nStated interests: ${state.preferences.interests.join(', ') || 'none yet'}\nStated dislikes: ${state.preferences.dislikes.join(', ') || 'none yet'}`,
    pathCountRule
  );
  try{
    const result = await callStructured('refinePaths', system, userPrompt, refinePathsTool, TOKEN_BUDGETS.paths, (r)=>validateRefinePathsResultWithStructure(r, fullStoryText(), retainedStorySkills, pathValidation, evidenceGate), normalizeRefinePathsResult, REFINE_PATHS_REPAIR_HINT);
    let paths = result.paths.map(p => ({
      ...p,
      transfers: filterToValidatedNames(p.transfers, retainedSkillNames),
    }));
    paths = purgeRejectedFromObject(paths, rejected);
    const priorTitleSet = new Set(priorPaths.map(p => p.title));
    const newTitleCount = paths.filter(p => !priorTitleSet.has(p.title)).length;
    if(newTitleCount === 0){
      state.pathRegenerationCount = Math.max(0, state.pathRegenerationCount - 1);
    }
    state.paths = paths;
    state.changeSummary = purgeRejectedMentions(result.changeSummary, rejected);
    state.reranked = true;
    if (state.chosenPath && !paths.some(p => p.title === state.chosenPath.title)) {
      state.chosenPath = null;
    }
    state.screen = 'paths';
    saveProfileToStorage(state);
  }catch(err){
    logDiag('regenerateLessObviousPaths', 'final_failure', err.message || String(err));
    state.paths = priorPaths;
    state.pathRegenerationCount = Math.max(0, state.pathRegenerationCount - 1);
    state.errorMsg = "We couldn't surface less obvious directions just now. Nothing was lost. You can try again.";
    state.errorRetry = regenerateLessObviousPaths; state.screen = 'paths';
  }finally{
    state.busy = false; render();
  }
}

async function refinePaths(){
  if(state.busy) return;
  state.busy = true;
  const priorPaths = state.paths;
  state.screen = 'analyzing'; state.loadingMsg = 'Updating your recommendations…'; state.errorMsg=''; render();
  const retainedStorySkills = getRetainedStorySkills();
  const rejected = getRejectedSkillNames();
  const retainedSkillNames = retainedStorySkills.map(s=>s.name);
  const { gateRetainedEvidence, formatDownstreamStoryForPaths } = await loadEvidenceGate();
  const pathValidation = await loadPathValidation();
  const evidenceGate = gateRetainedEvidence(fullStoryText(), retainedStorySkills, getRejectedSkills());
  const pathBounds = pathValidation.getEvidencePathBounds(fullStoryText(), retainedStorySkills, evidenceGate);
  const pathCountRule = pathValidation.formatEvidencePathCountInstruction(pathBounds, { mode: 'refinement' });
  const filteredStoryContext = formatDownstreamStoryForPaths(evidenceGate);
  const system = `You are the career path refinement engine inside iFindWorth. The user reviewed initial career paths and stated what they want more and less of. Regenerate a fresh set of evidence-supported career path options based on preferences. You MAY introduce new paths and you do NOT need to keep every original path.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Keep these dimensions separate:
- transition (and fitEvidence if included): EVIDENCE FIT ONLY — how strongly the user's story-supported experience supports this path. Never rate Strong solely because the user wants this direction.
- fitInterest: INTEREST FIT — how well this path matches stated interests, dislikes, and priorities. May be Moderate/Developing even when interest is high if evidence is thin.
- fitLifestyle: LIFESTYLE FIT — rate only from known working-condition preferences; use "Needs More Information" when unknown.
- gaps: honest development areas still to strengthen (short phrases).

Refinement rules:
1) Path count rule: follow the EVIDENCE-SUPPORTED PATH COUNT block in the user message for the target range. Return only that many distinct paths — never pad beyond what evidence supports. Do not create filler paths or near-duplicate titles to satisfy a number. Each category MUST be exactly one of: "Best Paths to Explore First", "Strong Alternatives", "Growth Directions", "Longer-Term / Independent Paths", "Lower Interest Based on What You Told Us".
2) You MAY introduce NEW paths when retained story skills reasonably support them AND stated interests make them relevant.
3) You MAY omit original paths the user explicitly rejected. If kept, place rejected directions in "Lower Interest Based on What You Told Us" — never in "Best Paths to Explore First" or "Strong Alternatives".
4) transfers must ONLY use skill names copied exactly from the Retained story skills list below — never rejected skills, never names inferred only from preferences.
5) title = entryPoint; why max 18 words, evidence-based; transition required on every path.
6) fitInterest and fitLifestyle are required on every path.
7) changeSummary (max 25 words): explain what shifted based on preferences — specific, not generic.
8) User interest is NOT evidence. Use ONLY the provenance-filtered story evidence below — never infer careers from excluded rejected-only evidence.${rejectedSkillsClause()}`;
  const compactPrior = priorPaths.map(p => ({ title: p.title, category: p.category, why: p.why, transfers: p.transfers }));
  const convoPrefs = state.convo.filter(c => c.who === 'user').map(c => c.text).join('\n');
  const userPrompt = pathValidation.appendEvidencePathCountBlock(
    `User's story:\n${filteredStoryContext}\n\nRetained story skills (supported by the user's story — the only names allowed in "transfers"):\n${skillsSummaryStr(retainedStorySkills)}\n\nPrevious paths shown (context — may replace, omit, or re-rank):\n${JSON.stringify(compactPrior)}\n\nStated interests: ${state.preferences.interests.join(', ') || 'none yet'}\nStated dislikes: ${state.preferences.dislikes.join(', ') || 'none yet'}\nPriorities: ${state.priorities.join(', ') || 'not specified yet'}\n\nPreference messages from conversation:\n${convoPrefs || 'none'}`,
    pathCountRule
  );
  try{
    const result = await callStructured('refinePaths', system, userPrompt, refinePathsTool, TOKEN_BUDGETS.paths, (r)=>validateRefinePathsResultWithStructure(r, fullStoryText(), retainedStorySkills, pathValidation, evidenceGate), normalizeRefinePathsResult, REFINE_PATHS_REPAIR_HINT);
    let paths = result.paths.map(p => ({
      ...p,
      transfers: filterToValidatedNames(p.transfers, retainedSkillNames),
    }));
    paths = purgeRejectedFromObject(paths, rejected);
    state.paths = paths;
    state.changeSummary = purgeRejectedMentions(result.changeSummary, rejected);
    state.reranked = true;
    if (state.chosenPath && !paths.some(p => p.title === state.chosenPath.title)) {
      state.chosenPath = null;
    }
    state.screen = 'paths';
  }catch(err){
    logDiag('refinePaths', 'final_failure', err.message || String(err));
    state.paths = priorPaths;
    state.errorMsg = "We couldn't update your recommendations just now. Nothing was lost. You can try again.";
    state.errorRetry = refinePaths; state.screen = 'paths';
  }finally{
    state.busy = false; render();
  }
}

async function rerankPaths(){
  if(state.busy) return;
  state.busy = true;
  state.screen = 'analyzing'; state.loadingMsg = 'Updating your recommendations…'; state.errorMsg=''; render();
  const retainedStorySkills = getRetainedStorySkills();
  const rejected = getRejectedSkillNames();
  const retainedSkillNames = retainedStorySkills.map(s=>s.name);
  const knownTitles = state.paths.map(p=>p.title);
  const system = `You are the career reranking engine inside iFindWorth. The user's career paths already exist in full — you are NOT re-describing them, only reclassifying them.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Rules:
1) For EVERY path listed below, return one entry in rankedPaths with its title (copied EXACTLY as given) and its new category — one of exactly these five strings: "Best Paths to Explore First", "Strong Alternatives", "Growth Directions", "Longer-Term / Independent Paths", "Lower Interest Based on What You Told Us". These are NOT the same labels the paths originally had (e.g. "Strong Evidence", "Worth Exploring") — always translate to one of the five above, never reuse an original label verbatim, even for a path whose ranking conceptually stays similar.
2) Never omit a path — every existing path needs an entry, even if its relative ranking doesn't change much.
3) Never move a path out of consideration just because the user dislikes it — move it to "Lower Interest Based on What You Told Us" instead of dropping it.
4) Only include whyChanged (max 18 words) when the category actually changed meaningfully for that path — omit the field otherwise.
5) Only include fitInterest and/or fitLifestyle when a stated preference clearly changes that specific rating for that path — omit them otherwise. Do NOT re-send transfers, gaps, entryPoint, progression, workEnvironment, relevance, transition, fitEvidence, or why — those already exist and are not part of this response.
6) changeSummary (max 25 words) names the preferences that drove the reranking.${rejectedSkillsClause()}`;
  // The full path content still goes to the model as INPUT (for reasoning
  // context) — only the OUTPUT schema is compact. Input tokens aren't what
  // was truncating; the model's own generated output was.
  const compactPaths = state.paths.map(p => ({ title: p.title, category: p.category, why: p.why, transfers: p.transfers, fitInterest: p.fitInterest, fitLifestyle: p.fitLifestyle }));
  const userPrompt = `Existing paths (for context — reclassify only, do not re-describe):\n${JSON.stringify(compactPaths)}\n\nRetained story skills: ${skillsSummaryStr(retainedStorySkills)}\n\nInterests: ${state.preferences.interests.join(', ')}\nDislikes: ${state.preferences.dislikes.join(', ')}\nPriorities: ${state.priorities.join(', ')}`;
  try{
    const result = await callStructured('rerankPaths', system, userPrompt, rerankTool, TOKEN_BUDGETS.rerank, validateRerankResult, (r)=>normalizeRerankResult(r, knownTitles), RERANK_REPAIR_HINT);
    let paths = mergeRerankIntoPaths(state.paths, result.rankedPaths);
    // Defense-in-depth: transfers are no longer regenerated by this call (they
    // were already filtered when the path was first created), but we still
    // re-verify them against the current retained story skills list, and scrub any
    // rejected-skill mention out of the newly-added whyChanged/changeSummary
    // text — the only new freeform text this call produces.
    paths = paths.map(p => ({ ...p, transfers: filterToValidatedNames(p.transfers, retainedSkillNames) }));
    paths = purgeRejectedFromObject(paths, rejected);
    state.paths = paths;
    state.changeSummary = purgeRejectedMentions(result.changeSummary, rejected);
    state.reranked = true;
    state.screen = 'paths';
  }catch(err){
    logDiag('rerankPaths', 'final_failure', err.message || String(err));
    state.errorMsg = "We couldn't update your recommendations just now. Nothing was lost. You can try again.";
    state.errorRetry = rerankPaths; state.screen = 'paths';
  }finally{
    state.busy = false; render();
  }
}

// Paid-flow reliability fix: entitlement is granted exactly once, here, and
// is never touched again by anything downstream. handleCheckout is itself
// idempotent — if it's somehow invoked again after the user is already paid
// (e.g. a stray extra click before the DOM updates), it does NOT re-run
// "checkout" or touch paymentStatus a second time; it just makes sure
// roadmap generation is (re)started, which is exactly what a legitimate
// retry should do anyway.
async function continueEvidenceCheck(addNewDetail){
  const input = document.getElementById('evidenceDetailInput');
  const detail = input ? input.value.trim() : '';
  const error = document.getElementById('evidenceDetailError');
  if(addNewDetail){
    if(detail.length < 25){
      if(error){
        error.style.display = 'block';
        error.textContent = 'Please add one specific action you took. A short sentence is enough.';
      }
      return;
    }
    state.additionalExperiences.push(detail);
  }

  const { gateRetainedEvidence } = await loadEvidenceGate();
  const gate = gateRetainedEvidence(fullStoryText(), getRetainedStorySkills(), getRejectedSkills());
  if(!gate.allowResumeBullets){
    if(error){
      error.style.display = 'block';
      error.textContent = 'We still need one real action before offering résumé language. Tell us something you organized, managed, created, solved, or helped complete.';
    }
    return;
  }
  saveProfileToStorage(state);
  state.screen = 'paywall';
  render();
}

function handleCheckout(){
  if(state.paymentStatus !== 'paid'){
    state.paymentStatus = 'paid';
  }
  state.roadmapStatus = 'idle';
  state.roadmapSections = { foundation: 'idle', actionPlan: 'idle', direction: 'idle' };
  state.roadmapSectionError = { foundation: null, actionPlan: null, direction: null };
  buildRoadmap();
}

// Per-section timeout. Diagnosis: this was 20000ms, applied by runCancelable
// around the ENTIRE callStructured call for a section — which can internally
// run up to 3 sequential real API round-trips (primary attempt, reshape,
// full repair). 20s is enough for any ONE of those calls given how small
// these schemas are, but not reliably enough for two or three of them back
// to back — that's why a timeout could fire while a repair response "later
// still arrived and logged": the repair was a legitimate, still-in-flight
// network call, not a hang, and the outer race simply ran out before that
// real sequence could finish. Generation tokens in each build*Section
// function (myGen checks) already guarantee a late/abandoned response can
// never mutate state after that happens — this widened window just makes it
// far less likely to happen at all for a normal multi-tier repair.
const ROADMAP_SECTION_TIMEOUT_MS = 45000;

function finalizeRoadmapStatus(){
  if(state.roadmapSections.foundation !== 'ready'){
    state.roadmapStatus = 'failed';
  } else if(state.roadmapSections.actionPlan === 'ready' && state.roadmapSections.direction === 'ready'){
    state.roadmapStatus = 'ready';
  } else {
    state.roadmapStatus = 'partial';
  }
}

// Career Foundation — the "core" section (item 2 & 3): whereYouAre, what
// already transfers, what's still uncertain, and initial gaps. Only a
// Foundation failure is treated as the whole roadmap being unusable; a
// failure here surfaces through the normal full-page error/retry, since
// there's nothing meaningful to show without it.
async function buildRoadmapFoundation(){
  if(state.busy) return false;
  const myGen = ++state.roadmapSectionGeneration.foundation;
  state.busy = true;
  state.roadmapSections.foundation = 'generating';
  state.roadmapSectionError.foundation = null;
  state.loadingMsg = 'Understanding your starting point…'; state.errorMsg=''; state.errorRetryLabel=null; render();
  const rejected = getRejectedSkillNames();
  const retainedStorySkills = getRetainedStorySkills();
  const { gateRetainedEvidence, formatEvidenceGateForRoadmapPrompt } = await loadEvidenceGate();
  const evidenceGate = gateRetainedEvidence(fullStoryText(), retainedStorySkills, getRejectedSkills());
  const system = `You are the roadmap engine inside iFindWorth, building the Career Foundation section: where the user stands today, what already transfers, and what's still uncertain.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Respect nontraditional experience. Never describe the absence of a traditional employer, formal title, office, or corporate setting as a weakness, gap, validation problem, or reason the experience is less professional. Name only practical gaps such as a tool, task, domain concept, evidence example, or verified requirement.
Do not use em dashes or en dashes. Use natural sentences and punctuation.
Rules: 1) whereYouAre: 2 sentences max, grounded in concrete past actions only. Never call self-described abilities or traits demonstrated strengths. 2) transfers: 2 to 3 skill names from the list below. 3) needsMoreInfo: 1 to 3 short phrases naming what is still unclear about fit. 4) gaps: 1 to 3 practical skills or knowledge areas that may need strengthening. Use conditional language when only self-described abilities exist.${rejectedSkillsClause()}`;
  const userPrompt = `Chosen path: ${state.chosenPath.title} (entry point): ${state.chosenPath.why}\nProgression: ${state.chosenPath.progression||''}\nPractical gaps already noted: ${respectfulGaps().join(', ')}\n\n${formatEvidenceGateForRoadmapPrompt(evidenceGate)}\n\nRetained story skills: ${skillsSummaryStr(retainedStorySkills)}`;
  try{
    const result = await runCancelable(
      (signal) => callStructured('buildRoadmapFoundation', system, userPrompt, roadmapFoundationTool, TOKEN_BUDGETS.roadmapFoundation, validateRoadmapFoundationResult, undefined, undefined, signal),
      ROADMAP_SECTION_TIMEOUT_MS
    );
    if(myGen !== state.roadmapSectionGeneration.foundation) return false; // stale — a newer attempt has since started
    const clean = purgeRejectedFromObject(result, rejected);
    state.roadmap = state.roadmap || {};
    Object.assign(state.roadmap, {
      whereYouAre: clean.whereYouAre,
      transfers: clean.transfers,
      understandBetter: clean.needsMoreInfo,
      strengthen: clean.gaps,
    });
    state.roadmapSections.foundation = 'ready';
    return true;
  }catch(err){
    if(myGen !== state.roadmapSectionGeneration.foundation) return false; // stale failure — ignore
    logDiag('buildRoadmapFoundation', 'final_failure', err.message || String(err));
    state.roadmapSections.foundation = 'failed';
    state.roadmapSectionError.foundation = "Your Starter package is unlocked and no real payment is collected during this private beta. We just could not build the foundation of your roadmap this time. Your profile, path, and preferences are all still saved.";
    return false;
  }finally{
    if(myGen === state.roadmapSectionGeneration.foundation) state.busy = false;
    render();
  }
}

// Action Plan — the 7/30/60/90-day sequence. A failure here does NOT discard
// Foundation; it's reported inline on the roadmap screen with its own retry.
async function buildRoadmapActionPlan(){
  if(state.busy) return false;
  const myGen = ++state.roadmapSectionGeneration.actionPlan;
  state.busy = true;
  state.roadmapSections.actionPlan = 'generating';
  state.roadmapSectionError.actionPlan = null;
  state.loadingMsg = 'Building your action plan…'; render();
  const rejected = getRejectedSkillNames();
  const { gateRetainedEvidence, formatEvidenceGateForRoadmapPrompt } = await loadEvidenceGate();
  const evidenceGate = gateRetainedEvidence(fullStoryText(), getRetainedStorySkills(), getRejectedSkills());
  const system = `You are the roadmap engine inside iFindWorth, building the Action Plan section: a concrete 7/30/60/90-day sequence of steps.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Respect nontraditional experience. Never describe the absence of a traditional employer, formal title, or corporate setting as a weakness, gap, or validation problem.
Do not use em dashes or en dashes. Use natural sentences and punctuation.
Rules: first7Days (3-4 concrete actions), days8to30 (3-4), days31to60 (3), days61to90 (2-3) — personalized to the evidence, gaps, and priorities below, never generic filler. Every time band must advance to a new observable outcome; do not repeat "practice," "research," or "continue" across multiple bands. Include a target-role job-description review, one portfolio/evidence artifact, an application-ready milestone, and a measurable search/application milestone when appropriate. Each action item must be a short phrase (max ~14 words). nextBestStep: one concrete action that can be completed today. Do not recommend a certificate until the user verifies target postings actually require or value it. Do not instruct "List daily tasks you already handle" for organizing/coordinating/listening unless concrete_past_action evidence exists.`;
  const gapsForPrompt = (state.roadmap && state.roadmap.strengthen) ? state.roadmap.strengthen : (state.chosenPath.gaps||[]);
  const userPrompt = `Chosen path: ${state.chosenPath.title}\nGaps to address: ${gapsForPrompt.join(', ') || 'none noted'}\nPriorities: ${state.priorities.join(', ') || 'not specified'}\n\n${formatEvidenceGateForRoadmapPrompt(evidenceGate)}`;
  try{
    const result = await runCancelable(
      (signal) => callStructured('buildRoadmapActionPlan', system, userPrompt, roadmapActionPlanTool, TOKEN_BUDGETS.roadmapActionPlan, validateRoadmapActionPlanResult, undefined, ACTION_PLAN_REPAIR_HINT, signal),
      ROADMAP_SECTION_TIMEOUT_MS
    );
    if(myGen !== state.roadmapSectionGeneration.actionPlan) return false;
    const clean = purgeRejectedFromObject(result, rejected);
    state.roadmap = state.roadmap || {};
    Object.assign(state.roadmap, {
      plan: { first7: clean.first7Days, days8to30: clean.days8to30, days31to60: clean.days31to60, days61to90: clean.days61to90 },
      nextStep: clean.nextBestStep,
    });
    state.roadmapSections.actionPlan = 'ready';
    return true;
  }catch(err){
    if(myGen !== state.roadmapSectionGeneration.actionPlan) return false;
    logDiag('buildRoadmapActionPlan', 'final_failure', err.message || String(err));
    state.roadmapSections.actionPlan = 'failed';
    state.roadmapSectionError.actionPlan = "We could not build your action plan this time. Your Starter unlock and everything else already generated are safe. Retry just this section below.";
    return false;
  }finally{
    if(myGen === state.roadmapSectionGeneration.actionPlan) state.busy = false;
    render();
  }
}

// Direction & Learning — Now/Next/Later sequence, learning strategy, search
// terms, positioning. Same isolation as Action Plan: a failure here never
// discards Foundation or Action Plan.
async function buildRoadmapDirection(){
  if(state.busy) return false;
  const myGen = ++state.roadmapSectionGeneration.direction;
  state.busy = true;
  state.roadmapSections.direction = 'generating';
  state.roadmapSectionError.direction = null;
  state.loadingMsg = 'Mapping your next steps…'; render();
  const rejected = getRejectedSkillNames();
  const retainedStorySkills = getRetainedStorySkills();
  const { gateRetainedEvidence, formatEvidenceGateForRoadmapPrompt } = await loadEvidenceGate();
  const evidenceGate = gateRetainedEvidence(fullStoryText(), retainedStorySkills, getRejectedSkills());
  const system = `You are the roadmap engine inside iFindWorth, building a career sequence, learning strategy, search terms, and positioning guidance.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Respect nontraditional experience. Never describe the absence of a traditional employer, formal title, office, or corporate setting as a weakness, gap, or validation problem. Never use "formal employer context," "formal operations role," "professional setting," or "outside a traditional employer context." Name only practical gaps such as a tool, task, domain concept, evidence example, or verified requirement.
Do not use em dashes or en dashes. Use natural sentences and punctuation.
Rules: 1) careerSequence: now is the chosen entry point, next is realistic progression, and later is a broader responsibility level or adjacent leadership direction. Do not merely add a seniority word. Each description is one sentence with at most 18 words. 2) learningStrategy: give each level a distinct outcome. Do not repeat job posting review, software research, credential research, or practice across levels. Never default to education or certificates. 3) searchTerms: 3 to 5 separate, correctly spaced job titles, including one adjacent title. 4) positioning: 2 confident sentences connecting actual actions to target requirements without pretending the target role was already held.${rejectedSkillsClause()}`;
  const userPrompt = `Chosen path: ${state.chosenPath.title} (entry point): ${state.chosenPath.why}\nProgression: ${state.chosenPath.progression||''}\nPractical gaps: ${((state.roadmap && state.roadmap.strengthen) || respectfulGaps()).filter(isRespectfulGap).join(', ')}\nPriorities: ${state.priorities.join(', ') || 'not specified'}\nInterests: ${state.preferences.interests.join(', ')}\nDislikes: ${state.preferences.dislikes.join(', ')}\n\n${formatEvidenceGateForRoadmapPrompt(evidenceGate)}`;
  try{
    const result = await runCancelable(
      (signal) => callStructured('buildRoadmapDirection', system, userPrompt, roadmapDirectionTool, TOKEN_BUDGETS.roadmapDirection, validateRoadmapDirectionResult, undefined, DIRECTION_REPAIR_HINT, signal),
      ROADMAP_SECTION_TIMEOUT_MS
    );
    if(myGen !== state.roadmapSectionGeneration.direction) return false;
    const clean = purgeRejectedFromObject(result, rejected);
    state.roadmap = state.roadmap || {};
    Object.assign(state.roadmap, {
      sequence: clean.careerSequence,
      learn: clean.learningStrategy,
      searchTerms: clean.searchTerms,
      positioning: clean.positioning,
    });
    await refreshApplicationKitSearchTerms(evidenceGate);
    state.roadmapSections.direction = 'ready';
    return true;
  }catch(err){
    if(myGen !== state.roadmapSectionGeneration.direction) return false;
    logDiag('buildRoadmapDirection', 'final_failure', err.message || String(err));
    state.roadmapSections.direction = 'failed';
    state.roadmapSectionError.direction = "We could not map your next steps this time. Your Starter unlock and everything else already generated are safe. Retry just this section below.";
    return false;
  }finally{
    if(myGen === state.roadmapSectionGeneration.direction) state.busy = false;
    render();
  }
}

// Orchestrates the three sections in sequence (Foundation first, since the
// other two lean on its output for context). Each section preserves whatever
// the previous ones already produced — a later failure never discards an
// earlier success. Only a Foundation failure routes to the full-page
// error/retry; Action Plan / Direction failures leave the user on the
// roadmap screen with whatever succeeded, plus an inline retry for the
// missing piece.
async function buildRoadmap(){
  if(state.roadmapOrchestratorBusy) return;
  state.roadmapOrchestratorBusy = true;
  state.screen = 'analyzing';
  try{
    const foundationOk = await buildRoadmapFoundation();
    if(!foundationOk){
      finalizeRoadmapStatus();
      state.errorMsg = state.roadmapSectionError.foundation;
      state.errorRetryLabel = 'Retry Building My Roadmap';
      state.errorRetry = buildRoadmap;
      state.screen = 'roadmap';
      render();
      return;
    }
    await buildRoadmapActionPlan();
    await buildRoadmapDirection();
    finalizeRoadmapStatus();
    state.screen = 'roadmap';
    render();
  }finally{
    state.roadmapOrchestratorBusy = false;
  }
}

async function buildKit(){
  if(state.busy) return;
  state.busy = true;
  state.screen = 'analyzing'; state.loadingMsg = 'Positioning your experience professionally…'; state.errorMsg=''; render();
  const retainedStorySkills = getRetainedStorySkills();
  const rejected = getRejectedSkillNames();
  const {
    gateRetainedEvidence,
    applyResumeBulletGate,
    applyLinkedInGate,
    formatEvidenceGateForPrompt,
    formatResumeBulletSources,
    formatLinkedInEvidenceContext,
    formatLinkedInRulesForPrompt,
  } = await loadEvidenceGate();
  const evidenceGate = gateRetainedEvidence(fullStoryText(), retainedStorySkills, getRejectedSkills());
  const evidenceText = fullStoryText() + ' ' + retainedStorySkills.map(s=>s.evidence).join(' ');
  const preferenceContext = [
    state.preferences.interests.length ? `Interests: ${state.preferences.interests.join(', ')}` : '',
    state.preferences.dislikes.length ? `Dislikes: ${state.preferences.dislikes.join(', ')}` : '',
    state.priorities.length ? `Priorities: ${state.priorities.join(', ')}` : '',
  ].filter(Boolean).join('\n');
  const system = `You are the Application Kit builder inside iFindWorth. Translate a user's real past experience into professional resume and LinkedIn language for a specific target path they are moving toward.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Respect nontraditional experience. Never describe the absence of a traditional employer, formal title, office, or corporate setting as a weakness or validation problem. Never use "formal employer context," "formal operations role," "professional setting," or similar language.
Do not use em dashes or en dashes. Write concise, confident human language.
Rules:
1) Resume bullets: zero to four bullets, one line each, action verb led, using ONLY the concrete past action sources listed in the user message. Never write "helped manage" when the evidence states the actions directly. When three or more distinct concrete sources exist, produce 3 or 4 useful bullets. Each bullet MUST include sourceQuote copied exactly from one listed source. If the evidence gate says NONE, return an empty array. Use a strengthen question only when a material detail is genuinely missing.
2) Provide exactly 3 linkedinHeadlines, each under 20 words, with distinct styles: "Recruiter Search-Focused", "Career Transition-Focused", and "Professional Brand-Focused". Never use "aspiring." Prefer credible truthful language such as "Administrative Support Candidate" or "Building Toward Administrative Support," followed by evidence-supported keywords. Transition headlines may name the target direction as a future direction, never as past employment. Preserve evidence category semantics.
3) One linkedinAbout: 3 to 4 sentences, first person, warm, confident, and grounded only in given evidence categories. End by connecting existing experience to the target direction. Do not imply that independent experience becomes valid only inside a company. Do not write thrive, work well across teams, reliable presence, every interaction or task, or keep things running smoothly unless explicitly supported.
4) Only draw on the retained story skills and evidence gate classifications below — do not upgrade self_described_ability, trait, or preference items into resume bullets.${rejectedSkillsClause()}`;
  const userPrompt = `Target path: ${state.chosenPath.title}\nOriginal story (for tone/context only): ${state.story}\n\n${formatEvidenceGateForPrompt(evidenceGate)}\n\nResume bullets — ONLY these concrete past-action sources (exact quotes; no other source is valid):\n${formatResumeBulletSources(evidenceGate)}\n\nLinkedIn positioning — may use these non-action items (NOT for resume bullets):\n${formatLinkedInEvidenceContext(evidenceGate)}\n\n${formatLinkedInRulesForPrompt(evidenceGate)}\n\nRetained story skills: ${retainedStorySkills.map(s=>`${s.name}: ${s.evidence}`).join(' | ')}${preferenceContext ? `\n\nCareer Intelligence Profile:\n${preferenceContext}` : ''}`;
  try{
    const result = await callStructured('buildKit', system, userPrompt, kitTool, TOKEN_BUDGETS.kit, (r)=>validateKitResult(r, evidenceText, evidenceGate));
    const resumeGated = applyResumeBulletGate(result, evidenceGate);
    const gated = applyLinkedInGate(resumeGated, evidenceGate, state.chosenPath.title);
    state.kit = purgeRejectedFromObject(gated, rejected);
    await refreshApplicationKitSearchTerms(evidenceGate);
    state.evidenceLibrary = retainedStorySkills.map(s=>({theme:s.name, evidence:s.evidence}));
    state.screen = 'kit';
  }catch(err){
    logDiag('buildKit', 'final_failure', err.message || String(err));
    state.errorMsg = "We couldn't generate your positioning language just now. Try again.";
    state.errorRetry = buildKit; state.screen = 'kit';
  }finally{
    state.busy = false; render();
  }
}

async function strengthenBullet(i){
  if(state.kitBusyIndex !== null) return;
  const input = document.getElementById('strengthenInput'+i);
  const detail = input ? input.value.trim() : '';
  const box = document.getElementById('strengthenBox'+i);
  if(!detail){ if(box) box.style.display='none'; return; }
  const bulletEl = document.getElementById('bulletText'+i);
  const original = state.kit.resumeBullets[i].text;
  state.kitBusyIndex = i;
  if(bulletEl) bulletEl.textContent = 'Updating…';
  render();
  const rejected = getRejectedSkillNames();
  const system = `You rewrite a single resume bullet to incorporate one new true detail the user just provided. ${NO_INVENTION_RULE} ${VERIFIED_INFO_RULE} Only use the exact detail given — do not round, estimate, or embellish beyond it. One line, action-verb led.${rejectedSkillsClause()}`;
  const userPrompt = `Original bullet: ${original}\nNew detail from user: ${detail}`;
  try{
    const result = await callStructured('strengthenBullet', system, userPrompt, bulletRepairTool, TOKEN_BUDGETS.bulletRepair, validateTextResult('text'));
    state.kit.resumeBullets[i] = { text: purgeRejectedMentions(result.text.trim(), rejected) };
  }catch(err){
    logDiag('strengthenBullet', 'final_failure', err.message || String(err));
    state.kit.resumeBullets[i] = { text: original };
    if(box) box.style.display='none';
  }finally{
    state.kitBusyIndex = null; render();
  }
}

async function submitAddExperience(){
  if(state.busy) return;
  const text = state.addExpText.trim();
  if(!text) return;
  state.busy = true;
  const beforeNames = new Set(state.skills.map(s=>s.name));
  state.additionalExperiences.push(text);
  state.addExpText = '';
  state.screen = 'analyzing'; state.loadingMsg = 'Updating your profile with this new experience…'; render();
  const system = `You are the Experience Translator inside iFindWorth, re-analyzing a user's full history (original story plus newly added experiences) to identify transferable professional skills.
${NO_INVENTION_RULE}
Rules: 1) Only include skills with real textual evidence. 2) evidence: a close paraphrase (max 16 words), "You described...", staying literal. 3) Calibrate strength honestly per the criteria above — don't default to "Strong" for a single brief mention. 4) Return 4 to 8 skills, strongest first.`;
  try{
    const result = await callStructured('submitAddExperience', system, fullStoryText(), skillsTool, TOKEN_BUDGETS.skills, validateSkillsResult, normalizeSkillsResult, SKILLS_REPAIR_HINT);
    const newSkills = result.skills;
    const addedNames = newSkills.filter(s=>!beforeNames.has(s.name)).map(s=>s.name);
    const { enrichSkillsWithSourceQuotes } = await loadEvidenceGate();
    state.skills = enrichSkillsWithSourceQuotes(newSkills, fullStoryText());
    const currentNames = new Set(newSkills.map(s => s.name));
    Object.keys(state.skillValidation).forEach(name => {
      if (!currentNames.has(name)) delete state.skillValidation[name];
    });
    addedNames.forEach(name => {
      delete state.skillValidation[name];
    });
    state.changeSummary = addedNames.length ? `New experience added. We found: ${addedNames.join(', ')}.` : 'New experience added. It reinforced skills you already had.';
    state.reranked = false;
    state.screen = 'skills';
  }catch(err){
    logDiag('submitAddExperience', 'final_failure', err.message || String(err));
    // Last-known-good state preserved: state.skills/additionalExperiences from
    // before this call are untouched (we never assigned to them above), so a
    // retry starts from the same profile rather than a corrupted one — except
    // the newly-added story text itself, which we deliberately keep (the user
    // did tell us that; only the re-analysis of it failed).
    state.errorMsg = "We couldn't update your profile with that experience just now. Try again.";
    state.errorRetry = submitAddExperience; state.screen = 'skills';
  }finally{
    state.busy = false; render();
  }
}

async function openStoryBankFn(){
  state.storyBank = null; state.screen = 'storyBank'; state.errorMsg=''; render();
  await buildStoryBank();
}
async function buildStoryBank(){
  if(state.busy) return;
  state.busy = true;
  const retainedStorySkills = getRetainedStorySkills();
  const rejected = getRejectedSkillNames();
  const system = `You build an interview Story Bank inside iFindWorth, using only the user's real, story-supported experience.
${NO_INVENTION_RULE}
Treat the Retained story skills in the user message only as story-supported context; never turn a skill label into an incident or outcome.
For each fixed category, either write a 2-3 sentence first-person draft using only actions and outcomes explicitly stated by the user, or return status "needs_more" with one short question. Never convert "I help," "people depend on me," or a skill label into a specific incident, resolution, system, outcome, emotion, or achievement the user did not describe. If the evidence does not contain a beginning, action, and outcome for that category, it is not interview-ready: ask for detail. Use the categories in this exact order: "Problem I solved", "Difficult customer", "Time I took initiative", "Time I organized something", "Time I led or coordinated people", "Time something went wrong", "Achievement I'm proud of".${rejectedSkillsClause()}`;
  const userPrompt = `Story: ${fullStoryText()}\nRetained story skills: ${retainedStorySkills.map(s=>`${s.name}: ${s.evidence}`).join(' | ')}`;
  try{
    const result = await callStructured('buildStoryBank', system, userPrompt, storyBankTool, TOKEN_BUDGETS.storyBank, validateStoryBankResult);
    state.storyBank = purgeRejectedFromObject(result, rejected);
  }catch(err){
    logDiag('buildStoryBank', 'final_failure', err.message || String(err));
    state.errorMsg = "We couldn't build your story bank just now. Try again.";
    state.errorRetry = buildStoryBank;
  }finally{
    state.busy = false; render();
  }
}
async function addStoryDetail(i, detail){
  if(state.storyBankBusyIndex !== null) return;
  state.storyBankBusyIndex = i;
  render();
  const cat = state.storyBank.stories[i].category;
  const rejected = getRejectedSkillNames();
  const system = `You write one interview story for iFindWorth using only the true detail just given, plus prior known evidence. ${NO_INVENTION_RULE} 2-3 sentences, first person.${rejectedSkillsClause()}`;
  const userPrompt = `Category: ${cat}\nKnown context: ${fullStoryText()}\nNew detail from user: ${detail}`;
  try{
    const result = await callStructured('addStoryDetail', system, userPrompt, singleStoryTool, TOKEN_BUDGETS.singleStory, validateTextResult('story'));
    state.storyBank.stories[i] = { category: cat, status: 'ready', story: purgeRejectedMentions(result.story.trim(), rejected) };
  }catch(err){
    logDiag('addStoryDetail', 'final_failure', err.message || String(err));
    // Leave the story entry exactly as it was (needs_more) — no partial/fake
    // story gets substituted in, and the user can try adding the detail again.
  }finally{
    state.storyBankBusyIndex = null; render();
  }
}

async function analyzeJd(){
  if(state.busy) return;
  if(!state.jdText.trim()) return;
  state.busy = true;
  state.errorMsg=''; state.screen = 'analyzing'; state.loadingMsg = 'Comparing the posting against your profile…'; render();
  const retainedStorySkills = getRetainedStorySkills();
  const retainedSkillNames = retainedStorySkills.map(s=>s.name);
  const rejected = getRejectedSkillNames();
  const system = `You compare a single pasted job description against a user's retained story skills inside iFindWorth. Base "marketAsks" only on what's actually in the pasted text below — that specific posting is a legitimate source for itself, but never generalize it into a claim about the wider market, other employers, salary, or demand.
${NO_INVENTION_RULE}
${VERIFIED_INFO_RULE}
Rules: marketAsks = 4-6 short requirements/keywords pulled from the posting text itself. youAlreadyHave = ONLY skill names copied exactly from the "Retained story skills" list below that genuinely match something in the posting — never a rejected skill, never one inferred from outside the posting. shouldStrengthen = 2-3 gaps between the posting and the user's retained story skills. overallFit = one of "Strong Match","Worth Considering","Stretch Opportunity","Needs More Information".${rejectedSkillsClause()}`;
  const userPrompt = `Job description:\n${state.jdText}\n\nRetained story skills (the only names allowed in "youAlreadyHave"): ${skillsSummaryStr(retainedStorySkills)}`;
  try{
    const result = await callStructured('analyzeJd', system, userPrompt, jdTool, TOKEN_BUDGETS.jd, validateJdResult);
    const cleaned = purgeRejectedFromObject(result, rejected);
    cleaned.youAlreadyHave = filterToValidatedNames(cleaned.youAlreadyHave, retainedSkillNames);
    state.jdAnalysis = cleaned;
    state.screen = 'jdAnalyzer';
  }catch(err){
    logDiag('analyzeJd', 'final_failure', err.message || String(err));
    state.errorMsg = "We couldn't analyze that posting just now. Try again.";
    state.errorRetry = analyzeJd; state.screen = 'jdAnalyzer';
  }finally{
    state.busy = false; render();
  }
}
