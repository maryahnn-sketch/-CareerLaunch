</head>
<body>
<div id="app"></div>

<script type="module" src="/js/supabase-auth.js"></script>
<script>
/* ============================= STATE (Career Intelligence Profile) ============================= */
function createDefaultState(){
  return {
    screen: 'landing',
    story: '',
    additionalExperiences: [],
    skills: [],
    skillValidation: {}, // name -> 'yes' | 'no'
    preferences: { interests: [], dislikes: [] },
    paths: [],
    reranked: false,
    changeSummary: '',
    chosenPath: null,
    priorities: [],
    // Explicit state-machine separation (paid-flow reliability fix): entitlement,
    // roadmap-generation status, and the roadmap data itself are three different
    // concerns that must never be conflated. paymentStatus is the sole source of
    // truth for "did the user pay" — once it's 'paid', nothing in this file ever
    // sets it back, regardless of what happens to roadmap generation afterward.
    paymentStatus: 'unpaid', // 'unpaid' | 'paid'
    roadmapStatus: 'idle',   // 'idle' | 'generating' | 'partial' | 'ready' | 'failed' — overall rollup of the 3 sections below
    // Roadmap architecture fix: generated as 3 independent sections so a failure
    // in one never discards a section that already succeeded. Each has its own
    // status, its own error detail (for inline retry UI, not the full-page
    // error), and its own generation token — incremented every time that
    // specific section (re)starts, so a response from an old, already-abandoned
    // attempt can never mutate state.roadmap even if it arrives late.
    roadmapSections: { foundation: 'idle', actionPlan: 'idle', direction: 'idle' }, // each: 'idle' | 'generating' | 'ready' | 'failed'
    roadmapSectionError: { foundation: null, actionPlan: null, direction: null },
    roadmapSectionGeneration: { foundation: 0, actionPlan: 0, direction: 0 },
    roadmapOrchestratorBusy: false, // guards the buildRoadmap() sequence itself against a duplicate double-click
    errorRetryLabel: null,   // optional override for the retry button's label
    roadmap: null,
    evidenceLibrary: [],
    kit: null,
    selectedHeadline: 0,
    storyBank: null,
    jdText: '',
    jdAnalysis: null,
    convo: [],
    loadingMsg: '',
    errorMsg: '',
    errorRetry: null,
    recording: false,
    addExpText: '',
    // Busy locks (reliability item F): prevent duplicate/overlapping AI calls.
    // `busy` guards the full-screen operations (they replace the triggering
    // button via a screen change anyway, but this is a defensive second layer).
    // The other three guard inline controls that stay on-screen while a call
    // is in flight, where a screen change can't do that job for us.
    busy: false,
    convoBusy: false,
    kitBusyIndex: null,
    storyBankBusyIndex: null,
  };
}

const state = createDefaultState();

/* ============================= PROFILE SERIALIZATION (V1) ============================= */
// Local-only persistence layer — browser localStorage (V1 profile snapshot).
const PROFILE_SCHEMA_VERSION = 1;
const TRANSIENT_SCREENS = new Set(['analyzing']);
const ROADMAP_SECTION_KEYS = ['foundation', 'actionPlan', 'direction'];
const ROADMAP_SECTION_TERMINAL = new Set(['idle', 'ready', 'failed']);

function jsonClone(value){
  return JSON.parse(JSON.stringify(value));
}

function isPlainObject(value){
  return !!value && typeof value === 'object' && !Array.isArray(value);
}

function cloneStringArray(value){
  if(!Array.isArray(value)) return [];
  return value.filter(item => typeof item === 'string').map(item => item);
}

function cloneSkillValidation(value){
  if(!isPlainObject(value)) return {};
  const out = {};
  for(const name in value){
    if(value[name] === 'yes' || value[name] === 'no') out[name] = value[name];
  }
  return out;
}

function pruneSkillValidationForSkills(skillValidation, skills){
  const names = new Set((Array.isArray(skills) ? skills : []).map(s => s && s.name).filter(Boolean));
  const out = {};
  for(const name in skillValidation){
    if(names.has(name)) out[name] = skillValidation[name];
  }
  return out;
}

function roadmapSectionHasContent(sectionKey, roadmap){
  if(!roadmap || typeof roadmap !== 'object') return false;
  if(sectionKey === 'foundation') return typeof roadmap.whereYouAre === 'string' && roadmap.whereYouAre.length > 0;
  if(sectionKey === 'actionPlan') return !!(roadmap.plan && typeof roadmap.plan === 'object');
  if(sectionKey === 'direction') return !!(roadmap.sequence && typeof roadmap.sequence === 'object');
  return false;
}

function normalizeRoadmapSectionsForSerialize(sections, roadmap){
  const base = createDefaultState().roadmapSections;
  const out = { ...base };
  for(const key of ROADMAP_SECTION_KEYS){
    const raw = sections && sections[key];
    if(raw === 'generating'){
      out[key] = roadmapSectionHasContent(key, roadmap) ? 'ready' : 'idle';
    } else if(ROADMAP_SECTION_TERMINAL.has(raw) || raw === 'partial'){
      out[key] = raw === 'partial' ? 'ready' : raw;
    } else {
      out[key] = base[key];
    }
  }
  return out;
}

function rollupRoadmapStatus(sections){
  if(sections.foundation !== 'ready') return 'failed';
  if(sections.actionPlan === 'ready' && sections.direction === 'ready') return 'ready';
  if(sections.actionPlan === 'ready' || sections.direction === 'ready') return 'partial';
  return 'idle';
}

function normalizeRoadmapStatusForSerialize(status, sections){
  if(status === 'generating') return rollupRoadmapStatus(sections);
  if(status === 'ready' || status === 'partial' || status === 'failed' || status === 'idle') return status;
  return rollupRoadmapStatus(sections);
}

function resolvePersistedScreen(screen, profileLike){
  if(screen && !TRANSIENT_SCREENS.has(screen)) return screen;
  if(profileLike.kit) return 'kit';
  if(profileLike.roadmap) return 'roadmap';
  if(profileLike.paymentStatus === 'paid') return 'roadmap';
  if(profileLike.chosenPath && Array.isArray(profileLike.priorities) && profileLike.priorities.length) return 'paywall';
  if(Array.isArray(profileLike.convo) && profileLike.convo.length) return 'conversation';
  if(Array.isArray(profileLike.paths) && profileLike.paths.length) return 'paths';
  if(Array.isArray(profileLike.skills) && profileLike.skills.length) return 'skills';
  if(typeof profileLike.story === 'string' && profileLike.story.trim()) return 'intake';
  return 'landing';
}

function serializeProfile(sourceState){
  if(!sourceState || typeof sourceState !== 'object') return null;
  const normalizedSections = normalizeRoadmapSectionsForSerialize(sourceState.roadmapSections, sourceState.roadmap);
  const normalizedRoadmapStatus = normalizeRoadmapStatusForSerialize(sourceState.roadmapStatus, normalizedSections);
  const skills = Array.isArray(sourceState.skills) ? jsonClone(sourceState.skills) : [];
  const skillValidation = pruneSkillValidationForSkills(
    cloneSkillValidation(sourceState.skillValidation),
    skills
  );
  const preferences = isPlainObject(sourceState.preferences)
    ? { interests: cloneStringArray(sourceState.preferences.interests), dislikes: cloneStringArray(sourceState.preferences.dislikes) }
    : { interests: [], dislikes: [] };
  // V1 only — preserves round-trip behavior; NOT a trustworthy entitlement source.
  // Will later be replaced/revalidated by server-verified purchase state.
  const paymentStatus = sourceState.paymentStatus === 'paid' ? 'paid' : 'unpaid';
  return {
    schemaVersion: PROFILE_SCHEMA_VERSION,
    savedAt: new Date().toISOString(),
    currentScreen: resolvePersistedScreen(sourceState.screen, sourceState),
    story: typeof sourceState.story === 'string' ? sourceState.story : '',
    additionalExperiences: cloneStringArray(sourceState.additionalExperiences),
    skills,
    skillValidation,
    preferences,
    priorities: cloneStringArray(sourceState.priorities),
    paths: Array.isArray(sourceState.paths) ? jsonClone(sourceState.paths) : [],
    reranked: !!sourceState.reranked,
    changeSummary: typeof sourceState.changeSummary === 'string' ? sourceState.changeSummary : '',
    chosenPath: sourceState.chosenPath && typeof sourceState.chosenPath === 'object' ? jsonClone(sourceState.chosenPath) : null,
    convo: Array.isArray(sourceState.convo) ? jsonClone(sourceState.convo) : [],
    paymentStatus,
    roadmap: sourceState.roadmap && typeof sourceState.roadmap === 'object' ? jsonClone(sourceState.roadmap) : null,
    roadmapSections: normalizedSections,
    roadmapStatus: normalizedRoadmapStatus,
    evidenceLibrary: Array.isArray(sourceState.evidenceLibrary) ? jsonClone(sourceState.evidenceLibrary) : [],
    kit: sourceState.kit && typeof sourceState.kit === 'object' ? jsonClone(sourceState.kit) : null,
    selectedHeadline: Number.isInteger(sourceState.selectedHeadline) && sourceState.selectedHeadline >= 0 ? sourceState.selectedHeadline : 0,
    storyBank: sourceState.storyBank && typeof sourceState.storyBank === 'object' ? jsonClone(sourceState.storyBank) : null,
    jdText: typeof sourceState.jdText === 'string' ? sourceState.jdText : '',
    jdAnalysis: sourceState.jdAnalysis && typeof sourceState.jdAnalysis === 'object' ? jsonClone(sourceState.jdAnalysis) : null,
  };
}

function migrateProfile(savedProfile){
  if(!isPlainObject(savedProfile)) return null;
  let cloned;
  try{ cloned = jsonClone(savedProfile); }catch(e){ return null; }
  let version = cloned.schemaVersion;
  if(version === undefined || version === null) version = 1;
  if(typeof version !== 'number' || !Number.isFinite(version)) return null;
  if(version > PROFILE_SCHEMA_VERSION) return null;
  if(version < 1) version = 1;
  cloned.schemaVersion = version;
  return cloned;
}

function hydrateProfile(savedProfile){
  const migrated = migrateProfile(savedProfile);
  const restored = createDefaultState();
  if(!migrated) return restored;

  if(typeof migrated.story === 'string') restored.story = migrated.story;
  if(Array.isArray(migrated.additionalExperiences)) restored.additionalExperiences = cloneStringArray(migrated.additionalExperiences);
  if(Array.isArray(migrated.skills)) restored.skills = jsonClone(migrated.skills);
  if(isPlainObject(migrated.skillValidation)) restored.skillValidation = cloneSkillValidation(migrated.skillValidation);
  if(isPlainObject(migrated.preferences)){
    restored.preferences = {
      interests: cloneStringArray(migrated.preferences.interests),
      dislikes: cloneStringArray(migrated.preferences.dislikes),
    };
  }
  if(Array.isArray(migrated.priorities)) restored.priorities = cloneStringArray(migrated.priorities);
  if(Array.isArray(migrated.paths)) restored.paths = jsonClone(migrated.paths);
  if(typeof migrated.reranked === 'boolean') restored.reranked = migrated.reranked;
  if(typeof migrated.changeSummary === 'string') restored.changeSummary = migrated.changeSummary;
  if(migrated.chosenPath && isPlainObject(migrated.chosenPath)) restored.chosenPath = jsonClone(migrated.chosenPath);
  if(Array.isArray(migrated.convo)) restored.convo = jsonClone(migrated.convo);
  if(migrated.paymentStatus === 'paid' || migrated.paymentStatus === 'unpaid') restored.paymentStatus = migrated.paymentStatus;
  if(migrated.roadmap && isPlainObject(migrated.roadmap)) restored.roadmap = jsonClone(migrated.roadmap);
  if(isPlainObject(migrated.roadmapSections)){
    const sections = normalizeRoadmapSectionsForSerialize(migrated.roadmapSections, restored.roadmap);
    restored.roadmapSections = sections;
  }
  if(typeof migrated.roadmapStatus === 'string'){
    restored.roadmapStatus = normalizeRoadmapStatusForSerialize(migrated.roadmapStatus, restored.roadmapSections);
  } else {
    restored.roadmapStatus = rollupRoadmapStatus(restored.roadmapSections);
  }
  if(Array.isArray(migrated.evidenceLibrary)) restored.evidenceLibrary = jsonClone(migrated.evidenceLibrary);
  if(migrated.kit && isPlainObject(migrated.kit)) restored.kit = jsonClone(migrated.kit);
  if(Number.isInteger(migrated.selectedHeadline) && migrated.selectedHeadline >= 0) restored.selectedHeadline = migrated.selectedHeadline;
  if(migrated.storyBank && isPlainObject(migrated.storyBank)) restored.storyBank = jsonClone(migrated.storyBank);
  if(typeof migrated.jdText === 'string') restored.jdText = migrated.jdText;
  if(migrated.jdAnalysis && isPlainObject(migrated.jdAnalysis)) restored.jdAnalysis = jsonClone(migrated.jdAnalysis);

  restored.skillValidation = pruneSkillValidationForSkills(restored.skillValidation, restored.skills);
  if(restored.chosenPath){
    const titles = new Set(restored.paths.map(p => p && p.title).filter(Boolean));
    if(!titles.has(restored.chosenPath.title)) restored.chosenPath = null;
  }
  restored.screen = resolvePersistedScreen(migrated.currentScreen, restored);

  return restored;
}

// Demo/local snapshot only. Never trust paymentStatus from localStorage
// as proof of a real purchase. Real entitlement must be verified server-side.
const PROFILE_STORAGE_KEY = 'careerlaunch.profile.v1';

function saveProfileToStorage(sourceState){
  try{
    const profile = serializeProfile(sourceState);
    if(!profile) return;
    localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profile));
  }catch(e){}
}

function loadProfileFromStorage(){
  try{
    const raw = localStorage.getItem(PROFILE_STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){
    return null;
  }
}

function applyHydratedState(hydrated){
  if(!hydrated || typeof hydrated !== 'object') return;
  for(const key in hydrated){
    if(Object.prototype.hasOwnProperty.call(hydrated, key)) state[key] = hydrated[key];
  }
}


const STEP_ORDER = ['intake','analyzing','skills','paths','conversation','choose','paywall','roadmap','kit','dashboard'];
function stepIndex(){ return STEP_ORDER.indexOf(state.screen); }
function getConfirmedSkills(){ return state.skills.filter(s => state.skillValidation[s.name] === 'yes'); }
function getRetainedStorySkills(){ return state.skills.filter(s => state.skillValidation[s.name] !== 'no'); }
function getUnconfirmedStorySkills(){ return state.skills.filter(s => state.skillValidation[s.name] !== 'yes' && state.skillValidation[s.name] !== 'no'); }
function getRejectedSkillNames(){ return state.skills.filter(s => state.skillValidation[s.name] === 'no').map(s => s.name); }
let evidenceGateModulePromise = null;
function loadEvidenceGate(){
  if(!evidenceGateModulePromise) evidenceGateModulePromise = import('/js/evidence-gate.mjs');
  return evidenceGateModulePromise;
}
function skillsSummaryStr(skills){ return skills.map(s=>`${s.name} (${s.strength})`).join(', '); }
function fullStoryText(){ return [state.story, ...state.additionalExperiences].filter(Boolean).join('\n\n'); }

// Trust rule #1: a skill the user marked "Not Quite" must never resurface — not as a
// transfer, not in reasoning text, not in any generated field — even though the raw
// story text (which we still send for context) contains the evidence for it. This is
// belt-and-suspenders: rejectedSkillsClause() tells the model up front, and
// purgeRejectedMentions()/filterToValidatedNames() scrub the model's actual output
// afterward, so a leak can't survive either a prompt the model half-follows or a
// model that infers the concept independently from the story text.
function rejectedSkillsClause(){
  const rejected = getRejectedSkillNames();
  if(!rejected.length) return '';
  return `\nThe user explicitly reviewed and REJECTED these as inaccurate: ${rejected.join(', ')}. Even though the story text below may still describe the underlying activity, treat these as struck from the record: do not name them, imply them, or use their evidence as a transfer, reason, or fit signal anywhere in your response.`;
}
function purgeRejectedMentions(text, rejectedNames){
  if(!text || !rejectedNames || !rejectedNames.length) return text;
  let result = String(text);
  rejectedNames.forEach(name=>{
    if(!name) return;
    const esc = name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const patterns = [
      new RegExp('\\b'+esc+'\\s+and\\s+','gi'),
      new RegExp('\\s+and\\s+'+esc+'\\b','gi'),
      new RegExp(esc+'\\s*,\\s*','gi'),
      new RegExp('\\s*,\\s*'+esc+'\\b','gi'),
      new RegExp('\\b'+esc+'\\b','gi'),
    ];
    patterns.forEach(p=>{ result = result.replace(p, ''); });
  });
  return result.replace(/\s{2,}/g,' ').replace(/\s+([,.;])/g,'$1').replace(/^[,;\s]+/,'').trim();
}
function filterToValidatedNames(arr, validatedNames){
  if(!Array.isArray(arr)) return arr;
  const lower = validatedNames.map(n=>n.toLowerCase());
  return arr.filter(item => lower.includes(String(item).toLowerCase()));
}
// Recursively purge rejected-skill mentions from every string field of a parsed
// AI response, so freeform reasoning (why/whyChanged/positioning/etc.) can't leak
// a rejected skill even if the model's own filtering slips.
function purgeRejectedFromObject(obj, rejectedNames){
  if(!rejectedNames || !rejectedNames.length) return obj;
  if(typeof obj === 'string') return purgeRejectedMentions(obj, rejectedNames);
  if(Array.isArray(obj)) return obj.map(item => purgeRejectedFromObject(item, rejectedNames));
  if(obj && typeof obj === 'object'){
    const out = {};
    for(const k in obj) out[k] = purgeRejectedFromObject(obj[k], rejectedNames);
    return out;
  }
  return obj;
}

// Trust rule #2: CareerLaunch has no live labor-market feed and doesn't know the
// user's location, so it must never assert current remote/hybrid/on-site availability,
// salary, demand, hiring trends, or course pricing/availability as fact. It can reason
// about what a role's day-to-day content is typically like, and can note that a stated
// preference (e.g. wanting remote work) matters and should be checked against real
// openings — but never claim that availability exists.
const VERIFIED_INFO_RULE = `Verified-information rule: you have no live labor-market data, course catalog, or the user's location. Never state or imply, as current fact, that remote/hybrid/on-site work is available, that salaries fall in some range, that demand or hiring is high or low, or that a specific course/certification exists or is free — for this path or any path. You may reason about what a role's day-to-day content typically involves and how that content (not its market availability) aligns with the user's stated preferences. If a preference concerns something that varies by employer (like remote/hybrid/on-site, pay, or hours), say the user should verify it when evaluating real openings — never assert it exists. Do not mark a "lifestyle fit" as Strong on the basis of assumed work-arrangement availability.`;

/* ============================= CLAUDE API HELPER ============================= */
// Dev-only diagnostic: this file calls api.anthropic.com directly with no API key.
// That only succeeds inside Claude's own artifact-preview environment, which
// transparently authenticates the call. Opened as a standalone file:// page (or
// hosted anywhere outside that environment), the request has no credentials and
// no CORS grant, so it will fail before this app can do anything about it.
if (window.location.protocol === 'file:') {
  safeLog('warn',
    '[CareerLaunch DEV WARNING] This page is running from file:// — the built-in ' +
    'callClaudeTool() request to api.anthropic.com will fail here because it depends on ' +
    'the Claude artifact environment to authenticate the call. Test AI features inside ' +
    'the Claude artifact preview. For a real deployment, replace callClaudeTool() with a ' +
    'request to your own backend, which holds the Anthropic API key server-side.'
  );
}

// Structured error type carrying enough context for (a) the repair-retry prompt,
// (b) dev-console diagnostics categorized by failure type, and (c) deciding
// whether a partial/invalid result is worth showing back to the model to fix.
class StructuredCallError extends Error {
  constructor(code, category, detail, partial){
    super(`${code}: ${detail}`);
    this.code = code;           // NETWORK_ERROR | API_ERROR | RESPONSE_PARSE_ERROR | TRUNCATED_OUTPUT | NO_STRUCTURED_OUTPUT | SCHEMA_VALIDATION_FAILED
    this.category = category;   // network | http | parse | schema
    this.detail = detail;
    this.partial = partial || null;
  }
}

// Safe logging helper (surgical fix): this artifact environment's console
// sandbox doesn't implement every standard method — console.debug threw a
// real exception here, and because nothing caught it, that exception
// propagated up through callClaudeTool as if the API call itself had failed,
// which is why a pure logging call showed up disguised as repair_failed/
// final_failure. safeLog never throws: it checks the requested method
// exists, falls back to console.log if not, and swallows anything the
// logging call itself throws (e.g. a console proxy that exists but errors on
// invocation, or an argument it can't serialize) so diagnostics can NEVER
// interrupt product logic, only ever be silently skipped in the worst case.
function safeLog(method, ...args){
  try{
    const fn = (console && typeof console[method] === 'function') ? console[method] : console.log;
    if(typeof fn === 'function') fn.apply(console, args);
  }catch(loggingErr){
    // Logging must never be able to break the app it's diagnosing — swallow
    // silently rather than risk a second failure on top of whatever we were
    // trying to log in the first place.
  }
}

// Dev-console diagnostics (reliability item H): every failure is logged with which
// AI operation it was, and which layer caught it — network, http, parse, schema,
// integrity, or repair-failure — without ever putting technical detail, prompts,
// or raw model output into the customer-facing UI.
function logDiag(operation, category, detail){
  safeLog('error', `[CareerLaunch][${operation}][${category}]`, detail);
}

// Primary reliability layer (item 3): force the model to answer through a
// schema-constrained tool call instead of free-text-formatted-as-JSON. This is
// the strongest structured-output guarantee the Messages API offers — the model
// can't wander into prose, forget a closing brace, or wrap the answer in
// commentary, because `tool_choice` forces exactly one call to exactly one
// tool, and the API returns `input` as an already-parsed object, never a string
// we have to re-parse ourselves.
// Reliability item 2: a safe structural summary of what the API actually sent
// back — content block types, stop reason, whether a tool_use block exists,
// its name, and the top-level KEYS (never values) of its input. Never logs
// story text, evidence, or any other user content, and never logs full field
// values — only shape, so it's safe for a dev console even with real user data
// in play.
function summarizeResponse(data, expectedToolName){
  const blocks = (data.content || []).map(b => b.type);
  const toolUse = (data.content || []).find(b => b.type === 'tool_use');
  return {
    stop_reason: data.stop_reason,
    content_block_types: blocks,
    expected_tool_name: expectedToolName,
    tool_use_present: !!toolUse,
    tool_use_name: toolUse ? toolUse.name : null,
    tool_input_top_level_keys: (toolUse && toolUse.input && typeof toolUse.input === 'object') ? Object.keys(toolUse.input) : null,
  };
}

// Shared structured-response layer fix: extracts exactly one complete,
// brace-balanced JSON object from a larger string that may contain
// commentary before and/or after it. This is a strict scanner, not a loose
// parser — it tracks string/escape state so braces inside JSON string values
// don't throw off the depth count, and it never returns a substring unless
// braces are fully balanced. It does NOT attempt to fix, complete, or guess
// at broken JSON: if no balanced object is found, or the extracted substring
// still fails JSON.parse, that's a genuine failure, not something this
// papers over. Used only as a fallback when tool_choice wasn't honored — see
// callClaudeTool.
function extractFirstJsonObject(text){
  const start = text.indexOf('{');
  if(start === -1) return null;
  let depth = 0;
  let inString = false;
  let escapeNext = false;
  for(let i = start; i < text.length; i++){
    const ch = text[i];
    if(escapeNext){ escapeNext = false; continue; }
    if(inString){
      if(ch === '\\'){ escapeNext = true; continue; }
      if(ch === '"'){ inString = false; }
      continue;
    }
    if(ch === '"'){ inString = true; continue; }
    if(ch === '{'){ depth++; }
    else if(ch === '}'){
      depth--;
      if(depth === 0) return text.slice(start, i + 1);
    }
  }
  return null; // no complete, balanced object found — genuinely incomplete/malformed
}

async function buildClaudeAuthHeaders(){
  const headers = { "Content-Type": "application/json" };
  if(window.CareerLaunchAuth){
    await window.CareerLaunchAuth.ready;
    const token = await window.CareerLaunchAuth.getAccessToken();
    if(token) headers.Authorization = `Bearer ${token}`;
  }
  return headers;
}

async function callClaudeTool(system, userPrompt, tool, maxTokens, operation, signal, apiContext){
  let response;
  try{
    response = await fetch("/api/claude", {
      method: "POST",
      headers: await buildClaudeAuthHeaders(),
      body: JSON.stringify({
        operation: operation,
        max_tokens: maxTokens || 1000,
        userPrompt: userPrompt,
        context: {
          rejectedSkillNames: getRejectedSkillNames(),
          ...(apiContext || {})
        }
      })
      // Deliberately NOT passing `signal` here — see runCancelable for why.
      // This artifact environment's fetch relays each request to the host
      // frame over window.postMessage, and AbortSignal is not structured-
      // cloneable, so including one throws synchronously ("AbortSignal
      // object could not be cloned") before any request is even attempted.
      // That was a real, live failure on every roadmap section call — the
      // only calls that ever passed a genuine AbortController.signal here.
      // The `signal` parameter is still accepted (unused) so callers/
      // callStructured don't need to change; timeout protection is provided
      // entirely by the bounded race in runCancelable instead.
    });
  }catch(networkErr){
    // Kept for forward-compatibility with environments where signal IS
    // passed and DOES support real fetch cancellation — inert here since we
    // no longer send a signal, but harmless to leave in place.
    if(networkErr.name === 'AbortError'){
      throw new StructuredCallError('TIMEOUT', 'network', 'Request was aborted because its time budget ran out.');
    }
    // TypeError: Failed to fetch — almost always CORS/network/offline-file rejection
    throw new StructuredCallError('NETWORK_ERROR', 'network',
      'Network-level failure calling Claude API (often CORS, connectivity, or running outside the Claude artifact environment): ' + networkErr.message);
  }

  if(!response.ok){
    let bodyText = '';
    try{ bodyText = await response.text(); }catch(readErr){ /* body unavailable */ }
    throw new StructuredCallError('API_ERROR', 'http', `${response.status} ${response.statusText}: ${bodyText || '(no body)'}`);
  }

  let data;
  try{
    data = await response.json();
  }catch(parseErr){
    throw new StructuredCallError('RESPONSE_PARSE_ERROR', 'parse', 'Could not parse the API response body as JSON: ' + parseErr.message);
  }

  safeLog('log', `[CareerLaunch][${operation || 'unknown'}][response_shape]`, summarizeResponse(data, tool.name));

  // If the model was cut off mid-answer, whatever structured content exists may
  // be incomplete even if syntactically present — treat this as a failure that
  // should trigger a repair retry (with instructions to be more concise) rather
  // than silently accepting a half-built result.
  if(data.stop_reason === 'max_tokens'){
    throw new StructuredCallError('TRUNCATED_OUTPUT', 'parse',
      'Response was cut off at the token limit before the structured output completed. This is the most common cause of "not valid JSON" failures when a call asks for a lot of content (e.g. several career paths with many fields each).');
  }

  const toolUse = (data.content || []).find(b => b.type === 'tool_use' && b.name === tool.name);
  if(toolUse && toolUse.input && typeof toolUse.input === 'object'){
    return toolUse.input;
  }

  // Fallback: forced tool_choice is NOT a hard guarantee in this environment —
  // confirmed live and repeatedly (this is model/API-level nondeterminism, not
  // an implementation defect in how we request it: every call here sets
  // tools+tool_choice identically via this one shared function, so the
  // request itself is correct). When it happens, don't fail immediately —
  // try to recover a JSON object from the text. Content recovered this way
  // skipped the API's own schema/enum enforcement (that only applies to real
  // tool_use), which is exactly why callStructured normalizes and validates
  // it just as strictly as a "real" tool response before trusting it.
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  if(text){
    const cleaned = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    // Fast path: the whole thing is valid JSON on its own (most common case
    // when the model does answer with bare JSON, just not via tool_use).
    try{
      return JSON.parse(cleaned);
    }catch(parseErr){
      // Shared-layer fix: a response can be genuinely valid JSON with plain-
      // language commentary before and/or after it (e.g. "Based on what you
      // shared, here's the analysis: {...} Let me know if you'd like
      // changes!") — that trailing/leading prose alone made the fast path
      // above fail, even though the JSON itself was fine. Extract exactly
      // one complete, brace-balanced JSON object from within the text (never
      // a partial/repaired guess) and parse ONLY that substring. This still
      // requires syntactically valid JSON — schema validation runs on the
      // result afterward exactly as it would for a clean tool_use response,
      // so this makes parsing more tolerant without making acceptance any
      // less strict.
      const extracted = extractFirstJsonObject(cleaned);
      if(extracted){
        try{
          return JSON.parse(extracted);
        }catch(extractErr){
          throw new StructuredCallError('RESPONSE_PARSE_ERROR', 'parse',
            'Model returned plain text instead of the forced tool call, and no complete valid JSON object could be extracted from it: ' + extractErr.message, text);
        }
      }
      throw new StructuredCallError('RESPONSE_PARSE_ERROR', 'parse',
        'Model returned plain text instead of the forced tool call, and that text was not valid JSON either: ' + parseErr.message, text);
    }
  }

  throw new StructuredCallError('NO_STRUCTURED_OUTPUT', 'parse',
    'Model did not return the expected structured tool call or any usable text. stop_reason=' + data.stop_reason);
}

// sendConvo reliability fix: a conversational reply is inherently natural
// language, not data — forcing it through a tool-call/JSON shape (as before)
// meant that when the model answered in plain text anyway (confirmed live,
// same tool_choice-isn't-guaranteed issue seen elsewhere), the old JSON
// fallback correctly refused to parse prose as JSON and discarded a
// perfectly good reply. This path never asks for structure at all — it takes
// whatever text comes back, which is exactly what a reply naturally is.
// Preference extraction is a separate, small, structured call (profileDeltaTool)
// that can fail independently without ever taking the reply down with it.
async function callClaudeText(system, userPrompt, maxTokens, operation, signal){
  let response;
  try{
    response = await fetch("/api/claude", {
      method: "POST",
      headers: await buildClaudeAuthHeaders(),
      body: JSON.stringify({
        operation: operation,
        max_tokens: maxTokens || 500,
        userPrompt: userPrompt,
        context: {
          rejectedSkillNames: getRejectedSkillNames()
        }
      })
      // Same fix as callClaudeTool: no `signal` passed to fetch — an
      // AbortSignal cannot cross this environment's postMessage-based fetch
      // transport (not structured-cloneable). Parameter kept for interface
      // stability; unused here for the same reason.
    });
  }catch(networkErr){
    if(networkErr.name === 'AbortError'){
      throw new StructuredCallError('TIMEOUT', 'network', 'Request was aborted because its time budget ran out.');
    }
    throw new StructuredCallError('NETWORK_ERROR', 'network',
      'Network-level failure calling Claude API (often CORS, connectivity, or running outside the Claude artifact environment): ' + networkErr.message);
  }

  if(!response.ok){
    let bodyText = '';
    try{ bodyText = await response.text(); }catch(readErr){ /* body unavailable */ }
    throw new StructuredCallError('API_ERROR', 'http', `${response.status} ${response.statusText}: ${bodyText || '(no body)'}`);
  }

  let data;
  try{
    data = await response.json();
  }catch(parseErr){
    throw new StructuredCallError('RESPONSE_PARSE_ERROR', 'parse', 'Could not parse the API response body as JSON: ' + parseErr.message);
  }

  safeLog('log', `[CareerLaunch][sendConvo][response_shape]`, { stop_reason: data.stop_reason, content_block_types: (data.content||[]).map(b=>b.type) });

  if(data.stop_reason === 'max_tokens'){
    throw new StructuredCallError('TRUNCATED_OUTPUT', 'parse', 'Response was cut off at the token limit before finishing.');
  }

  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  if(!text){
    throw new StructuredCallError('NO_STRUCTURED_OUTPUT', 'parse', 'No usable text in the response. stop_reason=' + data.stop_reason);
  }
  return text;
}

// One retry on any failure — network hiccup, truncation, empty response —
// since there's no schema to reshape here, just a plain-text regenerate.
async function callTextWithRetry(operation, system, userPrompt, maxTokens){
  try{
    return await callClaudeText(system, userPrompt, maxTokens, operation);
  }catch(firstErr){
    logDiag(operation, firstErr.category || 'unknown', firstErr.message || String(firstErr));
    try{
      const text = await callClaudeText(system, userPrompt, maxTokens, operation);
      safeLog('warn', `[CareerLaunch][${operation}][repair_succeeded] Plain-text retry produced a usable reply after: ${firstErr.code}`);
      return text;
    }catch(secondErr){
      logDiag(operation, 'repair_failed', secondErr.message || String(secondErr));
      throw secondErr;
    }
  }
}

// Reliability items 5-9: three-tier recovery, cheapest and most content-
// preserving option tried first.
//   Tier 1 — normal generation, then client-side normalization (enum casing/
//     whitespace, string-vs-array coercion) BEFORE validation. This alone
//     fixes the most common live failure mode: a response that fell back to
//     unstructured text (see callClaudeTool above) contains real, usable
//     career reasoning but didn't get the API's own enum/shape enforcement.
//   Tier 2 — if tier 1 still fails schema validation (meaning we DID get a
//     structured, parseable result — just not fully schema-compliant), send
//     ONLY that invalid result to a small "reshape, don't regenerate" call:
//     it is explicitly told to fix structure/casing/missing-field-formatting
//     using nothing but the content already given, never to invent new paths
//     or reasoning. This is what "preserve valid career reasoning" (item 7)
//     actually means in code — the original substance is the input, not the
//     story.
//   Tier 3 — if tier 1 failed for a non-schema reason (network/parse/
//     truncation, so there's no usable partial to reshape), or tier 2 itself
//     fails, fall back to a full regenerate-with-repair-note at a boosted
//     token budget for size-related failures. This is the same mechanism as
//     before, now used only as a last resort rather than the first retry.
// State is never mutated by this function — callers only assign to `state`
// after it resolves successfully, which is what preserves last-known-good
// state automatically.
const REPAIR_BUDGET_CAP = 4000;

// Timeout fix, corrected: the original version here used Promise.race
// against a plain timer, which rejected the OUTER promise but left the
// underlying fetch — and any repair tier after it — running in the
// background (a real reported bug: a repair request kept going after
// final_failure had already fired). A follow-up attempt "fixed" that by
// threading a real AbortController.signal through every tier's fetch —
// which caused a DIFFERENT, worse live bug: this artifact environment's
// fetch relays each request to the host frame over window.postMessage, and
// AbortSignal is not structured-cloneable, so passing one into fetch() threw
// synchronously ("AbortSignal object could not be cloned") on every roadmap
// section call — the only calls that ever built a real AbortController.
//
// True fetch-level cancellation isn't available in this environment, full
// stop — there's no signal variant that works here. So this relies entirely
// on the bounded outer race: the caller's await always settles within `ms`
// regardless of what the underlying request does. If the abandoned inner
// promise later resolves, nothing is still awaiting it (the caller already
// moved into its catch/finally), so it cannot apply a stale result to state;
// the per-section generation-token checks in each build*Section function are
// a second, independent guard against that same class of staleness. See
// callClaudeTool/callClaudeText for the matching fetch-level fix (signal is
// simply never passed to fetch at all, there or here).
function runCancelable(buildPromise, ms){
  let timer;
  const timeoutPromise = new Promise((_, reject) => {
    timer = setTimeout(() => {
      reject(new StructuredCallError('TIMEOUT', 'network', `Operation did not respond within ${ms}ms.`));
    }, ms);
  });
  return Promise.race([buildPromise(undefined), timeoutPromise]).finally(() => clearTimeout(timer));
}

async function callStructured(operation, system, userPrompt, tool, maxTokens, validateFn, normalizeFn, extraRepairHint, signal){
  function runValidation(rawResult){
    let result = rawResult;
    if(normalizeFn) result = normalizeFn(result);
    if(validateFn){
      const check = validateFn(result);
      // Attach the RAW (pre-normalize) result as the repair seed, not the
      // filtered one — normalizeSkillsResult (and similar) can DROP malformed
      // items entirely, and a repair call needs to see what was actually
      // there (e.g. a skill's evidence text minus its missing name) to fix
      // it, not just the items that already survived filtering.
      if(!check.ok) throw new StructuredCallError('SCHEMA_VALIDATION_FAILED', 'schema', check.reason, rawResult);
    }
    return result;
  }

  // Tier 1
  let tier1Err;
  try{
    const raw = await callClaudeTool(system, userPrompt, tool, maxTokens, operation, signal);
    return runValidation(raw);
  }catch(err){
    tier1Err = err;
    logDiag(operation, err.category || 'unknown', err.message || String(err));
  }

  // Tier 2 — only makes sense when tier 1 actually produced a structured (if
  // non-compliant) result to reshape. A network/http/truncation/unparseable
  // failure has nothing usable to send here, so it skips straight to tier 3.
  if(tier1Err.category === 'schema' && tier1Err.partial){
    try{
      let reshapeSystem = `You are a strict data formatter for iFindWorth. You will be given content that was already generated but does not match the required schema exactly (reason it failed: ${tier1Err.detail || tier1Err.message}). Reshape it to match the schema EXACTLY — fix field names, enum wording/casing, and string-vs-array mismatches, and restructure as needed. Use ONLY the substance already present in the given content. Do NOT invent new career paths, skills, reasoning, gaps, or any other fact. Do NOT change the meaning of any field — only its format.`;
      if(extraRepairHint) reshapeSystem += ` ${extraRepairHint}`;
      const reshapeUserPrompt = `Content to reshape (fix structure/formatting only — keep the substance exactly as given):\n${JSON.stringify(tier1Err.partial)}`;
      const raw = await callClaudeTool(reshapeSystem, reshapeUserPrompt, tool, Math.min(maxTokens, 1200), operation + ':reshape', signal, {
        reshapeFailureDetail: tier1Err.detail || tier1Err.message
      });
      const result = runValidation(raw);
      safeLog('warn', `[CareerLaunch][${operation}][repair_succeeded] Format-only reshape recovered a valid result (original content preserved) after: ${tier1Err.code}`);
      return result;
    }catch(tier2Err){
      logDiag(operation, 'reshape_failed', tier2Err.message || String(tier2Err));
      // fall through to tier 3
    }
  }

  // Tier 3 — full regenerate, boosted budget if the original failure looked
  // size-related, with the invalid/partial content included so the model is
  // fixing its own last answer rather than starting blind.
  try{
    let repairNote = `Your previous response was invalid (${tier1Err.code || 'ERROR'}): ${tier1Err.detail || tier1Err.message}. Call the SAME tool again with a corrected, COMPLETE result that matches the schema and instructions exactly — every required field must be present, and every enum field must match one of its allowed values EXACTLY (same wording and capitalization).`;
    if(extraRepairHint) repairNote += ` ${extraRepairHint}`;
    const sizeRelated = tier1Err.code === 'TRUNCATED_OUTPUT' || tier1Err.code === 'RESPONSE_PARSE_ERROR' || tier1Err.code === 'NO_STRUCTURED_OUTPUT';
    const repairMaxTokens = sizeRelated ? Math.min(Math.ceil(maxTokens * 1.6), REPAIR_BUDGET_CAP) : maxTokens;
    if(sizeRelated){
      repairNote += ` Your previous response appears to have been cut off before finishing — this retry has a larger output budget, but also shorten text fields and/or return fewer list items where the schema allows it.`;
    }
    if(tier1Err.partial){
      try{ repairNote += `\n\nYour previous (invalid) output was:\n${JSON.stringify(tier1Err.partial)}`; }catch(e){ /* not serializable, skip */ }
    }
    const finalPrompt = `${userPrompt}\n\n---\nREPAIR REQUEST: ${repairNote}`;
    const raw = await callClaudeTool(system, finalPrompt, tool, repairMaxTokens, operation + ':repair', signal);
    const result = runValidation(raw);
    safeLog('warn', `[CareerLaunch][${operation}][repair_succeeded] Full repair retry produced a valid result after: ${tier1Err.code} (budget ${maxTokens} -> ${repairMaxTokens})`);
    return result;
  }catch(tier3Err){
    logDiag(operation, 'repair_failed', tier3Err.message || String(tier3Err));
    throw tier3Err;
  }
}

const NO_INVENTION_RULE = `Strict evidence rule: never state or imply a fact about the user that they did not provide — no years of experience, revenue, customer counts, team size, percentages, growth rates, employer names, credentials, education, software proficiency, job titles, project scale, geographic reach, awards, or results. If a detail would strengthen something but wasn't given, leave it out rather than inventing it.
Evidence must stay literal (do not silently upgrade it into a broader claim): "managing household bills" must not become "managing family finances"; "helping with school events" must not become "community involvement". Keep two layers separate — the evidence text is what the user actually said, paraphrased closely; any professional interpretation of what that might indicate belongs only in the skill/path NAME or reasoning field, never folded into the evidence text itself as if it were an additional fact.
When describing what a type of role typically involves (pace, people-interaction level, environment), phrase it as a general tendency for that kind of role ("this type of role often involves..."), not a settled fact about a specific job — actual duties vary by employer.`;

// Best-effort evidence-traceability check (supports reliability item G4 and
// integrity items A/B): flags a generated number that doesn't appear anywhere
// in the user's own story/evidence text, since a fabricated statistic is one of
// the most concrete, mechanically-detectable forms of invented fact. This is a
// heuristic, not a full fact-checker — it catches invented numbers, not every
// possible unsupported claim — so it's used to trigger a repair retry, not as a
// silent auto-fix.
function findUnsupportedNumerals(text, sourceText){
  if(!text) return [];
  const nums = String(text).match(/\b\d+(\.\d+)?\b/g) || [];
  const source = String(sourceText || '');
  const unsupported = nums.filter(n => !source.includes(n));
  return [...new Set(unsupported)];
}

/* ============================= TOOL SCHEMAS (structured-output enforcement) ============================= */
const STRENGTH_ENUM = ['Strong','Moderate','Developing','Needs More Information'];
const PATH_CATEGORY_ENUM = ['Strong Evidence','Worth Exploring','Growth Path','Independent Path'];

// Reliability items 4-7: since forced tool_choice is NOT a reliable guarantee
// in this environment (confirmed live), content that arrives via the text-JSON
// fallback in callClaudeTool never went through the API's own schema/enum
// enforcement — only our prose instructions did. That's the most likely source
// of a live SCHEMA_VALIDATION_FAILED on an otherwise-usable response: a value
// like "moderate" instead of "Moderate", "strong evidence" instead of "Strong
// Evidence", or a single string where an array was expected. These helpers fix
// that class of mismatch deterministically, client-side, before validation
// even runs — no extra API call, and the model's actual career reasoning is
// never discarded or regenerated over a casing difference.
function normalizeEnum(raw, enumList){
  if(enumList.includes(raw)) return raw;
  if(typeof raw !== 'string') return raw;
  const trimmed = raw.trim();
  const match = enumList.find(e => e.toLowerCase() === trimmed.toLowerCase());
  return match || raw; // no confident match: leave as-is so validation still catches it
}
// Live bug fix: a model answering "Weak" for fitInterest is semantically
// clear and USABLE — it's a synonym, not a malformed value — but it isn't
// literally one of STRENGTH_ENUM's exact strings, so the plain case-
// insensitive matching in normalizeEnum correctly declines to guess and
// leaves it as-is, which then fails validation. This is a second, narrower
// normalization step specifically for fit/strength-type fields: map a small,
// deliberately conservative list of common semantic synonyms onto the
// canonical scale CareerLaunch already uses (STRENGTH_ENUM), before falling
// back to normalizeEnum's casing-only match. Only obvious equivalents are
// listed — nothing here guesses at a genuinely ambiguous or contradictory
// value, which is left alone so validation still catches it.
const FIT_VALUE_SYNONYMS = {
  'weak': 'Developing', 'poor': 'Developing', 'low': 'Developing', 'limited': 'Developing', 'minimal': 'Developing',
  'not aligned': 'Developing', 'misaligned': 'Developing', 'poor match': 'Developing', 'incompatible': 'Developing', 'conflicting': 'Developing', 'conflicts': 'Developing', 'not a match': 'Developing',
  'medium': 'Moderate', 'fair': 'Moderate', 'average': 'Moderate', 'mixed': 'Moderate', 'ok': 'Moderate', 'okay': 'Moderate',
  'partially aligned': 'Moderate', 'partial match': 'Moderate', 'somewhat aligned': 'Moderate', 'partial': 'Moderate',
  'good': 'Strong', 'high': 'Strong', 'excellent': 'Strong', 'great': 'Strong', 'solid': 'Strong',
  'aligned': 'Strong', 'well aligned': 'Strong', 'well-aligned': 'Strong', 'compatible': 'Strong', 'match': 'Strong', 'good match': 'Strong', 'strong match': 'Strong', 'good fit': 'Strong',
  'unknown': 'Needs More Information', 'unclear': 'Needs More Information', 'n/a': 'Needs More Information', 'na': 'Needs More Information', 'none': 'Needs More Information', '': 'Needs More Information',
  'uncertain': 'Needs More Information', 'tbd': 'Needs More Information', 'not enough information': 'Needs More Information', 'not enough info': 'Needs More Information',
};
function normalizeFitValue(raw){
  if(typeof raw !== 'string') return raw;
  const trimmed = raw.trim();
  if(STRENGTH_ENUM.includes(trimmed)) return trimmed; // already canonical — fast path
  const lower = trimmed.toLowerCase();
  if(Object.prototype.hasOwnProperty.call(FIT_VALUE_SYNONYMS, lower)) return FIT_VALUE_SYNONYMS[lower];
  return normalizeEnum(trimmed, STRENGTH_ENUM); // fall back to casing-only match; leaves genuinely unrecognized values untouched
}
function ensureArray(v){
  if(Array.isArray(v)) return v;
  if(v === undefined || v === null || v === '') return [];
  return [v];
}
// Item-level resilience for paths (mirrors the skills fix): a usable path
// needs a minimum set of fields — everything else (gaps, workEnvironment,
// relevance, fitEvidence) is optional and rendered with a safe fallback in
// the UI already, so it's deliberately NOT required here. Requiring fields
// the product tolerates being absent only increases the chance one omission
// sinks an otherwise-good path.
const MIN_VALID_PATHS = 3;
function isValidPathItem(p){
  return !!p && typeof p === 'object'
    && isNonEmptyStr(p.title)
    && PATH_CATEGORY_ENUM.concat(RERANK_CATEGORY_ENUM).includes(p.category)
    && isNonEmptyStr(p.why)
    && STRENGTH_ENUM.includes(p.transition)
    && isNonEmptyStr(p.entryPoint)
    && isNonEmptyStr(p.progression)
    && Array.isArray(p.transfers);
}
// Which specific required field made an item fail — used only for the dev
// diagnostic log, never shown to the user, and never includes story/evidence
// text, just field names.
function firstInvalidPathField(p){
  if(!p || typeof p !== 'object') return 'not an object';
  if(!isNonEmptyStr(p.title)) return 'title';
  if(!PATH_CATEGORY_ENUM.concat(RERANK_CATEGORY_ENUM).includes(p.category)) return 'category';
  if(!isNonEmptyStr(p.why)) return 'why';
  if(!STRENGTH_ENUM.includes(p.transition)) return 'transition';
  if(!isNonEmptyStr(p.entryPoint)) return 'entryPoint';
  if(!isNonEmptyStr(p.progression)) return 'progression';
  if(!Array.isArray(p.transfers)) return 'transfers';
  return 'unknown';
}
function normalizePathItem(p){
  if(!p || typeof p !== 'object') return p;
  const out = {
    ...p,
    title: typeof p.title === 'string' ? p.title.trim() : p.title,
    category: normalizeEnum(p.category, PATH_CATEGORY_ENUM.concat(RERANK_CATEGORY_ENUM)),
    transition: normalizeFitValue(p.transition), // never defaults a missing value — only maps an already-present value onto the canonical scale
    transfers: ensureArray(p.transfers),
    gaps: ensureArray(p.gaps),
    relevance: ensureArray(p.relevance),
  };
  if(p.fitEvidence !== undefined) out.fitEvidence = normalizeFitValue(p.fitEvidence);
  if(p.fitInterest !== undefined) out.fitInterest = normalizeFitValue(p.fitInterest);
  if(p.fitLifestyle !== undefined) out.fitLifestyle = normalizeFitValue(p.fitLifestyle);
  return out;
}
// Tolerates the model wrapping the array under an unexpected key, or returning
// a bare array, in addition to the expected {paths:[...]} shape — a cheap
// safety net for the text-fallback path where no schema enforced the wrapper
// key either. Then, item by item: normalize casing/shape, keep anything that
// clears the minimum bar, DROP (never invent a replacement for) anything that
// doesn't. "repaired" counts items that only became valid because
// normalization fixed something (casing, string-vs-array) — a cheap, honest
// proxy for "silently repaired" vs "was already fine".
function normalizePathsResult(result){
  let rawPaths;
  if(Array.isArray(result)) rawPaths = result;
  else if(result && typeof result === 'object'){
    rawPaths = result.paths;
    if(!Array.isArray(rawPaths)) rawPaths = result.careerPaths || result.results || null;
  }
  if(!Array.isArray(rawPaths)) return result;

  const total = rawPaths.length;
  let repaired = 0;
  const valid = [];
  const droppedFields = [];
  for(const rawItem of rawPaths){
    const normalized = normalizePathItem(rawItem);
    if(isValidPathItem(normalized)){
      let changed = false;
      try{ changed = JSON.stringify(rawItem) !== JSON.stringify(normalized); }catch(e){ /* ignore */ }
      if(changed) repaired++;
      valid.push(normalized);
    } else {
      droppedFields.push(firstInvalidPathField(normalized));
    }
  }
  safeLog('log', `[CareerLaunch][paths][item_validation] returned=${total} valid=${valid.length} repaired=${repaired} discarded=${total - valid.length}${droppedFields.length ? ` (dropped field(s): ${droppedFields.join(', ')})` : ''}`);
  const base = Array.isArray(result) ? {} : result;
  return { ...base, paths: valid };
}
// Root-cause fix: rerankPaths sends each path's ORIGINAL category (from
// PATH_CATEGORY_ENUM: "Strong Evidence" / "Worth Exploring" / "Growth Path" /
// "Independent Path") as input context, but the rerank schema requires a
// DIFFERENT 5-value set (RERANK_CATEGORY_ENUM). The prompt's "even if its
// category stays the same as before" wording can read as "reuse that exact
// label" — which, when it happens, does so for every item at once (all 4
// paths get the "unchanged" treatment in the same response), producing
// valid=0 rather than a scattered single-item failure. Since these two
// category systems have a genuine, unambiguous 1:1 conceptual
// correspondence (they were designed as parallel stages of the same
// classification), mapping one onto the other is a safe, obvious
// normalization — not a guess at ambiguous intent.
const RERANK_CATEGORY_CROSSWALK = {
  'strong evidence': 'Best Paths to Explore First',
  'worth exploring': 'Strong Alternatives',
  'growth path': 'Growth Directions',
  'independent path': 'Longer-Term / Independent Paths',
};
function normalizeRerankCategory(raw){
  if(typeof raw !== 'string') return raw;
  const trimmed = raw.trim();
  if(RERANK_CATEGORY_ENUM.includes(trimmed)) return trimmed;
  const lower = trimmed.toLowerCase();
  if(Object.prototype.hasOwnProperty.call(RERANK_CATEGORY_CROSSWALK, lower)) return RERANK_CATEGORY_CROSSWALK[lower];
  return normalizeEnum(trimmed, RERANK_CATEGORY_ENUM); // casing-only fallback; leaves genuinely unrecognized values untouched
}
// Live bug fix: rerankPaths items were previously checked all-or-nothing in
// validateRerankResult — one path with a synonymous-but-non-canonical fit
// value (e.g. "Weak") failed the ENTIRE rerank, even though the other items
// were fine and even though the underlying path data isn't lost either way
// (mergeRerankIntoPaths already keeps a path's prior category/fit values
// unchanged if no valid delta exists for it — see below). This now mirrors
// the skills/paths item-level pattern: normalize each item (including the
// FIT_VALUE_SYNONYMS and RERANK_CATEGORY_CROSSWALK mappings above), keep
// anything that clears the bar, drop anything that doesn't, and log counts
// AND which field(s) caused each drop (names only) without ever logging
// story/user content. `knownTitles` is passed in via closure from
// rerankPaths so a title that doesn't match any existing path can be
// filtered out here too, consistent with everything else.
// Live bug fix: rerankPaths items were previously checked all-or-nothing —
// an invalid fitLifestyle (or fitInterest) discarded the ENTIRE item,
// including an otherwise-perfectly-good title/category reclassification.
// That's backwards: title+category are the actual point of a rerank call
// (that's what the user sees move between sections); fitInterest/fitLifestyle
// are optional display refinements. So now: title+category alone determine
// whether an item is usable; an invalid fit field is stripped from that item
// individually (never invents a value) rather than sinking the whole thing —
// mergeRerankIntoPaths already falls back to the path's PRIOR fit value when
// the delta omits one, so stripping is equivalent to "no update this round,"
// never a fabricated judgment. This is on top of the FIT_VALUE_SYNONYMS /
// RERANK_CATEGORY_CROSSWALK mappings above, which still normalize obvious
// variants to a real value first — stripping is the last resort, not the
// first move.
function normalizeRerankResult(result, knownTitles){
  if(!result || typeof result !== 'object') return result;
  let ranked = result.rankedPaths;
  if(!Array.isArray(ranked)) ranked = result.paths || null;
  if(!Array.isArray(ranked)) return result;

  const knownLower = (knownTitles || []).map(t => String(t).toLowerCase());
  const total = ranked.length;
  let normalizedCount = 0;
  let discardedCount = 0;
  const valid = [];
  const droppedFieldSet = new Set();
  // Diagnostics for the fit-value fields specifically (item 2 of the request):
  // recognized = already canonical, normalized = fixed via synonym/casing map,
  // invalid = no confident mapping found (field stripped, not the item).
  let fitRecognized = 0, fitNormalized = 0, fitInvalid = 0;
  const invalidFitSamples = new Set();

  function checkFitField(rawValue){
    if(rawValue === undefined) return { value: undefined, ok: true };
    if(typeof rawValue === 'string' && STRENGTH_ENUM.includes(rawValue.trim())){
      fitRecognized++;
      return { value: rawValue.trim(), ok: true };
    }
    const mapped = normalizeFitValue(rawValue);
    if(STRENGTH_ENUM.includes(mapped)){
      fitNormalized++;
      return { value: mapped, ok: true };
    }
    fitInvalid++;
    if(typeof rawValue === 'string' && rawValue.trim()) invalidFitSamples.add(rawValue.trim());
    return { value: undefined, ok: false }; // stripped, not fabricated
  }

  for(const rawItem of ranked){
    if(!rawItem || typeof rawItem !== 'object'){ discardedCount++; droppedFieldSet.add('not an object'); continue; }
    const item = {
      ...rawItem,
      title: typeof rawItem.title === 'string' ? rawItem.title.trim() : rawItem.title,
      category: normalizeRerankCategory(rawItem.category),
    };

    const fitInterestCheck = checkFitField(rawItem.fitInterest);
    if(fitInterestCheck.ok) item.fitInterest = fitInterestCheck.value; else { delete item.fitInterest; droppedFieldSet.add('fitInterest'); }
    const fitLifestyleCheck = checkFitField(rawItem.fitLifestyle);
    if(fitLifestyleCheck.ok) item.fitLifestyle = fitLifestyleCheck.value; else { delete item.fitLifestyle; droppedFieldSet.add('fitLifestyle'); }

    const titleOk = isNonEmptyStr(item.title) && (knownLower.length === 0 || knownLower.includes(item.title.toLowerCase()));
    const categoryOk = RERANK_CATEGORY_ENUM.includes(item.category);

    if(titleOk && categoryOk){
      let changed = false;
      try{ changed = JSON.stringify(rawItem) !== JSON.stringify(item); }catch(e){ /* ignore */ }
      if(changed) normalizedCount++;
      valid.push(item);
    } else {
      discardedCount++;
      if(!isNonEmptyStr(item.title) || (knownLower.length && !knownLower.includes(String(item.title).toLowerCase()))) droppedFieldSet.add('title');
      if(!categoryOk) droppedFieldSet.add('category');
    }
  }
  safeLog('log', `[CareerLaunch][rerank][item_validation] returned=${total} valid=${valid.length} normalized=${normalizedCount} discarded=${discardedCount}${droppedFieldSet.size ? ` dropped field(s): ${[...droppedFieldSet].join(', ')}` : ''}`);
  if(fitNormalized || fitInvalid){
    safeLog('log', `[CareerLaunch][rerank][fit_normalization] recognized=${fitRecognized} normalized=${fitNormalized} invalid=${fitInvalid}${invalidFitSamples.size ? ` invalid_value_sample=${[...invalidFitSamples].slice(0,3).join('|')}` : ''}`);
  }
  return { ...result, rankedPaths: valid };
}

/* ============================= VALIDATORS (schema + relational integrity, reliability item G) ============================= */
function isNonEmptyStr(v){ return typeof v === 'string' && v.trim().length > 0; }

// Item-level resilience for skills (shared by analyzeSkills and
// submitAddExperience, since both use skillsTool/validateSkillsResult): one
// malformed skill object must never sink an otherwise-usable assessment. This
// checks a single skill against the minimum bar — non-empty name, non-empty
// evidence, valid strength — used to both filter (normalizeSkillsResult) and
// defensively re-check (validateSkillsResult) below.
const MIN_VALID_SKILLS = 2;
function isValidSkillItem(s){
  return !!s && typeof s === 'object'
    && isNonEmptyStr(s.name)
    && isNonEmptyStr(s.evidence)
    && STRENGTH_ENUM.includes(normalizeFitValue(s.strength));
}
// Normalizes strength casing/synonyms (same tolerance as paths/rerank), then
// DROPS any skill that still doesn't meet the minimum bar — never invents a
// replacement, only removes. This runs before validation, so a response with
// several good skills and one malformed one passes immediately with the good
// ones intact; only a response with too FEW usable skills after filtering
// escalates to the existing reshape/full-repair tiers in callStructured,
// which is the "attempt a narrow repair only if useful" behavior — repair is
// not worth an extra API call when we already have enough valid skills to
// show a useful assessment.
function normalizeSkillsResult(result){
  if(!result || !Array.isArray(result.skills)) return result;
  const total = result.skills.length;
  const valid = result.skills
    .map(s => (s && typeof s === 'object') ? { ...s, strength: normalizeFitValue(s.strength) } : s)
    .filter(isValidSkillItem);
  safeLog('log', `[CareerLaunch][skills][item_validation] returned=${total} valid=${valid.length} discarded=${total - valid.length}`);
  return { ...result, skills: valid };
}

function validateSkillsResult(result){
  if(!result || !Array.isArray(result.skills)) return { ok:false, reason:'skills array is missing' };
  // By this point normalizeSkillsResult has already filtered out anything
  // malformed — this loop is a defensive re-check, not the primary
  // enforcement point, in case validateSkillsResult is ever called without
  // the normalize step running first.
  for(const s of result.skills){
    if(!isValidSkillItem(s)) return { ok:false, reason:'a skill is missing a name, evidence, or a valid strength value' };
  }
  if(result.skills.length < MIN_VALID_SKILLS){
    return { ok:false, reason:`only ${result.skills.length} valid skill(s) found after filtering out malformed items — need at least ${MIN_VALID_SKILLS} for a useful assessment` };
  }
  return { ok:true };
}

// Reused by both analyzeSkills and submitAddExperience (same schema, same
// failure mode): reinforces the exact shape in plain language, for the case
// where the model fell back to unstructured text and skipped the API's own
// schema enforcement entirely — the improved repair instruction requested
// after the live "a skill is missing a name" failure.
const SKILLS_REPAIR_HINT = `The schema requires skills: [{name, evidence, strength}] — every single item in that array MUST have a non-empty "name". Never return a skill object without a name; if you're not confident enough in an item to name it, leave it out entirely rather than including it with a missing or empty name.`;

// Same pattern as SKILLS_REPAIR_HINT: the field most likely to get silently
// dropped by a model that fell back to unstructured text (bypassing the
// schema's own enum enforcement) is "transition" — reinforce it explicitly
// in plain language for the repair passes.
const PATHS_REPAIR_HINT = `Every path object MUST include transition — one of exactly "Strong" | "Moderate" | "Developing" | "Needs More Information", never omitted, never any other wording. Also required on every path: title, entryPoint, progression, category, why, and transfers (as an array). If you cannot supply all of those for a given path, leave that path out entirely rather than submitting it incomplete.`;
const RERANK_REPAIR_HINT = `The "category" field for every rankedPaths entry MUST be exactly one of these five strings: "Best Paths to Explore First", "Strong Alternatives", "Growth Directions", "Longer-Term / Independent Paths", "Lower Interest Based on What You Told Us". Do NOT reuse an original path's old category label (such as "Strong Evidence", "Worth Exploring", "Growth Path", or "Independent Path") — those are a different, earlier classification and are not valid values here, even for a path whose ranking stays similar.`;
const REFINE_PATHS_REPAIR_HINT = `${PATHS_REPAIR_HINT} ${RERANK_REPAIR_HINT} The top-level changeSummary field is REQUIRED (max 25 words) and must name the preferences that drove the refresh. Every path MUST include fitInterest and fitLifestyle (interest/lifestyle fit, separate from transition which is evidence fit only). transition must reflect story-supported evidence — never Strong solely because the user wants the path.`;
// Diagnosis: repair responses were dropping first7Days/learningStrategy
// specifically because the generic repair note only said "return a
// corrected, complete result" — it never named which fields a truncated or
// off-format response is most likely to have lost. These hints call out the
// exact required field names so a repair attempt can't "forget" one while
// fixing something else.
const ACTION_PLAN_REPAIR_HINT = `The schema requires ALL FOUR time-period arrays — first7Days, days8to30, days31to60, days61to90 — plus nextBestStep. Never omit any of the four arrays, even if you need to shorten individual items (each item max ~80 characters) to fit. A short but complete response covering all four periods is required, not a longer response missing one.`;
const DIRECTION_REPAIR_HINT = `The schema requires learningStrategy as an array (it may be empty if there's genuinely nothing to add, but the field itself must always be present) — never omit it. Also always required: careerSequence with now/next/later, searchTerms, and positioning. Keep every item short (learning items max ~70 characters, sequence descriptions max ~90) so the complete response fits.`;

function validatePathsResult(result){
  if(!result || !Array.isArray(result.paths)) return { ok:false, reason:'paths array is missing' };
  // By this point normalizePathsResult has already filtered out anything
  // malformed — this loop is a defensive re-check, not the primary
  // enforcement point, in case validatePathsResult is ever called without
  // the normalize step running first.
  for(const p of result.paths){
    if(!isValidPathItem(p)) return { ok:false, reason:`a path is missing a required field: ${firstInvalidPathField(p)}` };
  }
  if(result.paths.length < MIN_VALID_PATHS){
    return { ok:false, reason:`only ${result.paths.length} valid path(s) found after filtering out malformed items — need at least ${MIN_VALID_PATHS} for a useful set of options` };
  }
  return { ok:true };
}

// By this point normalizeRerankResult has already filtered every item down
// to ones that are structurally sound AND have canonical fit values (mapping
// synonyms like "Weak" first) — so this only needs to check there's at least
// one usable result left. Zero valid items is the only case actually worth
// a repair round-trip; one bad item among several good ones never reaches
// here as a failure at all, because normalize already dropped just that one.
function validateRerankResult(result){
  if(!result || !Array.isArray(result.rankedPaths) || result.rankedPaths.length === 0){
    return { ok:false, reason:'no valid rankedPaths entries remained after filtering out malformed items' };
  }
  if(!isNonEmptyStr(result.changeSummary)) return { ok:false, reason:'changeSummary is missing' };
  return { ok:true };
}

function normalizeRefinePathsResult(result){
  const normalized = normalizePathsResult(result);
  if(!normalized || !Array.isArray(normalized.paths)) return result;
  const paths = normalized.paths.map(p => ({
    ...p,
    category: normalizeRerankCategory(p.category),
    fitInterest: p.fitInterest !== undefined ? normalizeFitValue(p.fitInterest) : p.fitInterest,
    fitLifestyle: p.fitLifestyle !== undefined ? normalizeFitValue(p.fitLifestyle) : p.fitLifestyle,
    fitEvidence: p.fitEvidence !== undefined ? normalizeFitValue(p.fitEvidence) : p.fitEvidence,
  })).filter(p => isValidPathItem(p) && RERANK_CATEGORY_ENUM.includes(p.category));
  return {
    changeSummary: typeof result.changeSummary === 'string' ? result.changeSummary.trim() : '',
    paths,
  };
}

function validateRefinePathsResult(result){
  const pathCheck = validatePathsResult(result);
  if(!pathCheck.ok) return pathCheck;
  if(!isNonEmptyStr(result.changeSummary)) return { ok:false, reason:'changeSummary is missing' };
  for(const p of result.paths){
    if(!RERANK_CATEGORY_ENUM.includes(p.category)){
      return { ok:false, reason:`refinement category invalid for path "${p.title}"` };
    }
  }
  return { ok:true };
}

// Merges the compact rerank delta back into the already-valid path objects.
// Unchanged fields (transfers, gaps, entryPoint, progression, workEnvironment,
// relevance, transition, fitEvidence, why) are never touched — they simply
// stay whatever they already were. If the model omits a path entirely from
// rankedPaths, that path is kept exactly as-is rather than dropped, so no path
// data can ever disappear because of a rerank call.
function mergeRerankIntoPaths(existingPaths, rankedPaths){
  const deltaByTitle = {};
  rankedPaths.forEach(rp => { deltaByTitle[String(rp.title).toLowerCase()] = rp; });
  return existingPaths.map(p => {
    const delta = deltaByTitle[String(p.title).toLowerCase()];
    if(!delta) return p;
    return {
      ...p,
      category: delta.category || p.category,
      whyChanged: delta.whyChanged || undefined,
      fitInterest: delta.fitInterest || p.fitInterest,
      fitLifestyle: delta.fitLifestyle || p.fitLifestyle,
    };
  });
}

// Item-level resilience for the profile delta (mirrors skills/paths): a
// malformed entry in one array must never sink the others, and an empty
// result (nothing new signaled this turn) is a perfectly valid outcome, not
// a failure — this must stay lenient since most turns legitimately have no
// new preference to extract.
function isValidProfileItem(v){ return typeof v === 'string' && v.trim().length > 0; }
function normalizeProfileDeltaResult(result){
  if(!result || typeof result !== 'object') return result;
  const clean = (arr) => Array.isArray(arr) ? arr.filter(isValidProfileItem).map(s => s.trim()) : [];
  return {
    interests: clean(result.interests),
    dislikes: clean(result.dislikes),
    preferences: clean(result.preferences),
    summary: typeof result.summary === 'string' ? result.summary.trim() : '',
  };
}
function validateProfileDeltaResult(result){
  if(!result || typeof result !== 'object') return { ok:false, reason:'profile delta result is missing' };
  if(!Array.isArray(result.interests) || !Array.isArray(result.dislikes) || !Array.isArray(result.preferences)){
    return { ok:false, reason:'interests/dislikes/preferences must be arrays' };
  }
  return { ok:true };
}

function validateRoadmapFoundationResult(result){
  if(!result) return { ok:false, reason:'foundation result is empty' };
  if(!isNonEmptyStr(result.whereYouAre)) return { ok:false, reason:'whereYouAre is missing' };
  if(!Array.isArray(result.transfers)) return { ok:false, reason:'transfers is missing or not an array' };
  if(!Array.isArray(result.needsMoreInfo)) return { ok:false, reason:'needsMoreInfo is missing or not an array' };
  if(!Array.isArray(result.gaps)) return { ok:false, reason:'gaps is missing or not an array' };
  return { ok:true };
}

function validateRoadmapActionPlanResult(result){
  if(!result) return { ok:false, reason:'action plan result is empty' };
  for(const k of ['first7Days','days8to30','days31to60','days61to90']){
    if(!Array.isArray(result[k])) return { ok:false, reason:`${k} is missing or not an array` };
  }
  if(!isNonEmptyStr(result.nextBestStep)) return { ok:false, reason:'nextBestStep is missing' };
  return { ok:true };
}

function validateRoadmapDirectionResult(result){
  if(!result) return { ok:false, reason:'direction result is empty' };
  if(!result.careerSequence || !result.careerSequence.now || !result.careerSequence.next || !result.careerSequence.later){
    return { ok:false, reason:'careerSequence missing now/next/later' };
  }
  if(!Array.isArray(result.learningStrategy)) return { ok:false, reason:'learningStrategy is missing or not an array' };
  if(!Array.isArray(result.searchTerms)) return { ok:false, reason:'searchTerms is missing or not an array' };
  if(!isNonEmptyStr(result.positioning)) return { ok:false, reason:'positioning is missing' };
  return { ok:true };
}

function validateKitResult(result, sourceEvidenceText){
  if(!result || !Array.isArray(result.resumeBullets)) return { ok:false, reason:'resumeBullets missing' };
  if(result.resumeBullets.length > 4) return { ok:false, reason:'resumeBullets exceeds maximum of 4' };
  if(!Array.isArray(result.linkedinHeadlines) || result.linkedinHeadlines.length !== 3) return { ok:false, reason:'linkedinHeadlines must have exactly 3 entries' };
  if(!isNonEmptyStr(result.linkedinAbout)) return { ok:false, reason:'linkedinAbout is missing' };
  // Evidence-traceability heuristic (items A/B/G4): a number in generated resume
  // copy that never appears in the user's own story is very likely fabricated.
  for(const b of result.resumeBullets){
    const bad = findUnsupportedNumerals(b.text, sourceEvidenceText);
    if(bad.length) return { ok:false, reason:`resume bullet contains a number not present in the user's evidence ("${bad.join(', ')}") — remove it, don't invent metrics` };
  }
  const badAbout = findUnsupportedNumerals(result.linkedinAbout, sourceEvidenceText);
  if(badAbout.length) return { ok:false, reason:`linkedinAbout contains a number not present in the user's evidence ("${badAbout.join(', ')}")` };
  return { ok:true };
}

function validateStoryBankResult(result){
  if(!result || !Array.isArray(result.stories) || result.stories.length === 0) return { ok:false, reason:'stories array missing or empty' };
  for(const s of result.stories){
    if(!isNonEmptyStr(s.category)) return { ok:false, reason:'a story entry is missing a category' };
    if(!['ready','needs_more'].includes(s.status)) return { ok:false, reason:`a story entry has an invalid status: ${s.status}` };
    if(s.status === 'ready' && !isNonEmptyStr(s.story)) return { ok:false, reason:'a story marked ready has no story text' };
  }
  return { ok:true };
}

function validateJdResult(result){
  if(!result || !Array.isArray(result.marketAsks) || result.marketAsks.length === 0) return { ok:false, reason:'marketAsks missing or empty' };
  if(!Array.isArray(result.youAlreadyHave) || !Array.isArray(result.shouldStrengthen)) return { ok:false, reason:'youAlreadyHave/shouldStrengthen must be arrays' };
  if(!['Strong Match','Worth Considering','Stretch Opportunity','Needs More Information'].includes(result.overallFit)) return { ok:false, reason:`invalid overallFit value: ${result.overallFit}` };
  return { ok:true };
}

function validateTextResult(field){
  return function(result){
    if(!result || !isNonEmptyStr(result[field])) return { ok:false, reason:`${field} is missing or empty` };
    return { ok:true };
  };
}

    <h1 style="font-size:34px;">We found ${state.paths.length} career paths you may not have considered.</h1>
    <p style="max-width:560px;">These are possibilities to explore, not verdicts. Tap one that resonates, or one that doesn't feel like you — you'll get a chance to talk it through next.</p>`;
  if(state.reranked && state.changeSummary){
    html += `<div class="change-summary mt-32"><strong>Your recommendations changed.</strong> ${state.changeSummary}</div>`;
  }
  CATEGORY_ORDER.forEach(cat=>{
    if(!byCat[cat] || !byCat[cat].length) return;
    html += `<div class="path-category"><h3>${cat}</h3>`;
    byCat[cat].forEach(p=>{
      const sel = state.chosenPath && state.chosenPath.title===p.title;
      const transClass = 'transition-' + (p.transition||'').replace(/\s+/g,'');
      html += `<div class="path-card ${sel?'selected':''}" data-path="${encodeURIComponent(p.title)}">
        <div class="path-title">${p.title}</div>
        ${p.whyChanged ? `<div class="path-changed">${p.whyChanged}</div>`:''}
        <div class="path-why">${p.why}</div>
        ${p.entryPoint ? `<div class="sequence-inline"><strong>Entry point:</strong> ${p.entryPoint}${p.progression?` &rarr; <strong>Progression:</strong> ${p.progression}`:''}</div>`:''}
        <div class="path-meta">
          <div><span class="k">Transfers</span><div class="path-tags">${(p.transfers||[]).map(t=>`<span class="mini-tag">${t}</span>`).join('')}</div></div>
          <div><span class="k">Still developing</span><div class="path-tags">${(p.gaps||[]).map(t=>`<span class="mini-tag">${t}</span>`).join('')}</div></div>
          <div><span class="k">Transition</span><div class="${transClass}" style="font-weight:600;">${p.transition}</div></div>
        </div>
        <div class="path-meta">
          <div><span class="k">Work environment</span>${p.workEnvironment||''}</div>
          <div><span class="k">Relevant to</span><div class="path-tags">${(p.relevance||[]).map(t=>`<span class="mini-tag">${t}</span>`).join('')}</div></div>
        </div>
        ${(p.fitEvidence||p.fitInterest)?`<div class="fit-dims">
          <div class="fit-dim"><span class="k">Evidence</span>${p.fitEvidence||p.transition||'—'}</div>
          <div class="fit-dim"><span class="k">Interest</span>${p.fitInterest||'—'}</div>
          <div class="fit-dim"><span class="k">Lifestyle fit</span>${p.fitLifestyle||'—'}</div>
        </div>`:''}
      </div>`;
    });
    html += `</div>`;
  });
  html += `<div class="mt-40"><button class="btn btn-primary" id="toConvo">Let's Talk About These</button></div></div></div>`;
  return html;
}
