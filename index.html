<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerLaunch AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper:#EEEDE6;
    --paper-dim:#E4E2D8;
    --card:#FFFFFF;
    --ink:#20292C;
    --ink-soft:#5B6669;
    --ink-faint:#8B9396;
    --highlight:#E3A83B;
    --highlight-soft:rgba(227,168,59,0.24);
    --highlight-line:rgba(227,168,59,0.55);
    --sage:#4F7561;
    --sage-soft:rgba(79,117,97,0.14);
    --clay:#B5603F;
    --clay-soft:rgba(181,96,63,0.13);
    --line:#D7D3C4;
    --radius:14px;
    --shadow: 0 1px 2px rgba(32,41,44,0.04), 0 8px 24px rgba(32,41,44,0.06);
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5;}
  #app{max-width:100%;min-height:100vh;}
  .wrap{max-width:720px;margin:0 auto;padding:0 24px;}
  .wrap-wide{max-width:900px;margin:0 auto;padding:0 24px;}

  h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-0.01em;margin:0;}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--highlight);}
  p{color:var(--ink-soft);}
  a{color:inherit;}

  button{font-family:var(--sans);cursor:pointer;border:none;background:none;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 26px;border-radius:999px;font-size:15px;font-weight:600;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;min-height:48px;}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(32,41,44,0.18);}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-text{padding:8px 4px;font-weight:600;color:var(--ink-soft);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;}
  .btn-text:hover{color:var(--ink);text-decoration-color:var(--ink);}
  .btn-sm{padding:9px 16px;font-size:13px;min-height:36px;}

  .screen{padding:64px 0 96px;animation:rise .5s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){.screen{animation:none;}*{transition:none !important;animation:none !important;}}

  .progress-bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 0;}
  .progress-inner{max-width:720px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:10px;}
  .progress-steps{display:flex;gap:6px;flex:1;}
  .progress-steps span{height:4px;flex:1;background:var(--line);border-radius:2px;overflow:hidden;position:relative;}
  .progress-steps span.done{background:var(--ink);}
  .progress-steps span.current{background:var(--line);}
  .progress-steps span.current::after{content:'';position:absolute;inset:0;background:var(--highlight);transform-origin:left;animation:fill 1.2s ease forwards;}
  @keyframes fill{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  .progress-label{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;}
  .brand-tiny{font-family:var(--serif);font-weight:600;font-size:15px;cursor:pointer;}

  .nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0;}
  .brand{font-family:var(--serif);font-weight:600;font-size:19px;}
  .brand em{font-style:normal;color:var(--highlight);}

  .hero{padding:56px 0 40px;text-align:left;}
  .hero h1{font-size:clamp(38px,6vw,60px);line-height:1.04;max-width:780px;}
  .hero h1 mark{background:none;color:var(--ink);position:relative;display:inline;}
  .hero h1 mark::after{content:'';position:absolute;left:-2px;right:-2px;bottom:2px;height:0.34em;background:var(--highlight-soft);border-radius:2px;z-index:-1;}
  .hero p.lede{font-size:18px;max-width:600px;margin-top:20px;}
  .hero .micro{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);margin-top:18px;}
  .hero-ctas{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap;}

  .translate-demo{margin-top:64px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);}
  .translate-demo .before{font-family:var(--serif);font-size:19px;font-style:italic;color:var(--ink);margin-bottom:18px;}
  .translate-demo .before span{background:var(--highlight-soft);padding:1px 4px;border-radius:3px;}
  .translate-tags{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:999px;background:var(--sage-soft);color:var(--sage);border:1px solid rgba(79,117,97,0.25);}

  .section{padding:64px 0;border-top:1px solid var(--line);}
  .section h2{font-size:28px;margin-bottom:8px;}
  .section .lede{max-width:540px;}
  .how-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px;margin-top:36px;}
  .how-step .num{font-family:var(--mono);font-size:12px;color:var(--highlight);margin-bottom:8px;}
  .how-step h3{font-size:17px;margin-bottom:6px;}
  .how-step p{font-size:14px;}
  .who-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;}
  .who-chip{font-size:13.5px;padding:9px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);}
  .diff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:32px;}
  .diff-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
  .diff-card .not{font-family:var(--mono);font-size:11px;color:var(--clay);text-decoration:line-through;margin-bottom:8px;}
  .diff-card h3{font-size:16px;}
  .pricing-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px;}
  @media (max-width:600px){.pricing-row{grid-template-columns:1fr;}}
  .price-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;}
  .price-card.featured{border-color:var(--ink);position:relative;}
  .price-card .amt{font-family:var(--serif);font-size:34px;margin:10px 0;}
  .price-card ul{margin:14px 0 0;padding-left:18px;font-size:14px;color:var(--ink-soft);}
  .price-card li{margin-bottom:6px;}
  .final-cta{padding:80px 0;text-align:center;border-top:1px solid var(--line);}
  .final-cta h2{font-size:34px;max-width:560px;margin:0 auto 24px;}
  footer{padding:30px 0 50px;font-size:12.5px;color:var(--ink-faint);border-top:1px solid var(--line);}

  .intake-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow);}
  textarea#storyInput, textarea.plain-textarea{width:100%;min-height:260px;border:none;outline:none;resize:vertical;font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--ink);padding:22px;background:transparent;}
  textarea#storyInput::placeholder, textarea.plain-textarea::placeholder{color:var(--ink-faint);font-style:italic;}
  .intake-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 14px;border-top:1px solid var(--line);}
  .mic-btn{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;background:var(--sage-soft);color:var(--sage);font-weight:600;font-size:13.5px;border:1px solid rgba(79,117,97,0.3);}
  .mic-btn.recording{background:var(--clay-soft);color:var(--clay);border-color:rgba(181,96,63,0.35);}
  .mic-dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
  .mic-btn.recording .mic-dot{animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
  .wordcount{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}
  .prompts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
  .prompt-chip{font-size:13px;padding:8px 13px;border-radius:10px;background:var(--card);border:1px dashed var(--line);color:var(--ink-soft);}
  .prompt-chip:hover{border-color:var(--ink-soft);color:var(--ink);}
  .privacy-note{font-size:12.5px;color:var(--ink-faint);margin-top:22px;max-width:500px;}

  .analyzing-wrap{text-align:center;padding:100px 0;}
  .analyzing-wrap .spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--highlight);margin:0 auto 26px;animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .analyzing-wrap .msg{font-family:var(--serif);font-size:20px;font-style:italic;}

  .big-stat{font-family:var(--serif);font-size:clamp(32px,5vw,46px);line-height:1.1;margin-bottom:6px;}
  .big-stat mark{background:none;color:var(--highlight);}

  .skill-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;}
  .skill-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
  .skill-name{font-family:var(--serif);font-size:19px;font-weight:600;}
  .strength-pill{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .strength-Strong{background:var(--sage-soft);color:var(--sage);}
  .strength-Moderate{background:var(--highlight-soft);color:#8a6417;}
  .strength-Developing{background:var(--clay-soft);color:var(--clay);}
  .strength-NeedsMoreInformation, .strength-Needs{background:var(--paper-dim);color:var(--ink-faint);}
  .skill-evidence{font-size:14px;color:var(--ink-soft);margin-top:10px;padding:10px 14px;background:var(--paper-dim);border-left:2px solid var(--highlight);border-radius:0 6px 6px 0;}
  .skill-evidence .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-faint);display:block;margin-bottom:4px;}
  .skill-actions{display:flex;gap:8px;margin-top:14px;}
  .validate-btn{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid var(--line);color:var(--ink-soft);}
  .validate-btn.active-yes{background:var(--sage-soft);border-color:transparent;color:var(--sage);}
  .validate-btn.active-no{background:var(--clay-soft);border-color:transparent;color:var(--clay);}
  .skill-card.rejected{opacity:0.5;}

  .path-category{margin-top:44px;}
  .path-category h3{font-size:15px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .path-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;cursor:pointer;transition:border-color .15s ease;}
  .path-card:hover{border-color:var(--ink-soft);}
  .path-card.selected{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
  .path-title{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px;}
  .path-why{font-size:14px;margin-bottom:12px;}
  .path-changed{font-size:12.5px;color:var(--highlight);font-style:italic;margin-bottom:10px;}
  .path-meta{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;margin-top:10px;}
  .path-meta .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:3px;}
  .path-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .mini-tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--paper-dim);color:var(--ink-soft);}
  .transition-Strong{color:var(--sage);}
  .transition-Moderate{color:#8a6417;}
  .transition-Developing, .transition-NeedsMoreInformation{color:var(--clay);}
  .fit-dims{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .fit-dim{font-size:12px;}
  .fit-dim .k{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--ink-faint);display:block;}
  .sequence-inline{font-size:12.5px;color:var(--ink-faint);margin-top:8px;}
  .change-summary{background:var(--highlight-soft);border-radius:10px;padding:14px 18px;font-size:14px;color:#6b4d10;margin-bottom:24px;}

  .convo-log{display:flex;flex-direction:column;gap:14px;margin:26px 0;}
  .convo-bubble{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;font-size:14.5px;}
  .convo-bubble.ai{border-left:2px solid var(--highlight);}
  .learned-card{background:var(--card);border:1px solid var(--ink);border-radius:var(--radius);padding:20px 22px;}
  .learned-card h4{font-family:var(--serif);font-size:17px;margin-bottom:12px;}
  .learned-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .learned-chip{font-size:12.5px;padding:6px 11px;border-radius:999px;background:var(--sage-soft);color:var(--sage);}
  .learned-chip.down{background:var(--clay-soft);color:var(--clay);}
  .convo-input-row{display:flex;gap:10px;margin-top:20px;}
  .convo-input-row input{flex:1;padding:14px 16px;border-radius:10px;border:1px solid var(--line);font-family:var(--sans);font-size:14.5px;outline:none;background:var(--card);}
  .convo-input-row input:focus{border-color:var(--ink);}
  .convo-prompts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}

  .priority-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:24px;}
  .priority-chip{padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;text-align:left;font-weight:500;}
  .priority-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .paywall-card{background:var(--card);border:1px solid var(--ink);border-radius:20px;padding:40px;box-shadow:var(--shadow);margin-top:20px;}
  .paywall-card .amt{font-family:var(--serif);font-size:52px;margin:6px 0 18px;}
  .unlock-list{text-align:left;max-width:420px;margin:22px auto;display:flex;flex-direction:column;gap:10px;font-size:14.5px;color:var(--ink-soft);}
  .unlock-list li{list-style:none;display:flex;gap:10px;align-items:flex-start;}
  .unlock-list li::before{content:'✓';color:var(--sage);font-weight:700;}
  .bring-card{background:var(--paper-dim);border-radius:12px;padding:20px;margin:20px 0;text-align:left;}
  .bring-card h4{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
  .gap-preview{background:var(--clay-soft);border-radius:12px;padding:16px 18px;text-align:left;margin-bottom:20px;font-size:14px;color:var(--clay);}

  .roadmap-section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;}
  .roadmap-section h3{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);margin-bottom:12px;}
  .roadmap-section ul{margin:0;padding-left:20px;font-size:14.5px;color:var(--ink-soft);}
  .roadmap-section li{margin-bottom:6px;}
  .ladder-level{margin-bottom:12px;}
  .ladder-level .lvl-name{font-weight:600;font-size:13.5px;margin-bottom:4px;}
  .not-zero{font-family:var(--serif);font-style:italic;font-size:19px;text-align:center;padding:26px 0;color:var(--ink);}

  .sequence-track{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 32px;}
  @media (max-width:640px){.sequence-track{grid-template-columns:1fr;}}
  .seq-stop{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;position:relative;}
  .seq-stop .seq-lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--highlight);letter-spacing:0.06em;margin-bottom:6px;}
  .seq-stop h4{font-family:var(--serif);font-size:17px;margin-bottom:6px;}
  .seq-stop p{font-size:13px;margin:0;}

  .phase-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 16px;}
  .phase-tab{padding:9px 15px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--card);}
  .phase-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .kit-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;}
  .kit-block h3{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);margin-bottom:12px;}
  .kit-block p, .kit-block li{font-family:var(--serif);font-size:16.5px;color:var(--ink);line-height:1.6;}
  .kit-block ul{padding-left:20px;margin:0;}
  .kit-block li{margin-bottom:6px;}
  .bullet-row{margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--line);}
  .bullet-row:last-child{border-bottom:none;}
  .strengthen-link{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--highlight);text-decoration:underline;cursor:pointer;margin-top:4px;display:inline-block;}
  .strengthen-box{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
  .strengthen-box input{flex:1;min-width:180px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-family:var(--sans);font-size:13.5px;}
  .headline-option{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .headline-option.selected{border-color:var(--ink);background:var(--paper-dim);}
  .headline-option .style-lbl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
  .headline-option .text{font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--ink);}

  .dash-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:24px;}
  @media (min-width:720px){.dash-grid.two-col{grid-template-columns:1fr 1fr;}}
  .dash-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;}
  .dash-card h3{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);margin-bottom:10px;}
  .next-step-card{border-color:var(--ink);}
  .next-step-card p.big{font-family:var(--serif);font-size:19px;color:var(--ink);margin:0;}
  .evidence-lib-card{background:var(--paper-dim);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .evidence-lib-card .theme{font-weight:700;font-size:12.5px;}
  .progress-track{height:8px;background:var(--paper-dim);border-radius:4px;overflow:hidden;margin-top:10px;}
  .progress-track .fill{height:100%;background:var(--sage);}
  .tool-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

  .story-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;}
  .story-card h4{font-family:var(--serif);font-size:17px;margin-bottom:8px;}
  .story-card .status-need{font-size:12.5px;color:var(--clay);font-weight:600;margin-bottom:8px;}
  .story-add-row{display:flex;gap:8px;margin-top:10px;}
  .story-add-row input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-size:13.5px;}

  .jd-result{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;}
  .jd-result h3{font-size:13px;font-family:var(--mono);text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
  .fit-badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;font-family:var(--mono);}

  .error-box{background:var(--clay-soft);border:1px solid rgba(181,96,63,0.3);border-radius:var(--radius);padding:20px 22px;margin:20px 0;font-size:14px;color:var(--clay);}
  .error-box button{margin-top:12px;}

  .center{text-align:center;}

const STEP_ORDER = ['intake','analyzing','skills','paths','conversation','choose','paywall','roadmap','kit','dashboard'];

function fullStoryText(){ return [state.story, ...state.additionalExperiences].filter(Boolean).join('\n\n'); }

/* ============================= CLAUDE API HELPER ============================= */
async function callClaude(system, userPrompt, maxTokens){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: maxTokens || 1000,
      system: system,
      messages: [{ role: "user", content: userPrompt }]
    })
  });
  if(!response.ok){ throw new Error("Request failed"); }
  const data = await response.json();
  const text = (data.content || []).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  if(!text) throw new Error("Empty response");
  return text;
}
function parseJSON(text){
  let cleaned = text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  return JSON.parse(cleaned);
}

const NO_INVENTION_RULE = `Strict evidence rule: never state or imply a fact about the user that they did not provide — no years of experience, revenue, customer counts, team size, percentages, growth rates, employer names, credentials, education, software proficiency, job titles, project scale, geographic reach, awards, or results. If a detail would strengthen something but wasn't given, leave it out rather than inventing it.`;

/* ============================= RENDER ROOT ============================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  const showProgress = STEP_ORDER.includes(state.screen);
  if(showProgress) html += renderProgress();

  switch(state.screen){

    case 'intake': html += renderIntake(); break;
    case 'analyzing': html += renderAnalyzing(); break;
    case 'skills': html += renderSkills(); break;
    case 'paths': html += renderPaths(); break;
    case 'conversation': html += renderConversation(); break;
    case 'choose': html += renderChoose(); break;
    case 'paywall': html += renderPaywall(); break;
    case 'roadmap': html += renderRoadmap(); break;
    case 'kit': html += renderKit(); break;
    case 'dashboard': html += renderDashboard(); break;
    case 'addExperience': html += renderAddExperience(); break;
    case 'storyBank': html += renderStoryBank(); break;
    case 'jdAnalyzer': html += renderJdAnalyzer(); break;
  }
  app.innerHTML = html;
  attachHandlers();

}

const CATEGORY_ORDER = ['Strong Evidence','Best Paths to Explore First','Worth Exploring','Strong Alternatives','Growth Path','Growth Directions','Independent Path','Longer-Term / Independent Paths','Lower Interest Based on What You Told Us'];
function renderPaths(){

  const byCat = {};

  if(state.reranked && state.changeSummary){
    html += `<div class="change-summary mt-32"><strong>Your recommendations changed.</strong> ${state.changeSummary}</div>`;

  CATEGORY_ORDER.forEach(cat=>{
    if(!byCat[cat] || !byCat[cat].length) return;
    html += `<div class="path-category"><h3>${cat}</h3>`;
    byCat[cat].forEach(p=>{
      const sel = state.chosenPath && state.chosenPath.title===p.title;

          <div><span class="k">Transfers</span><div class="path-tags">${(p.transfers||[]).map(t=>`<span class="mini-tag">${t}</span>`).join('')}</div></div>

        </div>`:''}

    });
    html += `</div>`;
  });
  html += `<div class="mt-40"><button class="btn btn-primary" id="toConvo">Let's Talk About These</button></div></div></div>`;
  return html;
}

/* ============================= VOICE INPUT ============================= */
let recognition = null;
function toggleVoice(){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRec){
    document.getElementById('voiceWarning').innerHTML = `<p style="font-size:12.5px;color:var(--clay);margin-top:10px;">Voice input isn't available in this browser. Please type your story instead.</p>`;
    return;
  }
  if(state.recording){ if(recognition) recognition.stop(); state.recording = false; render(); return; }
  recognition = new SpeechRec();
  recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-US';
  let finalTranscript = state.story ? state.story + ' ' : '';
  recognition.onresult = (event)=>{
    let interim = '';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const t = event.results[i][0].transcript;
      if(event.results[i].isFinal) finalTranscript += t + ' '; else interim += t;
    }
    const ta = document.getElementById('storyInput');
    if(ta){
      ta.value = finalTranscript + interim; state.story = ta.value;
      const wc = state.story.trim() ? state.story.trim().split(/\s+/).length : 0;
      const wcEl = document.querySelector('.wordcount'); if(wcEl) wcEl.textContent = wc + ' words';
      const btn = document.getElementById('submitStory'); if(btn) btn.disabled = wc < 8;
    }
  };
  recognition.onerror = ()=>{
    state.recording = false; render();
    document.getElementById('voiceWarning').innerHTML = `<p style="font-size:12.5px;color:var(--clay);margin-top:10px;">We couldn't access your microphone. Please check permissions or type your story instead.</p>`;
  };
  recognition.onend = ()=>{ state.recording = false; render(); };
  recognition.start(); state.recording = true; render();
}

/* ============================= AI FLOW FUNCTIONS ============================= */
async function analyzeSkills(){
  state.screen = 'analyzing'; state.loadingMsg = 'Reading through what you shared…'; state.errorMsg=''; render();
  const system = `You are the Experience Translator inside CareerLaunch AI. A user describes, in their own words, things they've done. Identify transferable professional skills genuinely supported by what they wrote.
${NO_INVENTION_RULE}
Rules: 1) Only include skills with real textual evidence. 2) For each skill, give a short evidence note (max 16 words) paraphrasing what they said, warm plain-language ("You described..."). 3) Assign strength: "Strong" (clear/repeated evidence), "Moderate" (some evidence), or "Developing" (light exposure). 4) Return 4 to 7 skills, strongest first. 5) Respond ONLY with valid JSON, no markdown fences, no preamble:
{"skills":[{"name":"Skill Name","evidence":"You described...","strength":"Strong"}]}`;
  try{
    const text = await callClaude(system, fullStoryText(), 1000);
    const parsed = parseJSON(text);
    state.skills = parsed.skills || [];
    state.screen = 'skills'; render();
  }catch(err){
    state.errorMsg = "We couldn't analyze your story just now. Nothing was lost — you can try again.";
    state.errorRetry = analyzeSkills; state.screen = 'skills'; render();
  }
}

2) Never say someone is unqualified — note what's uncertain instead.
3) Career-level calibration: for each path give an entryPoint (realistic first title, max 5 words) and a progression (next-level title, max 5 words) rather than one senior title.
4) Do not use unverified market-hype claims (e.g. "rare", "in high demand") unless the user's own text supports it. Prefer neutral evidence-based language.
5) For each path give: title (use the entryPoint as the title), category, why (max 20 words, evidence-based), transfers (2-3 skill names from the list), gaps (1-2 short phrases, max 5 words each), transition ("Strong"|"Moderate"|"Developing"|"Needs More Information" = transition practicality), workEnvironment (max 8 words), relevance (subset of ["Employment","Freelance","Consulting","Entrepreneurship"]), fitEvidence/fitInterest/fitLifestyle (one of "Strong","Moderate","Developing","Needs More Information" — interest is "Needs More Information" until the user says otherwise).
6) Respond ONLY with valid JSON, no markdown fences, no preamble:
{"paths":[{"title":"","entryPoint":"","progression":"","category":"","why":"","transfers":[""],"gaps":[""],"transition":"","workEnvironment":"","relevance":[""],"fitEvidence":"","fitInterest":"","fitLifestyle":""}]}`;
  const userPrompt = `User's story:\n${fullStoryText()}\n\nValidated skills:\n${skillsSummaryStr(validated)}`;
  try{

    state.screen = 'paths'; render();
  }catch(err){
    state.errorMsg = "We couldn't map career paths just now. Nothing was lost — you can try again.";
    state.errorRetry = discoverPaths; state.screen = 'paths'; render();
  }
}

async function sendConvo(){
  const input = document.getElementById('convoInput');
  if(!input || !input.value.trim()) return;
  const userText = input.value.trim();
  state.convo.push({who:'user', text: userText});
  input.value=''; render();
  const focusInput = document.getElementById('convoInput'); if(focusInput) focusInput.focus();

  const system = `You are CareerLaunch AI, discussing career discovery results with a user before they choose a direction. Be warm, specific, and evidence-based — never generic encouragement.
${NO_INVENTION_RULE}
If the user reveals a genuine preference (something they want more or less of in their work), extract it in learnedInterests / learnedDislikes as short phrases (max 4 words each, e.g. "business problem-solving", "sales-heavy roles"). Only include something if it's a real signal, not for every message. Keep reply to 2-4 sentences, plain text, no markdown.
Respond ONLY with valid JSON, no markdown fences, no preamble:
{"reply":"","learnedInterests":[],"learnedDislikes":[]}`;
  const context = `Original story: ${state.story}\n\nValidated skills: ${getValidatedSkills().map(s=>s.name).join(', ')}\n\nCareer paths shown: ${state.paths.map(p=>p.title).join(', ')}\n\nAlready known interests: ${state.preferences.interests.join(', ')}\nAlready known dislikes: ${state.preferences.dislikes.join(', ')}\n\nUser's message: ${userText}`;

  try{
    const text = await callClaude(system, context, 500);
    const parsed = parseJSON(text);
    state.convo.push({who:'ai', text: (parsed.reply||'').trim()});
    const newInterests = (parsed.learnedInterests||[]).filter(x=>!state.preferences.interests.includes(x));
    const newDislikes = (parsed.learnedDislikes||[]).filter(x=>!state.preferences.dislikes.includes(x));
    if(newInterests.length || newDislikes.length){
      state.preferences.interests = [...state.preferences.interests, ...newInterests];
      state.preferences.dislikes = [...state.preferences.dislikes, ...newDislikes];
      state.convo.push({who:'learned', interests:newInterests, dislikes:newDislikes});
    }
    render();
  }catch(err){
    state.convo.push({who:'ai', text: "I couldn't process that just now — want to try rephrasing, or continue to choosing a direction?"});
    render();
  }
}

async function rerankPaths(){
  state.screen = 'analyzing'; state.loadingMsg = 'Updating your recommendations…'; state.errorMsg=''; render();
  const validated = getValidatedSkills();
  const system = `You are the career reranking engine inside CareerLaunch AI. Given the user's current career paths and what they've told us they prefer, reclassify and lightly refine the paths.
${NO_INVENTION_RULE}
Rules:
1) Reassign each path's category to exactly one of: "Best Paths to Explore First", "Strong Alternatives", "Growth Directions", "Longer-Term / Independent Paths", "Lower Interest Based on What You Told Us".
2) Never delete a path merely because the user dislikes it — move it to "Lower Interest Based on What You Told Us" instead.
3) For any path whose category changed meaningfully, add a one-sentence "whyChanged" (max 18 words) referencing the specific preference that moved it.
4) Keep title, entryPoint, progression, why, transfers, gaps, transition, workEnvironment, relevance the same unless a preference clearly affects fitLifestyle or fitInterest — update those two if relevant.
5) Also return a top-level changeSummary (max 25 words) naming the preferences that drove the reranking.
6) Respond ONLY with valid JSON, no markdown fences, no preamble:
{"paths":[{"title":"","entryPoint":"","progression":"","category":"","why":"","whyChanged":"","transfers":[""],"gaps":[""],"transition":"","workEnvironment":"","relevance":[""],"fitEvidence":"","fitInterest":"","fitLifestyle":""}],"changeSummary":""}`;
  const userPrompt = `Current paths:\n${JSON.stringify(state.paths)}\n\nValidated skills: ${skillsSummaryStr(validated)}\n\nInterests: ${state.preferences.interests.join(', ')}\nDislikes: ${state.preferences.dislikes.join(', ')}\nPriorities: ${state.priorities.join(', ')}`;
  try{
    const text = await callClaude(system, userPrompt, 1000);
    const parsed = parseJSON(text);
    state.paths = parsed.paths || state.paths;
    state.changeSummary = parsed.changeSummary || '';
    state.reranked = true;
    state.screen = 'paths'; render();
  }catch(err){
    state.errorMsg = "We couldn't update your recommendations just now. Nothing was lost — you can try again.";
    state.errorRetry = rerankPaths; state.screen = 'paths'; render();
  }
}

async function buildRoadmap(){
  state.screen = 'analyzing'; state.loadingMsg = 'Building your personalized roadmap…'; state.errorMsg=''; render();
  const system = `You are the roadmap engine inside CareerLaunch AI. Given a user's chosen career path, validated skills, and priorities, build a personalized roadmap.
${NO_INVENTION_RULE}
Rules:
1) Use a learning ladder that does NOT default to expensive education. Only include a "Formal Education" level if genuinely useful or required — otherwise omit it.
2) Build a Now/Next/Later career sequence: now = the chosen entry point, next = a realistic progression, later = a longer-term or independent direction consistent with the user's priorities (each: short title, one-sentence desc, max 16 words).
3) Build a 7/30/60/90-day action plan: first7 (3-4 concrete actions), days8to30 (3-4), days31to60 (3), days61to90 (2-3). Personalized, not generic filler.
4) Keep every field concise — this must fit a small token budget.
5) Respond ONLY with valid JSON, no markdown fences, no preamble:
{"whereYouAre":"2 sentences max","sequence":{"now":{"title":"","desc":""},"next":{"title":"","desc":""},"later":{"title":"","desc":""}},"transfers":["",""],"understandBetter":["",""],"strengthen":["",""],"learn":[{"level":"Self-Learning","items":["",""]},{"level":"Structured Free Learning","items":[""]}],"plan":{"first7":["","",""],"days8to30":["","",""],"days31to60":["",""],"days61to90":["",""]},"positioning":"2 sentences max","searchTerms":["",""],"nextStep":"one concrete sentence"}`;
  const userPrompt = `Chosen path: ${state.chosenPath.title} (entry point) — ${state.chosenPath.why}\nProgression: ${state.chosenPath.progression||''}\nGaps: ${(state.chosenPath.gaps||[]).join(', ')}\nSkills: ${skillsSummaryStr(getValidatedSkills())}\nPriorities: ${state.priorities.join(', ') || 'not specified'}\nInterests: ${state.preferences.interests.join(', ')}\nDislikes: ${state.preferences.dislikes.join(', ')}`;
  try{
    const text = await callClaude(system, userPrompt, 1000);
    state.roadmap = parseJSON(text);
    state.screen = 'roadmap'; render();
  }catch(err){
    state.errorMsg = "We couldn't build your roadmap just now. Your $19.99 unlock is still active — try again.";

async function buildKit(){
  state.screen = 'analyzing'; state.loadingMsg = 'Positioning your experience professionally…'; state.errorMsg=''; render();
  const validated = getValidatedSkills();
  const system = `You are the Application Kit builder inside CareerLaunch AI. Translate a user's validated real experience into professional resume and LinkedIn language for a specific target path.
${NO_INVENTION_RULE}
Rules:
1) 3-4 resume bullets, one line each, action-verb led, using only what's implied by their story/skills. For any bullet that would be meaningfully stronger with a specific number or detail (events count, frequency, scale) the user didn't provide, add a short "strengthen" field naming exactly what to ask (max 10 words) — otherwise omit "strengthen".
2) Provide exactly 3 linkedinHeadlines, each under 20 words, with distinct styles: "Recruiter Search-Focused" (keyword-forward), "Career Transition-Focused" (names the transition explicitly), "Professional Brand-Focused" (reads as a personal brand statement).
3) One linkedinAbout: 3-4 sentences, first person, warm but professional, grounded only in given evidence.
4) Respond ONLY with valid JSON, no markdown fences, no preamble:
{"resumeBullets":[{"text":"","strengthen":""}],"linkedinHeadlines":[{"style":"Recruiter Search-Focused","text":""},{"style":"Career Transition-Focused","text":""},{"style":"Professional Brand-Focused","text":""}],"linkedinAbout":""}`;
  const userPrompt = `Target path: ${state.chosenPath.title}\nOriginal story: ${state.story}\nValidated skills: ${validated.map(s=>`${s.name}: ${s.evidence}`).join(' | ')}`;
  try{
    const text = await callClaude(system, userPrompt, 1000);
    state.kit = parseJSON(text);
    state.evidenceLibrary = validated.map(s=>({theme:s.name, evidence:s.evidence}));
    state.screen = 'kit'; render();
  }catch(err){
    state.errorMsg = "We couldn't generate your positioning language just now. Try again.";
    state.errorRetry = buildKit; state.screen = 'kit'; render();
  }
}

async function strengthenBullet(i){
  const input = document.getElementById('strengthenInput'+i);
  const detail = input ? input.value.trim() : '';
  const box = document.getElementById('strengthenBox'+i);
  if(!detail){ if(box) box.style.display='none'; return; }
  const bulletEl = document.getElementById('bulletText'+i);
  const original = state.kit.resumeBullets[i].text;
  if(bulletEl) bulletEl.textContent = 'Updating…';
  const system = `You rewrite a single resume bullet to incorporate one new true detail the user just provided. ${NO_INVENTION_RULE} Only use the exact detail given — do not round, estimate, or embellish beyond it. One line, action-verb led. Respond with plain text only: the rewritten bullet, nothing else.`;
  const userPrompt = `Original bullet: ${original}\nNew detail from user: ${detail}`;
  try{
    const text = await callClaude(system, userPrompt, 150);
    state.kit.resumeBullets[i] = { text: text.trim() };
    render();
  }catch(err){
    if(bulletEl) bulletEl.textContent = original;
    if(box) box.style.display='none';
  }
}

async function submitAddExperience(){
  const text = state.addExpText.trim();
  if(!text) return;
  const beforeNames = new Set(state.skills.map(s=>s.name));
  state.additionalExperiences.push(text);
  state.addExpText = '';
  state.screen = 'analyzing'; state.loadingMsg = 'Updating your profile with this new experience…'; render();
  const system = `You are the Experience Translator inside CareerLaunch AI, re-analyzing a user's full history (original story plus newly added experiences) to identify transferable professional skills.
${NO_INVENTION_RULE}
Rules: 1) Only include skills with real textual evidence. 2) Evidence note max 16 words, "You described...". 3) Strength: "Strong"|"Moderate"|"Developing". 4) Return 4 to 8 skills, strongest first. 5) Respond ONLY with valid JSON, no markdown fences, no preamble:
{"skills":[{"name":"","evidence":"","strength":""}]}`;
  try{
    const t = await callClaude(system, fullStoryText(), 1000);
    const parsed = parseJSON(t);
    const newSkills = parsed.skills || [];
    const addedNames = newSkills.filter(s=>!beforeNames.has(s.name)).map(s=>s.name);
    state.skills = newSkills;
    state.changeSummary = addedNames.length ? `New experience added — we found: ${addedNames.join(', ')}.` : 'New experience added — it reinforced skills you already had.';
    state.reranked = false;
    state.screen = 'skills'; render();
  }catch(err){
    state.errorMsg = "We couldn't update your profile with that experience just now. Try again.";
    state.errorRetry = submitAddExperience; state.screen = 'skills'; render();
  }
}

async function openStoryBankFn(){
  state.storyBank = null; state.screen = 'storyBank'; state.errorMsg=''; render();
  await buildStoryBank();
}
async function buildStoryBank(){
  const validated = getValidatedSkills();
  const system = `You build an interview Story Bank inside CareerLaunch AI, using only the user's real, validated experience.
${NO_INVENTION_RULE}
For each of these fixed categories: "Problem I solved", "Difficult customer", "Time I took initiative", "Time I organized something", "Time I led or coordinated people", "Time something went wrong", "Achievement I'm proud of" — either write a short story draft (2-3 sentences, first person, grounded only in given evidence) if there's enough evidence, or mark status "needs_more" with a short prompt (max 14 words) asking for the missing detail.
Respond ONLY with valid JSON, no markdown fences, no preamble:
{"stories":[{"category":"","status":"ready","story":"","prompt":""}]}`;
  const userPrompt = `Story: ${fullStoryText()}\nValidated skills: ${validated.map(s=>`${s.name}: ${s.evidence}`).join(' | ')}`;
  try{
    const text = await callClaude(system, userPrompt, 1000);
    state.storyBank = parseJSON(text);
    render();
  }catch(err){
    state.errorMsg = "We couldn't build your story bank just now. Try again.";
    state.errorRetry = buildStoryBank; render();

}
async function addStoryDetail(i, detail){
  const cat = state.storyBank.stories[i].category;
  const el = document.querySelector(`.story-card:nth-child(${i+1})`);
  const system = `You write one interview story for CareerLaunch AI using only the true detail just given, plus prior known evidence. ${NO_INVENTION_RULE} 2-3 sentences, first person. Respond with plain text only: the story, nothing else.`;
  const userPrompt = `Category: ${cat}\nKnown context: ${fullStoryText()}\nNew detail from user: ${detail}`;
  try{
    const text = await callClaude(system, userPrompt, 200);
    state.storyBank.stories[i] = { category: cat, status: 'ready', story: text.trim() };
    render();
  }catch(err){ /* leave as-is, silent fail on this lightweight feature */ }
}

Rules: marketAsks = 4-6 short requirements/keywords pulled from the posting. youAlreadyHave = subset of the user's validated skills that match. shouldStrengthen = 2-3 gaps between the posting and the user's skills. overallFit = one of "Strong Match","Worth Considering","Stretch Opportunity","Needs More Information" (put this exact value in overallFit).
