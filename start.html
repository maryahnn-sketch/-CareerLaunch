<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Starting iFindWorth…</title>
</head>
<body>
<script>
(function () {
  const PROFILE_KEY = 'careerlaunch.profile.v1';
  try {
    let profile = null;
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      profile = raw ? JSON.parse(raw) : null;
    } catch (_) {
      profile = null;
    }

    const now = new Date().toISOString();
    if (!profile || typeof profile !== 'object' || Array.isArray(profile)) {
      profile = {
        schemaVersion: 2,
        savedAt: now,
        currentScreen: 'intake'
      };
    } else if (!profile.currentScreen || profile.currentScreen === 'landing') {
      profile.schemaVersion = typeof profile.schemaVersion === 'number' ? profile.schemaVersion : 2;
      profile.savedAt = now;
      profile.currentScreen = 'intake';
    }

    localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  } catch (_) {
    // If storage is unavailable, continue into the app normally.
  }

  window.location.replace('/index.html?entry=framer');
})();
</script>
<noscript><a href="/index.html">Continue to iFindWorth</a></noscript>
</body>
</html>
